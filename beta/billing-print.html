<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酷舍對外文件</title><style>
@page{size:A4;margin:0}*{box-sizing:border-box}html,body{margin:0;background:#edf1f4;color:#12213b;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:10px;background:#0b1736}.toolbar button{border:0;border-radius:7px;padding:9px 20px;background:#0f766e;color:#fff;font-weight:800;cursor:pointer}.toolbar .close{background:#526174}.paper{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:13mm 17mm 11mm;box-shadow:0 10px 32px rgba(20,39,65,.15)}.head{display:grid;grid-template-columns:minmax(0,1fr) 43mm;column-gap:7mm;align-items:start;width:100%;min-height:27mm;padding-bottom:4mm;border-bottom:1.2mm solid #0f7c74}.company-block{display:block;min-width:0}.company-logo{display:none}.company{min-width:0}.company h1{margin:0;color:#11817a;font-size:24pt;letter-spacing:1.2pt;line-height:1.08;white-space:nowrap}.company .en{margin-top:1.8mm;color:#334155;font-size:10pt;line-height:1.25;white-space:nowrap}.company .sub{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:1.6mm;row-gap:.8mm;margin-top:1.6mm;color:#526078;font-size:8pt;line-height:1.25}.company .sub span+span::before{content:"｜";margin-right:1.6mm;color:#9aa8b6}.doc-title{min-width:0;text-align:right}.doc-title h2{margin:0;color:#0b1736;font-size:25pt;letter-spacing:5pt;line-height:1.08;white-space:nowrap}.doc-title .no{margin-top:4mm;color:#526078;font-size:11pt;line-height:1.2;white-space:nowrap}.info{display:grid;grid-template-columns:1fr 1fr;gap:0 7mm;margin:5mm 0}.info div{padding:3mm 0 2mm;border-bottom:.35mm solid #c7d2df;font-size:11pt}.label{display:inline-block;min-width:14mm;color:#78899c}.section{margin-top:4mm;border:.35mm solid #8ea3b7;border-radius:3mm 3mm 0 0;overflow:hidden;break-inside:avoid}.section-title{padding:2.5mm 3.5mm;color:#fff;font-size:11pt;font-weight:900;background:linear-gradient(90deg,#092247,#0e8078)}table{width:100%;border-collapse:collapse;table-layout:fixed}.matrix th,.matrix td,.detail th,.detail td{border:.3mm solid #51677d;padding:2.2mm 1.8mm;text-align:center;font-size:9.5pt}.matrix thead th{background:#fff45c;font-weight:900}.matrix thead .house-head{background:#f8fafc}.matrix .grand td{font-weight:900;background:#f3f5f7}.detail thead th{background:#f8fafc;font-weight:900}.detail tbody td:first-child{text-align:left;background:#fff0df;font-weight:800}.detail .num{text-align:right}.detail tfoot td{font-weight:800;background:#f8fafc}.detail tfoot .tax td{font-weight:700}.detail tfoot .total td{border-top:.7mm solid #0f766e;color:#0f766e;font-size:13pt}.note{margin-top:4mm;padding:3.5mm 4mm;border:.35mm solid #c6d4e2;border-radius:3mm;white-space:pre-wrap;font-size:9pt;line-height:1.55;break-inside:avoid}.sign{display:grid;grid-template-columns:1fr 1fr;gap:16mm;margin-top:9mm;align-items:end;break-inside:avoid}.client-sign{padding-top:11mm;border-top:.3mm solid #54677b;text-align:center;color:#64748b;font-size:9pt}.company-seals{text-align:center}.seal-wrap{height:31mm;display:flex;align-items:center;justify-content:center}.seal{max-width:54mm;max-height:30mm;object-fit:contain;mix-blend-mode:multiply}.empty{padding:8mm;text-align:center;color:#64748b}@media print{html,body{background:#fff}.toolbar{display:none}.paper{width:210mm;min-height:0;margin:0;padding:12mm 15mm 10mm;box-shadow:none}.section,.note,.sign{break-inside:avoid}}@media screen and (max-width:850px){.paper{margin:0;transform-origin:top left;transform:scale(calc(100vw / 794));}.toolbar{width:100vw}}
</style></head><body><div class="toolbar"><button onclick="window.print()">匯出 PDF／列印</button><button class="close" onclick="window.close()">關閉</button></div><main class="paper" id="paper"></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),n=v=>Number(v)||0,m=v=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n(v));let d={};try{d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(1))))))}catch(e){document.getElementById('paper').innerHTML='<p class="empty">無法讀取文件資料</p>'}const lines=Array.isArray(d.lines)?d.lines:[],houses=[...new Set(lines.map(x=>x.house).filter(Boolean))],items=[...new Set(lines.map(x=>x.item).filter(Boolean))],sum=(arr,key)=>arr.reduce((a,x)=>a+n(key?x[key]:x),0),groups=items.map(item=>{const rows=lines.filter(x=>x.item===item),hasQty=rows.some(x=>x.qty!==null&&x.qty!==undefined&&n(x.qty)>0),hasPrice=rows.some(x=>x.price!==null&&x.price!==undefined);return{item,unit:rows.find(x=>x.unit)?.unit||'—',qty:sum(rows,'qty'),price:n(rows[0]?.price),amount:sum(rows,'amount'),hasQty,hasPrice,pricingType:rows[0]?.pricingType||''}}),matrix=houses.length?`<section class="section"><div class="section-title">戶別施工統計</div><table class="matrix"><thead><tr><th class="house-head">戶別</th>${items.map(i=>`<th>${esc(i)}</th>`).join('')}<th>統計</th></tr></thead><tbody>${houses.map(h=>{const rows=lines.filter(x=>x.house===h);return`<tr><td>${esc(h)}</td>${items.map(i=>`<td>${sum(rows.filter(x=>x.item===i),'qty')||''}</td>`).join('')}<td>${sum(rows,'qty')}</td></tr>`}).join('')}<tr class="grand"><td>合計</td>${items.map(i=>`<td>${sum(lines.filter(x=>x.item===i),'qty')||''}</td>`).join('')}<td>${sum(lines,'qty')||''}</td></tr></tbody></table></section>`:'',c=d.company||{},companyInfo=[c.taxId&&'統編 '+c.taxId,c.address,c.phone,c.line&&'LINE：'+c.line].filter(Boolean);document.title=d.fileName||d.title||'酷舍對外文件';document.getElementById('paper').innerHTML=`<header class="head"><div class="company-block"><img class="company-logo" id="formalCompanyLogo" alt="酷舍企業"><div class="company"><h1>${esc(c.name||'酷舍企業有限公司')}</h1><div class="en">${esc(c.englishName||'Cool Sir Limited Company')}</div><div class="sub">${companyInfo.map(value=>`<span>${esc(value)}</span>`).join('')}</div></div></div><div class="doc-title"><h2>${esc(d.title||'請款單')}</h2><div class="no">單號：${esc(d.number||'—')}</div></div></header><section class="info"><div><span class="label">客戶</span>${esc(d.customer||'—')}</div><div><span class="label">案場</span>${esc(d.project||'—')}</div><div><span class="label">日期</span>${esc(d.date||'—')}</div><div><span class="label">稅額方式</span>${esc(d.taxMode||'—')}</div></section>${matrix}<section class="section"><div class="section-title">${d.documentType==='quotation'?'報價明細':'施工明細'}</div><table class="detail"><thead><tr><th style="width:34%">品名</th><th style="width:12%">單位</th><th style="width:13%">數量</th><th style="width:19%">單價</th><th style="width:22%">金額</th></tr></thead><tbody>${groups.length?groups.map(x=>`<tr><td>${esc(x.item)}${d.documentType==='quotation'&&x.pricingType==='actual'?'<small>（實做實算）</small>':''}</td><td>${esc(x.unit)}</td><td class="num">${x.hasQty?x.qty:''}</td><td class="num">${x.hasPrice?m(x.price):''}</td><td class="num">${x.amount?m(x.amount):''}</td></tr>`).join(''):'<tr><td class="empty" colspan="5">無明細資料</td></tr>'}</tbody><tfoot><tr><td colspan="4">銷售額合計</td><td class="num">${m(d.salesAmount)}</td></tr><tr class="tax"><td colspan="4">稅額</td><td class="num">${m(d.taxAmount)}</td></tr><tr class="total"><td colspan="4">${d.documentType==='quotation'?'報價金額合計':'請款金額合計'}</td><td class="num">${m(d.totalAmount)}</td></tr></tfoot></table></section>${d.publicNote?`<section class="note"><b>備註：</b><br>${esc(d.publicNote)}</section>`:''}<section class="sign"><div class="client-sign">客戶簽章</div><div class="company-seals"><div>公司大小章</div><div class="seal-wrap"><img class="seal" id="formalCompanySeal" alt="公司大小章"></div></div></section>`;
async function loadAssets(){try{const source=await fetch('../enterprise/index.html').then(r=>r.text());for(const [name,id] of [['companyLogoAsset','formalCompanyLogo'],['companySealAsset','formalCompanySeal']]){const start=source.indexOf('const '+name+'=');if(start<0)continue;let end=source.indexOf(';\n',start);if(end<0)end=source.indexOf(';\r',start);const parts=[...source.slice(start,end).matchAll(/'([^']*)'/g)].map(x=>x[1]);if(parts.length)document.getElementById(id).src=parts.join('')}}catch(e){}}loadAssets().finally(()=>{if(new URLSearchParams(location.search).get('print')==='1')setTimeout(()=>window.print(),250)});
</script></body></html>
