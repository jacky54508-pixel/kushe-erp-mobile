name: Build verified P20 receivable action layout
on:
  push:
    branches: [p20-ar-actions-build-20261003]
permissions:
  contents: write
concurrency:
  group: p20-ar-actions-build-20261003
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read isolated build controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - name: Checkout exact beta baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 96904ca2e8484b677f187a69f3542ddbc3301eb9
          path: work
          fetch-depth: 1
      - name: Verify and apply three presentation files only
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 96904ca2e8484b677f187a69f3542ddbc3301eb9
          test "$(git ls-remote origin refs/heads/beta | cut -f1)" = 96904ca2e8484b677f187a69f3542ddbc3301eb9
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 6b9e17a1ef41ea9b7896cd0e3848536d2c255fb4
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          source = pathlib.Path('../control/.p20-ar-actions/payload.txt').read_text().strip()
          data = json.loads(lzma.decompress(base64.b64decode(source, validate=True)))
          manifest = data['manifest']; patch = data['patch'].encode()
          assert hashlib.sha256(patch).hexdigest() == 'a4744b8443f8d9973dae2692445571c75a90ca63f7ae3a758bae0e11d5e408c1'
          expected = {'assets/js/billing.js', 'assets/css/receivables-scoped.css', 'index.html'}
          assert {row['path'] for row in manifest['files']} == expected
          for row in manifest['files']:
              assert hashlib.sha256(pathlib.Path(row['path']).read_bytes()).hexdigest() == row['baseline_sha256']
              assert subprocess.check_output(['git','hash-object',row['path']],text=True).strip() == row['baseline_blob']
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ar-actions.patch'
          target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          for row in manifest['files']:
              assert hashlib.sha256(pathlib.Path(row['path']).read_bytes()).hexdigest() == row['candidate_sha256']
              assert subprocess.check_output(['git','hash-object',row['path']],text=True).strip() == row['candidate_blob']
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) == expected
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          for path in pathlib.Path('assets/js').glob('*.js'):
              subprocess.run(['node','--check',str(path)],check=True)
          print('Three presentation files verified. Store, Auth, cloud sync and all business handlers retained. No Supabase requests.')
          PY
          git diff --check
          git diff --stat
      - name: Commit isolated candidate only
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/beta | cut -f1)" = 96904ca2e8484b677f187a69f3542ddbc3301eb9
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 6b9e17a1ef41ea9b7896cd0e3848536d2c255fb4
          git config user.name 'KuShe ERP Maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/billing.js assets/css/receivables-scoped.css index.html
          git commit -m 'P20 AR Actions-2: align primary controls and move deletion into accessible more menu'
          test "$(git rev-parse HEAD^)" = 96904ca2e8484b677f187a69f3542ddbc3301eb9
          git push origin HEAD:refs/heads/p20-ar-actions-ready-20261003
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "Candidate: $(git rev-parse HEAD). Only isolated ready branch written; beta and main unchanged by job." >> "$GITHUB_STEP_SUMMARY"
