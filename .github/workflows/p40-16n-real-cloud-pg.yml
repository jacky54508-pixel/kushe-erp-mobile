name: P40-16N actual ERP CloudSync to disposable PostgreSQL CAS and legacy bypass (NO PRODUCTION)
on:
  push:
    branches: [p40-16n-actual-cloudsync-pg-cas-isolated-20261117]
    paths:
      - '.p40-16n-tests/**'
      - '.github/workflows/p40-16n-real-cloud-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-cloudsync-and-isolated-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: p40_16n_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-fake-n-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p40_16n_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P40N_FAKE_PG_DSN: postgresql://postgres:local-fake-n-ci-only@127.0.0.1:5432/p40_16n_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed on formal ERP files and two protected branches
        shell: bash
        run: |
          set -euo pipefail
          MAIN=2ab9c9d5944b1360ba3eebf49695713168caca8a
          BETA=62669539053a15174081ba8670b18248195c6f8c
          BASE=f4e7ff21629d11e1189613a7430be69266278817
          test "$GITHUB_REF_NAME" = p40-16n-actual-cloudsync-pg-cas-isolated-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/beta)" = "$BETA"
          test "$(git merge-base origin/main HEAD)" = "$MAIN"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"...HEAD > /tmp/p40n-changes
          cat /tmp/p40n-changes
          test -s /tmp/p40n-changes
          if grep -Ev '^(.p40-16n-tests/|.github/workflows/p40-16n-real-cloud-pg.yml$)' /tmp/p40n-changes; then
             echo 'STOP source change outside isolated candidate';exit 1
          fi
          for f in index.html assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/app.js assets/js/billing.js assets/js/invoices.js assets/js/commissions.js assets/js/payroll.js assets/js/banks.js assets/js/billing-groups.js assets/js/external-billing-print.js; do
            test "$(git rev-parse origin/main:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          test ! -f .env
          echo 'PASS formal ERP, main/beta and real source unchanged'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned isolated browsers and PostgreSQL tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.57.0' 'psycopg[binary]==3.2.9'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          p=urlparse(os.environ['P40N_FAKE_PG_DSN'])
          assert p.hostname=='127.0.0.1' and p.path=='/p40_16n_ci'
          print('PASS only one-time local PostgreSQL')
          PY
      - name: Serve local-only actual ERP source fixtures no original site launch
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8801 --bind 127.0.0.1 >/tmp/p40n-test-http.log 2>&1 &
          python -m http.server 8799 --bind 127.0.0.1 >/tmp/p40m-test-http.log 2>&1 &
          for port in 8801 8799; do
            for n in $(seq 1 25); do
              if curl -fsS --max-time 2 "http://127.0.0.1:$port/" >/dev/null;then break;fi
              if [ "$n" -eq 25 ];then echo 'isolated browser fixture unavailable';exit 1;fi
              sleep 1
            done
          done
      - name: Actual unchanged ERP CloudSync against real disposable PostgreSQL CAS
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16n-tests/test_real_cloud_pg.py
      - name: Repeat real Chromium ERP Store and local-only cloud code acceptance
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16m-tests/test_real_modules.py
      - name: Previous 55 synthetic no-write and account link regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test .p40-16a-tests/review.test.cjs .p40-16b-tests/ui.test.cjs .p40-16c-tests/accounting-gate.test.cjs .p40-16d-tests/simulated-ledger.test.cjs .p40-16i-tests/financial_links_readonly.test.cjs .p40-16k-tests/offline_recovery.test.cjs
      - name: Source separation and no production credentials or app integration
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'p40-16n' index.html
          ! grep -q 'p40-16n' assets/js/cloud-sync.js
          ! grep -q 'p40-16n' assets/js/erp-store.js
          ! grep -q 'https://.*supabase.co' .p40-16n-tests/real_cloud_pg_fixture.html
          ! grep -q 'public.erp_states' .p40-16n-tests/disposable_legacy_cas.sql
          echo 'PASS no real ERP or Supabase integration changes'
