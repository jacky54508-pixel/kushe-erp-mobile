name: P40-16Y isolated A4 footer seal space and notes (NO PRODUCTION)
on:
  push:
    branches: [p40-16y-footer-capacity-isolated-20261117]
    paths:
      - '.p40-16y-tests/**'
      - '.github/workflows/p40-16y-footer-a4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-a4-footer-feasibility-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP unless original main and beta and all files are tests only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16y-footer-capacity-isolated-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40y-allowlist
          cat /tmp/p40y-allowlist
          test -s /tmp/p40y-allowlist
          if grep -Ev '^(\.p40-16t-tests/|\.p40-16u-tests/|\.p40-16v-tests/|\.p40-16w-tests/|\.p40-16x-tests/|\.p40-16y-tests/|\.github/workflows/p40-16t-real-customer-pdf\.yml$|\.github/workflows/p40-16u-dense-pdf\.yml$|\.github/workflows/p40-16v-layout-feasibility\.yml$|\.github/workflows/p40-16w-pdf-readability\.yml$|\.github/workflows/p40-16x-two-column-a4\.yml$|\.github/workflows/p40-16y-footer-a4\.yml$)' /tmp/p40y-allowlist; then
            echo 'STOP: application / billing / PDF code difference found'; exit 1
          fi
          for f in index.html billing-print.html external-billing-print.html assets/js/external-billing-print.js assets/js/erp-store.js assets/js/cloud-sync.js; do
            test "$(git rev-parse "origin/main:$f")" = "$(git rev-parse "HEAD:$f")"
          done
          test ! -f .env
          echo 'PASS: original official ERP source protected'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install ephemeral local Chromium PDF tools
        run: |
          python -m pip install 'playwright==1.56.0' 'pymupdf==1.26.5'
          python -m playwright install --with-deps chromium
      - name: Render true Chrome PDF on synthetic docs with stamp-space placeholder
        run: python .p40-16y-tests/test_footer_capacity.py
      - name: Upload SYNTHETIC PDF/PNG diagnostics, NOT live logo/stamp
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p40-16y-synthetic-footer-a4
          path: .p40-16y-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
