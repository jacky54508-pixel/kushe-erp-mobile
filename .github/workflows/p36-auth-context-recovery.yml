name: P36 auth-context navigation regression
on:
  push:
    branches:
      - p36-auth-context-recovery-20261103
      - p36-formal-rc-20261103
      - beta
      - main
    paths:
      - 'assets/js/app.js'
      - 'index.html'
      - '.p36-tests/**'
      - '.github/workflows/p36-auth-context-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check app syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/auth-gate.js
          node --check assets/js/erp-store.js
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Launch isolated local fixture
        run: python -m http.server 8796 --bind 127.0.0.1 >/tmp/p36-http.log 2>&1 &
      - name: Permission recovery and role isolation E2E
        run: python .p36-tests/test_permissions.py
