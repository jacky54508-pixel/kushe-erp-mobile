name: P40-13 readonly billing concession UI visual approval only (never deploy)

on:
  push:
    branches:
      - p40-13-readonly-ui-visual-acceptance-20261116
    paths:
      - '.p40-13-tests/export_ui_visuals.py'
      - '.github/workflows/p40-13-visual-approval-no-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots-and-invariants:
    name: P40-13 source-faithful desktop/mobile/blocked screenshot, no production writes
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned production and zero ERP code change since tested P40-12
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'p40-13-readonly-ui-visual-acceptance-20261116'
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = '767cdc3b1303fa603c10a576505aee3f6eb03264' || { echo "STOP: official main changed"; exit 1; }
          base='b8d0987c8e7f706cd15b9485fc672f0d755fca52'
          test "$(git merge-base "$base" HEAD)" = "$base" || { echo 'STOP: not based on tested candidate'; exit 1; }
          python - <<'PY'
          import subprocess
          base='b8d0987c8e7f706cd15b9485fc672f0d755fca52'
          files=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={'.p40-13-tests/export_ui_visuals.py','.github/workflows/p40-13-visual-approval-no-deploy.yml'}
          assert files==allowed,(files,allowed)
          print('PASS: P40-13 only added screenshot script and workflow; candidate Store/PDF unchanged')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run source-faithful Chrome against localhost-only synthetic ERP
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m http.server 8797 --bind 127.0.0.1 > /tmp/p40-13-localhost.log 2>&1 &
      - name: Verify original readonly UI and finance
        env:
          P39_INV_USE_SYSTEM_CHROME: '1'
        run: |
          set -euo pipefail
          node --test .p40-12-tests/discount_math.test.cjs
          python .p40-12-tests/billing_ui_readonly.test.py
      - name: Export desktop/mobile and locked-invoice visual previews
        env:
          P39_INV_USE_SYSTEM_CHROME: '1'
        run: |
          set -euo pipefail
          python .p40-13-tests/export_ui_visuals.py
          test -s p40-13-ui-proof/01_虛構請款詳情_折讓試算按鈕.png
          test -s p40-13-ui-proof/02_虛構請款_折讓差異_桌面.png
          test -s p40-13-ui-proof/03_虛構請款_折讓差異_手機.png
          test -s p40-13-ui-proof/04_虛構已開票請款_安全鎖定提示.png
      - name: Upload preview package, never deploy
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P40-13-candidate-readonly-discount-UI-preview
          path: p40-13-ui-proof/
          retention-days: 14
          if-no-files-found: error
