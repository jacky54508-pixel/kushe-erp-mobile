name: P40-16L real Chromium isolated native IndexedDB/LocalStorage (NO PRODUCTION)
on:
  push:
    branches: [p40-16l-chromium-native-storage-ci-20261116]
    paths:
      - '.p40-16l-tests/**'
      - '.github/workflows/p40-16l-native-chromium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-chromium-native-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: p40_16j_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-j-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p40_16j_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P40J_EPHEMERAL_DSN: postgresql://postgres:synthetic-j-ci-only@127.0.0.1:5432/p40_16j_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed on branch SHAs, out-of-scope files, official ERP code
        shell: bash
        run: |
          set -euo pipefail
          MAIN=2ab9c9d5944b1360ba3eebf49695713168caca8a
          BETA=62669539053a15174081ba8670b18248195c6f8c
          BASE=2a8e11ee2bedb2b277e1557684cdee0ebdf9f111
          test "$GITHUB_REF_NAME" = p40-16l-chromium-native-storage-ci-20261116
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/beta)" = "$BETA"
          test "$(git merge-base origin/main HEAD)" = "$MAIN"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"...HEAD >/tmp/p40l-diff
          cat /tmp/p40l-diff
          test -s /tmp/p40l-diff
          if grep -Ev '^(.p40-16l-tests/|.github/workflows/p40-16l-native-chromium.yml$)' /tmp/p40l-diff; then
            echo 'BLOCK out-of-scope source';exit 1
          fi
          for f in index.html assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/app.js assets/js/billing.js assets/js/billing-groups.js assets/js/invoices.js assets/js/commissions.js assets/js/payroll.js assets/js/banks.js assets/js/external-billing-print.js; do
            test "$(git rev-parse origin/main:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          test ! -f .env
          echo 'PASS main/beta/production ERP app immutable'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned chromium and synthetic Postgres test drivers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.57.0' 'psycopg[binary]==3.2.9'
          python -m playwright install --with-deps chromium
      - name: Serve ONLY local isolated test page (no real ERP auth)
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8797 --bind 127.0.0.1 > /tmp/p40l-fixture-http.log 2>&1 &
          for n in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8797/.p40-16l-tests/browser_fixture.html > /dev/null; then break; fi
            if [ "$n" -eq 20 ]; then echo 'Local fixture not accessible';exit 1; fi
            sleep 1
          done
      - name: Real Chromium full profile restart, native IndexedDB and Emergency mirror tests
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16l-tests/test_chromium_storage.py
      - name: Existing isolated PostgreSQL JSONB/ledger CAS race tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          p=urlsplit(os.environ['P40J_EPHEMERAL_DSN'])
          assert p.hostname=='127.0.0.1' and p.path=='/p40_16j_ci'
          print('PASS only disposable PostgreSQL localhost')
          PY
          python .p40-16j-tests/test_snapshot_ledger_races.py
      - name: Prior synthetic offline and accounting safety regression
        shell: bash
        run: |
          set -euo pipefail
          node --test .p40-16k-tests/offline_recovery.test.cjs .p40-16a-tests/review.test.cjs .p40-16b-tests/ui.test.cjs .p40-16c-tests/accounting-gate.test.cjs .p40-16d-tests/simulated-ledger.test.cjs .p40-16i-tests/financial_links_readonly.test.cjs
      - name: Confirm no official ERP has loaded isolated test JS
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'p40-16l' index.html
          ! grep -q 'p40-16l' assets/js/erp-store.js
          ! grep -q 'p40-16l' assets/js/cloud-sync.js
          ! grep -q 'KuSheERP25_Core34_DB' .p40-16l-tests/browser_fixture.js
          echo 'PASS no production ERP integration or formal financial writes'
