name: P40-16AY persistence + legacy-safe approval LAB (FAKE ONLY)
on:
  push:
    branches: [p40-16ay-persistent-approval-legacy-lab-20261118]
    paths:
      - '.p40-16ay-tests/**'
      - '.p40-16ay-review/**'
      - '.github/workflows/p40-16ay-legacy-approval-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-persistent-fake-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP on main/beta drift, unapproved source changes or unsafe files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16ay-persistent-approval-legacy-lab-20261118
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40ay-allowlist
          cat /tmp/p40ay-allowlist
          test "$(wc -l < /tmp/p40ay-allowlist)" -eq 5
          if grep -Ev '^(\.p40-16ay-(tests|review)/.+|\.github/workflows/p40-16ay-legacy-approval-lab\.yml)$' /tmp/p40ay-allowlist; then
            echo 'STOP: unrelated/production ERP file modification';exit 1
          fi
          for path in index.html billing-print.html billing-bundle-print.html external-billing-print.html assets/js/erp-store.js assets/js/billing-groups.js assets/js/external-billing-print.js assets/js/external-billing-invoice.js assets/js/billing-print.js assets/js/billing-group-discount-preview.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/config.js .github/workflows/pages.yml; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "origin/main:$path")" || { echo "STOP modified $path"; exit 1; }
          done
          test ! -f .env
          test ! -d supabase/migrations
          echo 'PASS: pinned main/beta and no production source, finance, PDF, auth, data or sync changed'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run fake on-disk approval audit, restart, CAS, privacy and legacy-compatibility checks
        run: |
          node --check .p40-16ay-tests/persistent_approval_lab.cjs
          node --check .p40-16ay-tests/test_legacy_ledger.cjs
          node --test .p40-16ay-tests/test_legacy_ledger.cjs
          echo 'P40AY_TEST_CONTRACT_ONLY: not real signature, JWT, audit WORM, Supabase or PDF service'
      - name: Verify official print still untouched and not deployed
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- index.html assets/js \
            billing-print.html billing-bundle-print.html external-billing-print.html \
            .github/workflows/pages.yml
          echo 'P40AY_PRODUCTION_BLOCKED: no live verified reviewer, no authorized per-document source, no legacy migration'
