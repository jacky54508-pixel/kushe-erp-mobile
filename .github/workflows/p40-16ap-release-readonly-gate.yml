name: P40-16AP official PDF entrypoint audit - source-only, no release
on:
  push:
    branches: [p40-16ap-readonly-release-gates-20261118]
    paths:
      - '.p40-16ap-review/**'
      - '.p40-16ap-tests/**'
      - '.github/workflows/p40-16ap-release-readonly-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-main-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed if official main beta or application code is changed
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16ap-readonly-release-gates-20261118
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40ap-files
          cat /tmp/p40ap-files
          test "$(wc -l < /tmp/p40ap-files)" -eq 4
          if grep -Ev '^(\.p40-16ap-(review|tests)/|\.github/workflows/p40-16ap-release-readonly-gate\.yml$)' /tmp/p40ap-files; then
            echo 'STOP: any unapproved production or unrelated file change'; exit 1
          fi
          for spec in \
            'billing-print.html 620e1eb11158d2d560602f072d219b854445bf54' \
            'billing-bundle-print.html 006a4a9547cb3ecb4ec9cab6792463c49ff0292b' \
            'external-billing-print.html b208bcbb6782f5aeb6d1d58fb8737090e98cdb7d' \
            'assets/js/billing-print.js d2e7b9dd3eadc749893be983caf6a91cece898d2' \
            'assets/js/billing-bundle-print.js 18daabab4789853c6c85bd4fef2c40ddb96cc147' \
            'assets/js/external-billing-print.js b73e6d4879fda2cdc0c0d50cae2333b5ced2cf41' \
            'assets/js/billing-groups.js e5a7c76c1fb220d733db49ca9b13cb02aca68b43' \
            'assets/js/external-billing-invoice.js 73a90b64b5fc7c23cb90106a511253c17014753a' \
            'assets/js/billing-discount-preview.js d06e46e6c47af9ed7226b99f1a4327d8ae13149d' \
            'assets/js/billing-group-discount-preview.js 354ec0055d264d54b358968c968f6f7552f3528a'; do
            read -r path expected <<< "$spec"
            test "$(git rev-parse "HEAD:$path")" = "$expected" || { echo "STOP: production blob changed: $path"; exit 1; }
          done
          for path in index.html assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/historical-billing.js assets/js/invoices.js .github/workflows/pages.yml; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "origin/main:$path")"
          done
          test ! -e .env
          test ! -e .p40-16ao-tests
          echo 'PASS pinned main/beta, original ERP, all billing print / invoices / auth / sync unchanged'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only official print route and privacy tests
        run: |
          python -m unittest discover -s .p40-16ap-tests -p 'test_*.py' -v
          python -m json.tool .p40-16ap-review/release_matrix.json > /dev/null
          echo 'P40-16AP SOURCE AUDIT PASSED; FORMAL RELEASE STILL BLOCKED'
      - name: Post machine-readable release blockers
        shell: bash
        run: |
          python - <<'PY'
          import json
          data=json.load(open(".p40-16ap-review/release_matrix.json"))
          print("P40AP_PRINT_ROUTES",len(data["entrypoints"]))
          print("P40AP_RELEASE_DISPOSITION",data["disposition"])
          for row in data["entrypoints"]:
            print("P40AP_ROUTE_BLOCK",row["id"],row["pdf_guard"])
          print("P40AP_SEVEN_UNMET_GATES",len(data["outstanding_gates"]))
          assert data["disposition"]=="PRODUCTION_RELEASE_BLOCKED"
          assert all(row["state"]=="BLOCK" for row in data["outstanding_gates"])
          PY
