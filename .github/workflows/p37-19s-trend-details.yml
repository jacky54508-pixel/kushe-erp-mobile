name: P37-19S original dashboard trend and P21 KPI drawer synthetic-only
on:
  push:
    branches:
      - p37-19s-trend-kpi-detail-review-20261106
    paths:
      - 'p37-lab/p37-19s/**'
      - '.github/workflows/p37-19s-trend-details.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-readonly-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source pins, temporary overlay and source syntax
        run: |
          node --check p37-lab/p37-19s/s-controller.js
          node --check p37-lab/p37-19s/s-augmentation.js
          node --check assets/js/erp-store.js
          node --check assets/js/dashboard.js
          node --check assets/js/reports.js
          node --check assets/js/kpi-navigation.js
          python -m py_compile p37-lab/p37-19s/lab_ui_overlay.py p37-lab/p37-19s/server.py p37-lab/p37-19s/browser_e2e.py
          python p37-lab/p37-19s/lab_ui_overlay.py
      - name: Existing original financial no-post safety, P37-19Q release NO-GO regression
        run: |
          node --test p37-lab/p37-19q/release-readiness.test.cjs
          node --test p37-lab/p37-19j-financial-integration-gaps.test.cjs
          node --test p37-lab/p37-19j-multi-document-projection.test.cjs
          node --test p37-lab/p37-19k-atomic-settlement.test.cjs
          node --test p37-lab/p37-19l-store-cloud-cas.test.cjs
          node --test p37-lab/p37-19h/verified-sessions.test.mjs
          node --test p37-lab/p37-19i/release-gate.test.cjs
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Previous P37-19R original Dashboard/Reports remains safe
        run: python p37-lab/p37-19r/browser_e2e.py
      - name: P37-19S real Canvas + P21 dialog + reports detail sums
        run: python p37-lab/p37-19s/browser_e2e.py
