name: P37-19Y isolated recovery callback diagnostics and security
on:
  push:
    branches:
      - p37-19y-safe-recovery-callback-review-20261107
    paths:
      - 'p37-lab/reset-password.js'
      - 'p37-lab/reset-password.html'
      - 'p37-lab/p37-19y/**'
      - '.github/workflows/p37-19y-recovery-callback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  callback-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Original ERP modules stay syntactically valid and unmounted recovery fix
        run: |
          node --check p37-lab/reset-password.js
          node --check p37-lab/p37-19y/reset-callback.test.cjs
          node --check assets/js/erp-store.js
          node --check assets/js/cloud-sync.js
          node --check assets/js/dashboard.js
          node --check assets/js/reports.js
      - name: Test safe callback classification, no token echo, verified RLS, no SMTP calls
        run: node --test p37-lab/p37-19y/reset-callback.test.cjs
      - name: Regress original test lab Auth and official finance NO_GO safety
        run: |
          node --test p37-lab/p37-19w/readiness-gate.test.cjs
          node --test p37-lab/p37-19v/signed-http-gate.test.mjs
          node --test p37-lab/p37-19q/release-readiness.test.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned real Chromium browser test library
        run: |
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Execute real browser with ALL network responses fully mocked
        run: |
          python -m py_compile p37-lab/p37-19y/browser_recovery_e2e.py
          python p37-lab/p37-19y/browser_recovery_e2e.py
