name: P40-16E ephemeral PostgreSQL CAS, idempotency and reversal (NO PRODUCTION)
on:
  push:
    branches:
      - p40-16e-postgres-transaction-isolated-20261116
    paths:
      - '.p40-16e-tests/**'
      - '.github/workflows/p40-16e-ephemeral-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-postgres-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Disposable database per CI job. No credentials, hosts or connections
      # to any real Supabase or production customer/business records.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: p40_16e_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p40_16e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P40E_CI_DSN: postgresql://postgres:synthetic-only-ci@127.0.0.1:5432/p40_16e_ci
    steps:
      - name: Checkout isolated candidate with no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact allowlist and unchanged production main/beta
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN=2ab9c9d5944b1360ba3eebf49695713168caca8a
          EXPECTED_BASE=00f811679ce9445254c794d9b2ae8338d0c9f199
          test "$GITHUB_REF_NAME" = "p40-16e-postgres-transaction-isolated-20261116"
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE"...HEAD > /tmp/p40-16e-changed
          cat /tmp/p40-16e-changed
          test -s /tmp/p40-16e-changed
          if grep -Ev '^(.p40-16e-tests/|.github/workflows/p40-16e-ephemeral-postgres.yml$)' /tmp/p40-16e-changed; then
            echo 'BLOCK: changes outside P40-16E isolated tests'; exit 1
          fi
          for f in index.html assets/js/erp-store.js assets/js/billing.js assets/js/invoices.js assets/js/commissions.js assets/js/payroll.js assets/js/banks.js; do
            test "$(git rev-parse origin/main:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          test ! -f .env
          echo 'PASS production app files unchanged'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test driver and reject nonlocal DSN
        shell: bash
        run: |
          python -m pip install 'psycopg[binary]==3.2.9'
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          url=urlsplit(os.environ['P40E_CI_DSN'])
          assert url.hostname == '127.0.0.1'
          assert url.path == '/p40_16e_ci'
          print('PASS only ephemeral local service permitted')
          PY
      - name: Run real SQL transactions and concurrent synthetic clients
        shell: bash
        run: python .p40-16e-tests/test_transactions.py
      - name: Confirm main app does not import isolated SQL or business records
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'p40_16e_lab' index.html
          ! grep -q 'p40-16e' index.html
          ! grep -q 'p40_16e_lab' assets/js/erp-store.js
          echo 'PASS no real ERP production integration'
