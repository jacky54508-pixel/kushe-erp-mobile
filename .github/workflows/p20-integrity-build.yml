name: P20 integrated accounting guard and native storage QA
on:
  push:
    branches: [p20-integrity-build-20261003]
permissions:
  contents: read
concurrency:
  group: p20-integrity-build-20261003
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read isolated verified build controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - name: Checkout exact beta baseline read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3e32f1084c5bf9359398929715d17b7d272bd24a
          path: work
          persist-credentials: false
      - name: Apply pinned two-file patch and verify source
        run: python control/.integrity-check/apply.py work
      - name: Install pinned isolated browser driver
        run: python -m pip install playwright==1.57.0
      - name: Native persistence, restore, stale-tab and historical wage guards
        env:
          ERP_CODE_ROOT: ${{ github.workspace }}/work
          QA_OUTPUT: ${{ runner.temp }}/integrity-results/native-storage-result.json
        run: python "$RUNNER_TEMP/integrity-qa/native_storage_ci.py"
      - name: Upload synthetic-only QA results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p20-integrity-native-results
          path: ${{ runner.temp }}/integrity-results/*.json
          retention-days: 7
          if-no-files-found: warn
  publish-candidate:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Read isolated controls without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - name: Checkout exact beta source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3e32f1084c5bf9359398929715d17b7d272bd24a
          path: work
      - name: Independently verify and apply same tested patch
        run: python control/.integrity-check/apply.py work
      - name: Commit candidate only after native QA and unchanged remote refs
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/beta | cut -f1)" = 3e32f1084c5bf9359398929715d17b7d272bd24a
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 6b9e17a1ef41ea9b7896cd0e3848536d2c255fb4
          git config user.name 'KuShe ERP Maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/erp-store.js index.html
          git commit -m 'P20 Integrity-1: prevent legacy salary re-payment and correct receipt bank audit'
          test "$(git rev-parse HEAD^)" = 3e32f1084c5bf9359398929715d17b7d272bd24a
          git push origin HEAD:refs/heads/p20-integrity-ready-20261003
          echo "Candidate $(git rev-parse HEAD); beta and main not advanced by this job" >> "$GITHUB_STEP_SUMMARY"
