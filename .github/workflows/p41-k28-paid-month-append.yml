name: P41 K28 paid month daily append candidate

on:
  push:
    branches: [p41-k28-paid-month-append-20261127]
    paths:
      - 'assets/js/erp-store.js'
      - 'assets/js/commissions.js'
      - 'assets/js/daily-draft-review.js'
      - 'assets/js/dashboard.js'
      - 'index.html'
      - '.p41-k28-tests/**'
      - '.github/workflows/p41-k28-paid-month-append.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p41-k28-paid-month-append-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-acceptance:
    name: Synthetic Store and daily UI on ${{ matrix.platform }}
    if: github.ref == 'refs/heads/p41-k28-paid-month-append-20261127'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      ARTIFACT_DIR: artifacts/p41-k28-${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify candidate scope and syntax
        run: |
          set -euo pipefail
          python .p41-k28-tests/source_guard.py --output "$ARTIFACT_DIR/source"
          node --check assets/js/erp-store.js
          node --check assets/js/commissions.js
          node --check assets/js/daily-draft-review.js
          node --check assets/js/dashboard.js
          node --check .p41-k28-tests/probe_readonly.cjs
          python -m py_compile .p41-k28-tests/k28_fixture.py .p41-k28-tests/k28_browser_store.py .p41-k28-tests/test_daily_ui.py
      - name: Prepare isolated browser dependency
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'.p41-k28-tests')
          from k28_browser_store import select_browser
          executable=select_browser()
          if not executable:subprocess.check_call([sys.executable,'-m','playwright','install','chromium'])
          result={'systemExecutable':executable,'managedBrowserInstalled':not bool(executable)}
          (Path(os.environ['ARTIFACT_DIR'])/'BROWSER_SELECTION.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
      - name: Reproduce exact baseline month lock using synthetic data
        run: |
          set -euo pipefail
          python .p41-k28-tests/k28_browser_store.py --mode baseline --output "$ARTIFACT_DIR/baseline" 2>&1 | tee "$ARTIFACT_DIR/baseline.log"
      - name: Verify candidate actual Store transactions and protected history
        run: |
          set -euo pipefail
          python .p41-k28-tests/k28_browser_store.py --mode candidate --store assets/js/erp-store.js --output "$ARTIFACT_DIR/store" 2>&1 | tee "$ARTIFACT_DIR/store.log"
      - name: Verify actual desktop and mobile daily form
        run: |
          set -euo pipefail
          python .p41-k28-tests/test_daily_ui.py --root . --store assets/js/erp-store.js --output "$ARTIFACT_DIR/ui" 2>&1 | tee "$ARTIFACT_DIR/ui.log"
      - name: Retain all results including failures without UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k28-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/p41-k28-${{ matrix.platform }}/
            !artifacts/p41-k28-${{ matrix.platform }}/**/internal-qa/**
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic UI screenshots for internal QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k28-internal-qa-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p41-k28-${{ matrix.platform }}/ui/internal-qa/
          if-no-files-found: ignore
          retention-days: 3

  unchanged-regressions:
    name: Unmodified historical commission and invoice regression suites
    if: github.ref == 'refs/heads/p41-k28-paid-month-append-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONUTF8: '1'
      P39_INV_USE_SYSTEM_CHROME: '1'
      ARTIFACT_DIR: artifacts/p41-k28-legacy
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original tests and prepare system Chrome
        run: |
          set -euo pipefail
          python .p41-k28-tests/source_guard.py --output "$ARTIFACT_DIR/source"
          command -v google-chrome || command -v google-chrome-stable
          python -m pip install playwright==1.57.0
      - name: Run original suites without changing their assertions
        run: |
          python - <<'PY'
          import json,os,socket,subprocess,sys,time,traceback
          from pathlib import Path
          output=Path(os.environ['ARTIFACT_DIR']);root=Path.cwd()
          tests=[('p33-4',[sys.executable,'.p39-inv1-tests/chrome_legacy.py','.p33-4-tests/regression.py']),
                 ('p34',[sys.executable,'.p39-inv1-tests/chrome_legacy.py','.p34-tests/test.py']),
                 ('p35-ui',[sys.executable,'.p39-inv1-tests/chrome_legacy.py','.p35-tests/test_ui.py']),
                 ('p39-inv1-store',[sys.executable,'.p39-inv1-tests/test_store.py'])]
          servers=[];handles=[];results=[];errors=[]
          try:
              for port in (8774,8784,8795,8797):
                  handle=(output/('http-'+str(port)+'.log')).open('w',encoding='utf-8');handles.append(handle)
                  server=subprocess.Popen([sys.executable,'-m','http.server',str(port),'--bind','127.0.0.1','--directory',str(root)],stdout=handle,stderr=subprocess.STDOUT);servers.append(server)
                  deadline=time.monotonic()+10
                  while True:
                      if server.poll() is not None:raise RuntimeError('Owned loopback server failed: '+str(port))
                      try:
                          with socket.create_connection(('127.0.0.1',port),timeout=0.2):break
                      except OSError:
                          if time.monotonic()>=deadline:raise RuntimeError('Owned loopback server not ready: '+str(port))
                          time.sleep(0.05)
              for name,command in tests:
                  print('RUN',name,flush=True)
                  try:
                      result=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,encoding='utf-8',errors='replace',timeout=300);text=result.stdout;code=result.returncode
                  except subprocess.TimeoutExpired as error:
                      text=error.stdout or ''
                      if isinstance(text,bytes):text=text.decode('utf-8',errors='replace')
                      text+='\nTIMEOUT after 300 seconds\n';code=124
                  (output/(name+'.log')).write_text(text,encoding='utf-8');print(text,end='',flush=True);results.append({'name':name,'exitCode':code,'passed':code==0})
          except Exception as error:errors.append({'type':type(error).__name__,'message':str(error),'traceback':traceback.format_exc()})
          finally:
              for server in servers:
                  if server.poll() is None:
                      server.terminate()
                      try:server.wait(timeout=5)
                      except subprocess.TimeoutExpired:server.kill();server.wait(timeout=5)
              for handle in handles:handle.close()
              passed=len(results)==len(tests) and all(item['passed'] for item in results) and not errors
              report={'schema':'k28-unchanged-legacy-regressions-v1','status':'PASS' if passed else 'BLOCKED','tests':results,'errors':errors,'productionDataTouched':False,'publishGate':'BLOCKED'}
              (output/'LEGACY_RESULT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');print(json.dumps(report,ensure_ascii=False,indent=2),flush=True)
          raise SystemExit(0 if passed else 1)
          PY
      - name: Retain original regression outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k28-legacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p41-k28-legacy/
          if-no-files-found: error
          retention-days: 14
