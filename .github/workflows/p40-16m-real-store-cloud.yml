name: P40-16M real ERP Store/CloudSync sources isolated browser regression (NO PRODUCTION)
on:
  push:
    branches: [p40-16m-real-store-cloud-isolated-20261117]
    paths:
      - '.p40-16m-tests/**'
      - '.github/workflows/p40-16m-real-store-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-real-source-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: FAIL CLOSED: official ERP, main and beta identical; only test paths
        shell: bash
        run: |
          set -euo pipefail
          MAIN=2ab9c9d5944b1360ba3eebf49695713168caca8a
          BETA=62669539053a15174081ba8670b18248195c6f8c
          BASE=a49855e6a891532fdd008cc2adcc9cc8d6328ff6
          test "$GITHUB_REF_NAME" = p40-16m-real-store-cloud-isolated-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/beta)" = "$BETA"
          test "$(git merge-base origin/main HEAD)" = "$MAIN"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"...HEAD > /tmp/p40m-changed
          cat /tmp/p40m-changed
          test -s /tmp/p40m-changed
          if grep -Ev '^(.p40-16m-tests/|.github/workflows/p40-16m-real-store-cloud.yml$)' /tmp/p40m-changed; then
            echo 'FAIL: out-of-scope ERP source changed';exit 1
          fi
          for f in index.html assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/app.js assets/js/billing.js assets/js/invoices.js assets/js/commissions.js assets/js/payroll.js assets/js/billing-groups.js assets/js/banks.js assets/js/external-billing-print.js; do
            test "$(git rev-parse origin/main:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          test ! -f .env
          echo 'PASS main/beta/formal ERP source unchanged'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned local Chrome driver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Only serve the test fixture on localhost
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8799 --bind 127.0.0.1 >/tmp/p40m-local-http.log 2>&1 &
          for n in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8799/.p40-16m-tests/actual_modules_fixture.html >/dev/null; then break; fi
            if [ "$n" -eq 20 ]; then echo 'Fixture unreachable';exit 1; fi
            sleep 1
          done
      - name: Run actual ERP JS store and cloud-sync modules in real Chromium isolated context
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16m-tests/test_real_modules.py
      - name: Repeat previous financial no-write Node regression
        shell: bash
        run: |
          set -euo pipefail
          node --test .p40-16a-tests/review.test.cjs .p40-16b-tests/ui.test.cjs .p40-16c-tests/accounting-gate.test.cjs .p40-16d-tests/simulated-ledger.test.cjs .p40-16i-tests/financial_links_readonly.test.cjs .p40-16k-tests/offline_recovery.test.cjs
      - name: Verify test-only origin and no real ERP modules changed
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'p40-16m' index.html
          ! grep -q 'p40-16m' assets/js/cloud-sync.js
          ! grep -q 'p40-16m' assets/js/erp-store.js
          grep -Fq 'src="/assets/js/erp-store.js"' .p40-16m-tests/actual_modules_fixture.html
          grep -Fq 'src="/assets/js/cloud-sync.js"' .p40-16m-tests/actual_modules_fixture.html
          echo 'PASS direct unchanged real ERP source integration only on isolated Chrome origin'
