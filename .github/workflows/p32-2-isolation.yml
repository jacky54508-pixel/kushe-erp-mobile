name: P32-2 isolated WebAuthn protocol laboratory
on:
  push:
    branches: [p32-2-auth-isolation-20261102]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned laboratory tools
        run: |
          python -m pip install playwright==1.57.0 cryptography==46.0.4
          python -m playwright install --with-deps chromium
      - name: Test synthetic virtual authenticator only
        run: python .p32-2-isolation/tests/native-webauthn.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p32-2-isolated-protocol-evidence
          path: .p32-2-isolation/evidence/
          retention-days: 7
