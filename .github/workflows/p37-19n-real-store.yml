name: P37-19N actual ERP Store isolated Chromium integration
on:
  push:
    branches:
      - p37-19n-real-store-isolated-20261106
    paths:
      - 'p37-lab/p37-19n/**'
      - '.github/workflows/p37-19n-real-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-actual-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the original financial Store source SHA and fixture syntax
        run: |
          node --check assets/js/erp-store.js
          node --check p37-lab/p37-19n/synthetic-fixture.js
          python -m py_compile p37-lab/p37-19n/server.py p37-lab/p37-19n/browser_e2e.py
          python -c "import sys; sys.path.insert(0,'p37-lab/p37-19n'); from server import original_source_verified; print('Original Store source bytes:', original_source_verified())"
      - name: Run previous synthetic finance, local storage, cloud and release regression
        run: |
          node --test p37-lab/p37-19l-store-cloud-cas.test.cjs
          node --test p37-lab/p37-19k-atomic-settlement.test.cjs
          node --test p37-lab/p37-19j-financial-integration-gaps.test.cjs
          node --test p37-lab/p37-19i/release-gate.test.cjs
          node --test p37-lab/p37-19h/verified-sessions.test.mjs
      - name: Install pinned Playwright, reuse runner Chromium where available
        run: |
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Execute original ERP Store IDB, real finance writer and mirror gate
        run: python p37-lab/p37-19n/browser_e2e.py
