name: P31-2 isolated document action toolbar verification
on:
  push:
    branches: [p31-2-build-20261030]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 79cdf59225d13527b10835394d8720279fd34c0e
          path: qa/src
          fetch-depth: 1
      - name: Verify exact locally tested UI-only patch and protected source
        run: python3 harness/.p31-2-build/build.py
      - name: Verify every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          find qa/src/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          test "$(find qa/src/assets/js -name '*.js' | wc -l)" -eq 39
      - name: Publish clean review candidate only after exact source verification
        shell: bash
        run: |
          set -euo pipefail
          cd qa/src
          test "$(git write-tree)" = e205a34da714d66735391b7705ed8e0f8c95f678
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'P31-2: permanent external billing create action and compact toolbar' -m 'Only four UI/loading files change. Keep a visible create button in the original selection toolbar, distinguish original PDF export, guard incomplete modules and preserve selections on late readiness without replacing open drafts. Local isolated verification: 219 synthetic checks (54 entry, 55 unified UI, 52 unified Store and 58 legacy group regressions); all 39 JavaScript syntax checks passed. Exact tested source, protected tracked files and complete candidate tree verified before this commit. No erp-store, cloud, authentication, payment, PDF or business-data changes. No real ERP login or database access. Review candidate only; beta and main are not advanced by this workflow.'
          git push origin HEAD:refs/heads/p31-2-ready-20261030
          git rev-parse HEAD > ../evidence/ready-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p31-2-source-verification
          path: qa/evidence
          retention-days: 7
