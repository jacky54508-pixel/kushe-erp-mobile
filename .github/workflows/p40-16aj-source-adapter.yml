name: P40-16AJ source-preserving single-billing PDF adapter lab (NO PRODUCTION)
on:
  push:
    branches: [p40-16aj-single-billing-source-adapter-lab-20261118]
    paths:
      - '.p40-16aj-tests/**'
      - '.p40-16aj-review/**'
      - '.github/workflows/p40-16aj-source-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-synthetic-single-source-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP unless original main/beta and all production PDF data/auth paths are identical
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16aj-single-billing-source-adapter-lab-20261118
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40aj-files
          cat /tmp/p40aj-files
          test -s /tmp/p40aj-files
          if grep -Ev '^(\.p40-16(ah|ai|aj)-(tests|review)/|\.github/workflows/p40-16(ah-local-pdf|ai-original-pdf-contract|aj-source-adapter)\.yml$)' /tmp/p40aj-files; then
            echo "STOP: unauthorized production or unrelated change"; exit 1
          fi
          for f in index.html billing-print.html billing-bundle-print.html external-billing-print.html assets/js/billing-print.js assets/js/billing-bundle-print.js assets/js/external-billing-print.js assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js .github/workflows/pages.yml; do
            test "$(git rev-parse "origin/main:$f")" = "$(git rev-parse "HEAD:$f")"
          done
          test ! -f .env
          echo 'PASS: production ERP source, main, beta unchanged'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run original source/read-only P40-16AI compatibility diagnostic
        run: |
          node --test .p40-16ai-tests/compare_original_print_views.test.cjs
          echo 'P40-16AI known gaps remain release blockers'
      - name: Verify isolated P40-16AJ decimal, tax-inclusive, historical and retention adapter
        run: |
          node --check .p40-16aj-tests/source_preserving_single_adapter.js
          node --check .p40-16aj-tests/source_preserving_single_adapter.test.cjs
          node --test .p40-16aj-tests/source_preserving_single_adapter.test.cjs
          echo 'P40-16AJ DIAGNOSTIC ONLY: Adapter test success is not real PDF or formal ERP approval'
