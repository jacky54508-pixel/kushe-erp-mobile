name: P33-4 historical commission safety gates
on:
  push:
    branches:
      - p33-4-build-20261102
      - beta
    paths:
      - 'assets/js/erp-store.js'
      - 'assets/js/p33-3-historical-commission-preview.js'
      - 'index.html'
      - '.p33-4-tests/**'
      - '.github/workflows/p33-4-historical-commission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: JavaScript syntax gates
        run: |
          node --check assets/js/erp-store.js
          node --check assets/js/commissions.js
          node --check assets/js/p33-3-historical-commission-preview.js
      - name: Install isolated Chromium test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Start isolated ERP fixture server
        run: python -m http.server 8774 --bind 127.0.0.1 >/tmp/p33-4-test-http.log 2>&1 &
      - name: Verify P33-4 historical correction on synthetic data only
        run: python .p33-4-tests/regression.py
