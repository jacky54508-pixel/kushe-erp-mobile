name: P32-3 disposable real Auth verification - NOT deployment
on:
  push:
    branches: [p32-3-auth-backend-isolation-20261102]
permissions:
  contents: read
jobs:
  isolated-auth:
    if: github.repository == 'jacky54508-pixel/kushe-erp-mobile' && github.ref == 'refs/heads/p32-3-auth-backend-isolation-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .p32-3-isolation/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and extract exact isolated source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, hashlib, ast
          root=Path('.p32-3-isolation')
          archive=base64.b64decode((root/'harness.json.gz.b64').read_text(),validate=False)
          assert hashlib.sha256(archive).hexdigest()=='97d2bcc953d95cb4520632e42566c429226289345b6b124f71319f4b9aed0391'
          files=json.loads(gzip.decompress(archive))
          expected={'lab/backend_probe.py':'c87c1d12e3e8bb6ae8bb83811bc76f5a81090d979b5df26605e8a95bda51bbab','lab/run-lab.sh':'d1022b3ec69e6cdd102dfc9e49f8a9fd4d05b0c599fdf66d17ed894a7bb1b379'}
          assert set(files)==set(expected)
          for name,text in files.items():
              assert hashlib.sha256(text.encode()).hexdigest()==expected[name]
          s=files['lab/run-lab.sh']
          changes={
              'PORT=9999':'PORT=18430',
              '  -p 127.0.0.1:18430:9999 supabase/gotrue:v2.197.0 >/dev/null':'  supabase/gotrue:v2.197.0 >/dev/null',
              'export LAB_AUTH_CONTAINER="$auth"':'auth_pid="$(docker inspect --format \'{{.State.Pid}}\' "$auth")"\ntest "$auth_pid" -gt 0\nexport PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"\nprobe=(sudo --preserve-env=LAB_JWT_SECRET,KUSHE_EMPTY_AUTH_LAB,LAB_AUTH_CONTAINER,LAB_DB_PASSWORD,PLAYWRIGHT_BROWSERS_PATH nsenter --target "$auth_pid" --net env "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "$(command -v python)")\nexport LAB_AUTH_CONTAINER="$auth"',
              "python - <<'PY'\nimport time, urllib.request":"\"${probe[@]}\" - <<'PY'\nimport time, urllib.request",
              'python lab/backend_probe.py':'"${probe[@]}" lab/backend_probe.py',
          }
          for old,new in changes.items():
              assert s.count(old)==1
              s=s.replace(old,new)
          assert hashlib.sha256(s.encode()).hexdigest()=='5b701b5aa28e832ce9895ac7b06588d1258a5790d8d13eac8a1525243ec85288'
          files['lab/run-lab.sh']=s
          expected['lab/run-lab.sh']=hashlib.sha256(s.encode()).hexdigest()
          for name,text in files.items():
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          ast.parse(files['lab/backend_probe.py'])
          (root/'evidence').mkdir(exist_ok=True)
          (root/'evidence/source-hashes.json').write_text(json.dumps(expected,indent=2))
          PY
          bash -n .p32-3-isolation/lab/run-lab.sh
      - name: Install version-pinned laboratory tools
        run: |
          python -m pip install playwright==1.57.0
          python -m pip freeze > .p32-3-isolation/evidence/python-packages.txt
          python -m playwright install --with-deps chromium
      - name: Real backend with new synthetic accounts only
        run: bash .p32-3-isolation/lab/run-lab.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p32-3-sanitized-lab-evidence
          path: .p32-3-isolation/evidence/
          retention-days: 7
          if-no-files-found: warn
