name: P32-3 disposable real Auth verification - NOT deployment
on:
  push:
    branches: [p32-3-auth-backend-isolation-20261102]
permissions:
  contents: read
jobs:
  isolated-auth:
    if: github.repository == 'jacky54508-pixel/kushe-erp-mobile' && github.ref == 'refs/heads/p32-3-auth-backend-isolation-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .p32-3-isolation/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify isolated source before running
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, hashlib, ast
          root=Path('.p32-3-isolation')
          archive=base64.b64decode((root/'harness.json.gz.b64').read_text(),validate=False)
          assert hashlib.sha256(archive).hexdigest()=='97d2bcc953d95cb4520632e42566c429226289345b6b124f71319f4b9aed0391'
          files=json.loads(gzip.decompress(archive))
          assert set(files)=={'lab/backend_probe.py','lab/run-lab.sh'}
          code=files['lab/backend_probe.py']
          assert hashlib.sha256(code.encode()).hexdigest()=='c87c1d12e3e8bb6ae8bb83811bc76f5a81090d979b5df26605e8a95bda51bbab'
          ast.parse(code)
          (root/'lab/backend_probe.py').write_text(code)
          shell=root/'lab/run-lab.sh'
          assert hashlib.sha256(shell.read_bytes()).hexdigest()=='98e2b793a07016d5291cd456564234956a496a9683eadb6bc7f3c179533b8fea'
          hashes={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in files}
          (root/'evidence').mkdir(exist_ok=True)
          (root/'evidence/source-hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
          bash -n .p32-3-isolation/lab/run-lab.sh
      - name: Install version-pinned laboratory tools
        run: |
          python -m pip install playwright==1.57.0
          python -m pip freeze > .p32-3-isolation/evidence/python-packages.txt
          python -m playwright install --with-deps chromium
      - name: Real backend with new synthetic accounts only
        run: bash .p32-3-isolation/lab/run-lab.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p32-3-sanitized-lab-evidence
          path: .p32-3-isolation/evidence/
          retention-days: 7
          if-no-files-found: warn
