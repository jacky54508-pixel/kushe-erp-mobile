name: P40-16BL fake ERP sync projection lab only (NO PRODUCTION ACCESS)
on:
  push:
    branches: [p40-16bl-fake-sync-handoff-20261119]
    paths:
      - '.p40-16bl-tests/**'
      - '.p40-16bl-review/**'
      - '.github/workflows/p40-16bl-fake-sync-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-cas-projection-fake:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject production drift or changed ERP source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16bl-fake-sync-handoff-20261119
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-status origin/main...HEAD > /tmp/p40bl_allowlist
          test "$(wc -l </tmp/p40bl_allowlist)" -eq 4
          if grep -Ev '^A[[:space:]]+(\.p40-16bl-(tests|review)/[^[:space:]]+|\.github/workflows/p40-16bl-fake-sync-handoff\.yml)$' /tmp/p40bl_allowlist; then
            echo 'BLOCK unauthorized file, deletion or production edit'; exit 1
          fi
          git diff --exit-code origin/main -- assets/js index.html billing-print.html billing-bundle-print.html external-billing-print.html .github/workflows/pages.yml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute FAKE SQLite sync handoff contract AND official source guard
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          node --version
          node --check .p40-16bl-tests/test_sync_handoff.cjs
          node --test .p40-16bl-tests/test_sync_handoff.cjs | tee /tmp/p40bl_node.txt
          grep -E '^# fail 0$' /tmp/p40bl_node.txt
          grep -E '^# skipped 0$' /tmp/p40bl_node.txt
          node -e "let d=require('./.p40-16bl-review/decision.json');if(d.production_release!=='BLOCKED'||d.real_jwt_verified||d.real_erp_cas_projection_atomicity_proven||d.actual_pdf_bytes_verified||d.owner_authorized_production_change)process.exit(1)"
          echo 'P40-16BL_FAKE_ONLY_PASS_FORMAL_RELEASE_BLOCKED'
