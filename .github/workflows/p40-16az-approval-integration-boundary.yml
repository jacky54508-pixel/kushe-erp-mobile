name: P40-16AZ fake approval integration boundary (NO LIVE DATA)
on:
  push:
    branches: [p40-16az-approval-integration-boundary-lab-20261118]
    paths:
      - '.p40-16az-tests/**'
      - '.p40-16az-review/**'
      - '.github/workflows/p40-16az-approval-integration-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-integration-authority-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP if main/beta advanced or any production ERP file changed
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16az-approval-integration-boundary-lab-20261118
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40az-files
          cat /tmp/p40az-files
          test "$(wc -l < /tmp/p40az-files)" -eq 5
          if grep -Ev '^(\.p40-16az-(tests|review)/.+|\.github/workflows/p40-16az-approval-integration-boundary\.yml)$' /tmp/p40az-files; then
            echo 'STOP: unexpected production source changes';exit 1
          fi
          for path in index.html billing-print.html billing-bundle-print.html external-billing-print.html assets/js/erp-store.js assets/js/billing-groups.js assets/js/external-billing-print.js assets/js/external-billing-invoice.js assets/js/billing-print.js assets/js/billing-group-discount-preview.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/config.js .github/workflows/pages.yml; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "origin/main:$path")" || { echo "STOP: modified $path";exit 1; }
          done
          test ! -e .env
          test ! -d supabase/migrations
          echo 'PASS: pinned formal branches and NO billing/finance/auth/cloud/print code modifications'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate mock-only approval, current/history compatibility and pre/post source checks
        run: |
          node --check .p40-16az-tests/mock_integration_boundary.cjs
          node --check .p40-16az-tests/test_integration_contract.cjs
          node --test .p40-16az-tests/test_integration_contract.cjs
          echo 'P40AZ_FAKE_CONTRACT_ONLY: No real JWT, authorized single billing source, WORM ledger, PDF bytes or production deployment'
      - name: Confirm no formal finance or PDF source changed
        run: |
          git diff --exit-code origin/main -- index.html assets/js billing-print.html \
            external-billing-print.html billing-bundle-print.html .github/workflows/pages.yml
          echo 'P40AZ_PRODUCTION_BLOCKED: legacy ERP unmodified, requires separate owner release'
