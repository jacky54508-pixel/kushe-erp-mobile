name: P40-16R isolated post-discount source linked accounting commands (NO PRODUCTION)
on:
  push:
    branches: [p40-16r-finance-safe-operations-synthetic-20261117]
    paths:
      - '.p40-16r-tests/**'
      - '.github/workflows/p40-16r-finance-commands.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-source-linked-finance:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: p40_16r_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-r-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p40_16r_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P40R_ADMIN_DSN: postgresql://postgres:synthetic-r-postgres-only@127.0.0.1:5432/p40_16r_ci
      P40R_OPERATOR_DSN: postgresql://p40r_operator:p40r-fake-operator-ci@127.0.0.1:5432/p40_16r_ci
      P40R_VIEWER_DSN: postgresql://p40r_viewer:p40r-fake-viewer-ci@127.0.0.1:5432/p40_16r_ci
      P40Q_CI_ADMIN_DSN: postgresql://postgres:synthetic-r-postgres-only@127.0.0.1:5432/p40_16q_ci
      P40Q_CI_CLIENT_DSN: postgresql://p40q_client:synthetic-q-client-only@127.0.0.1:5432/p40_16q_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Strict CI gate - formal main beta original ERP unchanged
        shell: bash
        run: |
          set -euo pipefail
          MAIN=2ab9c9d5944b1360ba3eebf49695713168caca8a
          BETA=62669539053a15174081ba8670b18248195c6f8c
          BASE=f24a365e90d0608e1f6f9192ab986175382ec522
          test "$GITHUB_REF_NAME" = p40-16r-finance-safe-operations-synthetic-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/beta)" = "$BETA"
          test "$(git merge-base origin/main HEAD)" = "$MAIN"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"...HEAD >/tmp/p40r-diff
          cat /tmp/p40r-diff
          test -s /tmp/p40r-diff
          if grep -Ev '^(.p40-16r-tests/|.github/workflows/p40-16r-finance-commands.yml$)' /tmp/p40r-diff; then
            echo 'STOP: source outside synthetic tests changed';exit 1
          fi
          for f in index.html assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/app.js assets/js/billing.js assets/js/invoices.js assets/js/commissions.js assets/js/payroll.js assets/js/banks.js assets/js/billing-groups.js assets/js/external-billing-print.js; do
            test "$(git rev-parse origin/main:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          test ! -f .env
          echo 'PASS formal ERP, main, beta unchanged'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Only install pinned local disposable PG client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'psycopg[binary]==3.2.9'
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          values=[('P40R_ADMIN_DSN','postgres','/p40_16r_ci'),
                  ('P40R_OPERATOR_DSN','p40r_operator','/p40_16r_ci'),
                  ('P40R_VIEWER_DSN','p40r_viewer','/p40_16r_ci'),
                  ('P40Q_CI_ADMIN_DSN','postgres','/p40_16q_ci'),
                  ('P40Q_CI_CLIENT_DSN','p40q_client','/p40_16q_ci')]
          for k,user,db in values:
            x=urlsplit(os.environ[k])
            assert x.hostname=='127.0.0.1' and x.username==user and x.path==db
          print('PASS ONLY synthetic databases hosted on 127.0.0.1')
          PY
      - name: Recreate legacy migration lab in separate disposable database
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import psycopg,os
          with psycopg.connect(os.environ['P40R_ADMIN_DSN'],autocommit=True) as db:
            db.execute('CREATE DATABASE p40_16q_ci')
          print('PASS second separate disposable p40_16q_ci')
          PY
      - name: P40-16R real PostgreSQL source linked finance transactions and permissions
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16r-tests/test_finance_commands.py
      - name: P40-16Q staged migration and older offline rescue regression
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16q-tests/test_staged_compatibility.py
          node --test .p40-16q-tests/offline_upgrade_rescue.test.cjs
      - name: Original write pathway detection and earlier synthetic accounts tests
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16o-tests/audit_writers.py --root . --strict
          python .p40-16o-tests/test_writer_inventory.py
          node --test .p40-16a-tests/review.test.cjs .p40-16b-tests/ui.test.cjs .p40-16c-tests/accounting-gate.test.cjs .p40-16d-tests/simulated-ledger.test.cjs .p40-16i-tests/financial_links_readonly.test.cjs .p40-16k-tests/offline_recovery.test.cjs
      - name: Ensure no real migration API or ERP application integration
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'p40-16r' index.html
          ! grep -q 'p40-16r' assets/js/erp-store.js
          ! grep -q 'p40-16r' assets/js/cloud-sync.js
          ! grep -q 'public.erp_states' .p40-16r-tests/isolated_accounting_commands.sql
          ! grep -q 'supabase.co' .p40-16r-tests/isolated_accounting_commands.sql
          test "$(find .p40-16r-tests -maxdepth 1 -type f | wc -l)" -eq 3
          echo 'PASS no ERP customer data, production schema or financial posting'
