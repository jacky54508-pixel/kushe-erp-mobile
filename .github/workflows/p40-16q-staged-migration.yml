name: P40-16Q staged zero-loss client migration study (SYNTHETIC ONLY)
on:
  push:
    branches: [p40-16q-zero-loss-client-migration-lab-20261117]
    paths:
      - '.p40-16q-tests/**'
      - '.github/workflows/p40-16q-staged-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-staged-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: p40_16q_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-q-local-admin-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d p40_16q_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P40Q_CI_ADMIN_DSN: postgresql://postgres:ci-q-local-admin-only@127.0.0.1:5432/p40_16q_ci
      P40Q_CI_CLIENT_DSN: postgresql://p40q_client:synthetic-q-client-only@127.0.0.1:5432/p40_16q_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed main beta original ERP and allowlist
        shell: bash
        run: |
          set -euo pipefail
          MAIN=2ab9c9d5944b1360ba3eebf49695713168caca8a
          BETA=62669539053a15174081ba8670b18248195c6f8c
          BASE=4ab240777bc7828bee090293df16d155a3218829
          test "$GITHUB_REF_NAME" = p40-16q-zero-loss-client-migration-lab-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/beta)" = "$BETA"
          test "$(git merge-base origin/main HEAD)" = "$MAIN"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"...HEAD > /tmp/p40q-files
          cat /tmp/p40q-files
          test -s /tmp/p40q-files
          if grep -Ev '^(.p40-16q-tests/|.github/workflows/p40-16q-staged-migration.yml$)' /tmp/p40q-files; then
            echo 'STOP: changed nonisolated production file';exit 1
          fi
          for f in index.html assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/app.js assets/js/billing.js assets/js/invoices.js assets/js/commissions.js assets/js/payroll.js assets/js/banks.js assets/js/billing-groups.js assets/js/external-billing-print.js; do
            test "$(git rev-parse origin/main:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          test ! -f .env
          echo 'PASS: main, beta, original ERP, production data all unchanged'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned local PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'psycopg[binary]==3.2.9'
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          for n,w in [('P40Q_CI_ADMIN_DSN','postgres'),('P40Q_CI_CLIENT_DSN','p40q_client')]:
            u=urlsplit(os.environ[n])
            assert u.hostname=='127.0.0.1' and u.path=='/p40_16q_ci' and u.username==w
          print('PASS disposable synthetic PostgreSQL only')
          PY
      - name: Run actual PostgreSQL shadow and guard version transition tests
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16q-tests/test_staged_compatibility.py
      - name: Run synthetic offline draft rescue and backup integrity tests
        shell: bash
        run: |
          set -euo pipefail
          node --check .p40-16q-tests/offline_upgrade_rescue.cjs
          node --check .p40-16q-tests/offline_upgrade_rescue.test.cjs
          node --test .p40-16q-tests/offline_upgrade_rescue.test.cjs
      - name: Repeat P40-16O source-only writer scanner and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16o-tests/audit_writers.py --root . --strict
          python .p40-16o-tests/test_writer_inventory.py
      - name: Repeat P40-16A-D I K synthetic financial and offline regression
        shell: bash
        run: |
          set -euo pipefail
          node --test .p40-16a-tests/review.test.cjs .p40-16b-tests/ui.test.cjs .p40-16c-tests/accounting-gate.test.cjs .p40-16d-tests/simulated-ledger.test.cjs .p40-16i-tests/financial_links_readonly.test.cjs .p40-16k-tests/offline_recovery.test.cjs
      - name: No official migration Supabase connection or app import
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'p40-16q' index.html
          ! grep -q 'p40-16q' assets/js/cloud-sync.js
          ! grep -q 'p40-16q' assets/js/erp-store.js
          ! grep -q 'public.erp_states' .p40-16q-tests/staged_compatibility.sql
          ! grep -q 'supabase.co' .p40-16q-tests/staged_compatibility.sql
          test "$(find .p40-16q-tests -maxdepth 1 -type f | wc -l)" -eq 5
          echo 'PASS no real ERP data schema or app modified'
