name: P33 preflight audit
on:
  push:
    branches: [p33-preflight-audit-20261102]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Start isolated static server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/p33-http.log 2>&1 &
          echo $! > /tmp/p33-http.pid
      - name: Fresh-store smoke
        run: python .p33-audit/smoke.py
