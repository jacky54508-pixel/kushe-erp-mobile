name: P37-19U original Store plus T candidate browser integration
on:
  push:
    branches:
      - p37-19u-t-candidate-browser-review-20261106
    paths:
      - 'p37-lab/p37-19u/**'
      - '.github/workflows/p37-19u-t-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: SHA-pin original Store and T candidate; validate isolated script syntax
        run: |
          python -m py_compile p37-lab/p37-19u/lab_presentation_overlay.py p37-lab/p37-19u/server.py p37-lab/p37-19u/browser_e2e.py
          python p37-lab/p37-19u/lab_presentation_overlay.py
          node --check p37-lab/p37-19u/u-controller.js
          node --check p37-lab/p37-19u/u-augmentation.js
          node --check assets/js/p37-19t-readonly-integration-candidate.js
          node --check assets/js/erp-store.js
          node --check assets/js/kpi-navigation.js
      - name: Regress T candidate, P37-19Q formal no-go release and ledger proofs
        run: |
          node --test p37-lab/p37-19t/candidate.test.cjs
          node --test p37-lab/p37-19q/release-readiness.test.cjs
          node --test p37-lab/p37-19j-financial-integration-gaps.test.cjs
          node --test p37-lab/p37-19k-atomic-settlement.test.cjs
          node --test p37-lab/p37-19h/verified-sessions.test.mjs
          node --test p37-lab/p37-19i/release-gate.test.cjs
      - name: Install pinned Chromium test runner
        run: |
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Previously accepted actual P21 KPI drawer and trends remain safe
        run: python p37-lab/p37-19s/browser_e2e.py
      - name: Execute T standalone candidate with ORIGINAL ERP Store and original P21 dialogs
        run: python p37-lab/p37-19u/browser_e2e.py
