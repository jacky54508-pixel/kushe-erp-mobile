name: P40-16AB browser A4 pagecount feasibility diagnostic (NO PRODUCTION)
on:
  push:
    branches: [p40-16ab-browser-preflight-feasibility-20261117]
    paths:
      - '.p40-16ab-tests/**'
      - '.github/workflows/p40-16ab-browser-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-a4-preflight-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Strict source gate — main/beta immutable and no production files in diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16ab-browser-preflight-feasibility-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40ab-diff
          cat /tmp/p40ab-diff
          test -s /tmp/p40ab-diff
          if grep -Ev '^(\.p40-16(t|u|v|w|x|y|z|aa|ab)-tests/|\.github/workflows/p40-16(t-real-customer-pdf|u-dense-pdf|v-layout-feasibility|w-pdf-readability|x-two-column-a4|y-footer-a4|z-chinese-a4|aa-print-preflight|ab-browser-preflight)\.yml$)' /tmp/p40ab-diff; then
            echo "STOP: changed production file"; exit 1
          fi
          for file in index.html billing-print.html external-billing-print.html assets/js/external-billing-print.js assets/js/external-billing-invoice.js assets/js/erp-store.js assets/js/cloud-sync.js; do
            test "$(git rev-parse "origin/main:$file")" = "$(git rev-parse "HEAD:$file")"
          done
          test ! -f .env
          echo 'PASS: original ERP production files and branches unaffected'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Ephemeral Chrome PDF tools and Chinese font support
        run: |
          python -m pip install 'playwright==1.56.0' 'pymupdf==1.26.5'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Desktop/mobile page geometry vs real PDF and explicit CSS page breaks
        run: |
          python -m py_compile .p40-16ab-tests/test_browser_pagecount_limits.py
          python .p40-16ab-tests/test_browser_pagecount_limits.py
      - name: Archive ONLY synthetic comparison report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p40-16ab-synthetic-pagecount-probe
          path: .p40-16ab-review/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
