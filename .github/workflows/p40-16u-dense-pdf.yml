name: P40-16U dense A4 and mobile synthetic PDF gate (NO PRODUCTION)
on:
  push:
    branches: [p40-16u-dense-customer-pdf-lab-20261117]
    paths:
      - '.p40-16u-tests/**'
      - '.github/workflows/p40-16u-dense-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dense-a4-mobile-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact original main/beta and allowlisted tests only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16u-dense-customer-pdf-lab-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40u-files
          cat /tmp/p40u-files
          if grep -Ev '^(\.p40-16t-tests/|\.p40-16u-tests/|\.github/workflows/p40-16t-real-customer-pdf\.yml$|\.github/workflows/p40-16u-dense-pdf\.yml$)' /tmp/p40u-files; then
            echo 'STOP: application files changed'; exit 1
          fi
          for f in index.html billing-print.html external-billing-print.html assets/js/external-billing-print.js assets/js/erp-store.js assets/js/cloud-sync.js; do
            test "$(git rev-parse origin/main:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          test ! -f .env
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated Chrome PDF test tools
        run: |
          python -m pip install 'playwright==1.56.0' 'pypdf==6.3.0'
          python -m playwright install --with-deps chromium
      - name: Regression P40-16T
        run: python .p40-16t-tests/test_real_customer_pdf.py
      - name: P40-16U dense 6 18 30 lines and mobile width
        run: python .p40-16u-tests/test_dense_print.py
