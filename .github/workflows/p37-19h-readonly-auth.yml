name: P37-19H offline Auth session and read-only RLS gate
on:
  push:
    branches:
      - p37-19h-auth-session-review-20261106
    paths:
      - 'p37-lab/p37-19h/**'
      - '.github/workflows/p37-19h-readonly-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline synthetic JWT, independent sessions and signout tests ONLY
        run: |
          node --check p37-lab/p37-19h/verified-sessions.mjs
          node --check p37-lab/p37-19h/verified-sessions.test.mjs
          node --test p37-lab/p37-19h/verified-sessions.test.mjs
      - name: Regression previous P37-19G mocked RPC, A-D, F no-post gate
        run: |
          node --test p37-lab/p37-19g/dual-client-rpc.test.mjs
          node --test p37-lab/p37-19f/release-gate.test.cjs
          node --test p37-lab/p37-19-isolated-transaction.test.cjs
          node --test p37-lab/p37-19b-consumer-projection.test.cjs
          node --test p37-lab/p37-19c-formal-readonly.test.cjs
          node --test p37-lab/p37-19d-precommit-review.test.cjs
      - name: Formal ERP Store and Cloud Sync remain parseable
        run: |
          node --check assets/js/erp-store.js
          node --check assets/js/cloud-sync.js
