name: P39-3 isolated billing revision and allowance candidate
on:
  push:
    branches:
      - p39-3-allowance-candidate-20261111
    paths:
      - 'p39-candidate/**'
      - 'assets/js/erp-store.js'
      - 'assets/js/billing.js'
      - 'assets/js/dashboard.js'
      - 'index.html'
      - '.github/workflows/p39-3-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Candidate changes must be isolated from formal ERP
        run: |
          set -euo pipefail
          git fetch origin main --depth=5
          git diff --name-only origin/main...HEAD | tee /tmp/p39-files.txt
          if grep -Ev '^(p39-candidate/|\.github/workflows/p39-3-candidate\.yml$|assets/js/erp-store\.js$|assets/js/billing\.js$|assets/js/dashboard\.js$|index\.html$)' /tmp/p39-files.txt; then
            echo 'Unexpected formal ERP file changed'; exit 1
          fi
          test -f p39-candidate/core.js
          test -f p39-candidate/core.test.js
      - name: JavaScript syntax including existing formal application
        run: |
          set -euo pipefail
          node --check p39-candidate/core.js
          node --check p39-candidate/core.test.js
          node --check p39-candidate/sandbox.js
          node --check p39-candidate/effective-accounting.js
          node --check p39-candidate/effective-accounting.test.js
          node --check p39-candidate/voucher-review.js
          node --check p39-candidate/voucher-review.test.js
          node --check p39-candidate/reconciliation-statement.js
          node --check p39-candidate/reconciliation-statement.test.js
          node --check p39-candidate/scenario-gate.js
          node --check p39-candidate/scenario-gate.test.js
          node --check p39-candidate/virtual-cloud-lab.js
          node --check p39-candidate/virtual-cloud-lab.test.js
          node --check p39-candidate/note-ui.js
          for f in assets/js/*.js; do node --check "$f"; done
      - name: Run isolated synthetic accounting regression
        run: node --test p39-candidate/core.test.js p39-candidate/effective-accounting.test.js p39-candidate/voucher-review.test.js p39-candidate/reconciliation-statement.test.js p39-candidate/scenario-gate.test.js p39-candidate/virtual-cloud-lab.test.js
  existing-erp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated Chromium tests
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Launch local synthetic test servers (not ERP cloud)
        run: |
          python -m http.server 8774 --bind 127.0.0.1 >/tmp/p39-8774.log 2>&1 &
          python -m http.server 8784 --bind 127.0.0.1 >/tmp/p39-8784.log 2>&1 &
          python -m http.server 8795 --bind 127.0.0.1 >/tmp/p39-8795.log 2>&1 &
          python -m http.server 8796 --bind 127.0.0.1 >/tmp/p39-8796.log 2>&1 &
      - name: Historical commission rollback regression
        run: python .p33-4-tests/regression.py
      - name: Payroll and commission regression
        run: python .p34-tests/test.py
      - name: Historical correction UI regression
        run: python .p35-tests/test_ui.py
      - name: Authentication and permissions regression
        run: python .p36-tests/test_permissions.py
      - name: Synthetic billing UI isolation and duplicate guard
        run: python p39-candidate/sandbox-ui.test.py
      - name: Guarded Store note revision, accounting integrity and duplicate protection
        run: python p39-candidate/note-store.test.py
      - name: Synthetic effective receivable, cheque and retention Store integration
        run: python p39-candidate/effective-store.test.py
      - name: Synthetic Store posting, rollback, voucher and concurrent tab safety
        run: python p39-candidate/posting-store.test.py
