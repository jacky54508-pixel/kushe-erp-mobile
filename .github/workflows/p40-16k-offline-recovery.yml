name: P40-16K synthetic offline recovery + J PostgreSQL races (NO PRODUCTION)
on:
  push:
    branches: [p40-16k-offline-recovery-failclosed-20261116]
    paths:
      - '.p40-16k-tests/**'
      - '.github/workflows/p40-16k-offline-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: p40_16j_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-j-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p40_16j_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P40J_EPHEMERAL_DSN: postgresql://postgres:synthetic-j-ci-only@127.0.0.1:5432/p40_16j_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: FAIL CLOSED if main/beta, app code or any out-of-scope files changed
        shell: bash
        run: |
          set -euo pipefail
          MAIN=2ab9c9d5944b1360ba3eebf49695713168caca8a
          BETA=62669539053a15174081ba8670b18248195c6f8c
          BASE=72ce54af3fc97065314c04740d9646705b7bab6e
          test "$GITHUB_REF_NAME" = p40-16k-offline-recovery-failclosed-20261116
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/beta)" = "$BETA"
          test "$(git merge-base origin/main HEAD)" = "$MAIN"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"...HEAD > /tmp/p40k-files
          cat /tmp/p40k-files
          test -s /tmp/p40k-files
          if grep -Ev '^(.p40-16k-tests/|.github/workflows/p40-16k-offline-recovery.yml$)' /tmp/p40k-files; then
            echo 'FAIL: out-of-scope write'; exit 1
          fi
          for f in index.html assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/app.js assets/js/billing.js assets/js/billing-groups.js assets/js/invoices.js assets/js/commissions.js assets/js/payroll.js assets/js/banks.js assets/js/external-billing-print.js; do
            test "$(git rev-parse origin/main:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          echo 'PASS production app, main and beta unchanged'
      - name: P40-16K fault injected offline/recovery simulations
        shell: bash
        run: |
          set -euo pipefail
          node --check .p40-16k-tests/offline_recovery_model.cjs
          node --check .p40-16k-tests/offline_recovery.test.cjs
          node --test .p40-16k-tests/offline_recovery.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local-only PostgreSQL test driver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'psycopg[binary]==3.2.9'
          python - <<'PY'
          from urllib.parse import urlsplit
          import os
          p=urlsplit(os.environ['P40J_EPHEMERAL_DSN'])
          assert p.hostname=='127.0.0.1' and p.path=='/p40_16j_ci'
          print('PASS local ephemeral SQL only')
          PY
      - name: Recheck P40-16J real SQL full JSONB vs ledger race cases
        shell: bash
        run: python .p40-16j-tests/test_snapshot_ledger_races.py
      - name: Recheck pure synthetic P40-16A-D and P40-16I no-posting guards
        shell: bash
        run: |
          set -euo pipefail
          node --test .p40-16a-tests/review.test.cjs .p40-16b-tests/ui.test.cjs .p40-16c-tests/accounting-gate.test.cjs .p40-16d-tests/simulated-ledger.test.cjs .p40-16i-tests/financial_links_readonly.test.cjs
      - name: No production API, no Supabase, no new live browser module
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'p40-16k' index.html
          ! grep -q 'p40-16k' assets/js/cloud-sync.js
          ! grep -q 'p40-16k' assets/js/erp-store.js
          echo 'PASS no production database, app or login integration'
