name: P40-16AG local PDF architecture and offline safety contract (NO PRODUCTION)
on:
  push:
    branches: [p40-16ag-local-pdf-decision-lab-20261118]
    paths:
      - '.p40-16ag-review/**'
      - '.p40-16ag-tests/**'
      - '.github/workflows/p40-16ag-local-pdf-decision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-design-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP if main beta or any production app/PDF/data file changed
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16ag-local-pdf-decision-lab-20261118
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40ag-files
          cat /tmp/p40ag-files
          test -s /tmp/p40ag-files
          if grep -Ev '^(\.p40-16ag-review/|\.p40-16ag-tests/|\.github/workflows/p40-16ag-local-pdf-decision\.yml$)' /tmp/p40ag-files; then
            echo 'STOP: unauthorized formal PDF or ERP change'; exit 1
          fi
          for f in index.html billing-print.html billing-bundle-print.html external-billing-print.html assets/js/billing-print.js assets/js/billing-bundle-print.js assets/js/external-billing-print.js assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js .github/workflows/pages.yml; do
            test "$(git rev-parse "origin/main:$f")" = "$(git rev-parse "HEAD:$f")"
          done
          test ! -f .env
          echo 'PASS: only synthetic tests and design docs; original formal main untouched'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test mock customer-facing projection and fail-closed design constraints
        run: |
          python -m py_compile .p40-16ag-tests/test_local_pdf_design_contract.py
          python -m unittest discover -s .p40-16ag-tests -p 'test_*.py' -v
          echo 'CONTRACT ONLY: Does NOT create or inspect true PDF bytes and is NOT production-ready'
