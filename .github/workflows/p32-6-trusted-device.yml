name: P32-6 trusted device synthetic gate
on:
  push:
    branches: [p32-6-trusted-device-20261102]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check assets/js/auth-gate.js
          node --check assets/js/app.js
          node --check .p32-6-tests/trusted-device.test.js
      - name: Synthetic trusted-device auth test
        run: node .p32-6-tests/trusted-device.test.js
