name: P37-19Z isolated 6-digit recovery OTP review (NO real email)
on:
  push:
    branches:
      - p37-19z-test-lab-recovery-otp-review-20261107
    paths:
      - 'p37-lab/p37-19z/**'
      - '.github/workflows/p37-19z-review-otp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-otp-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate scoped test-only JS and original ERP unaffected
        run: |
          node --check p37-lab/p37-19z/otp-reset.js
          node --check p37-lab/p37-19z/otp-reset.test.cjs
          node --check p37-lab/reset-password.js
          node --check assets/js/erp-store.js
          node --check assets/js/cloud-sync.js
          node --check assets/js/dashboard.js
          node --check assets/js/reports.js
      - name: Mocked six-digit recovery, Auth user, RLS whitelist, password and logout
        run: node --test p37-lab/p37-19z/otp-reset.test.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Chromium test runner
        run: |
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Genuine browser, all HTTP routes mocked, no SMTP or Supabase
        run: |
          python -m py_compile p37-lab/p37-19z/browser_otp_e2e.py
          python p37-lab/p37-19z/browser_otp_e2e.py
