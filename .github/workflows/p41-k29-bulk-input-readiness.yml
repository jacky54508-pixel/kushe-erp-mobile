name: P41 K29 bulk input readiness candidate

on:
  push:
    branches: [p41-k29-bulk-input-readiness-20261127]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p41-k29-bulk-input-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-acceptance:
    name: Synthetic finance sync receivables and PDF on ${{ matrix.platform }}
    if: github.ref == 'refs/heads/p41-k29-bulk-input-readiness-20261127'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      ARTIFACT_DIR: artifacts/p41-k29-${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify reviewed scope and syntax
        run: |
          set -euo pipefail
          python .p41-k29-tests/source_guard.py --output "$ARTIFACT_DIR/source"
          for source in assets/js/erp-store.js assets/js/commissions.js assets/js/cloud-sync.js assets/js/billing.js assets/js/billing-print.js assets/js/billing-bundle-print.js assets/js/external-billing-print.js assets/js/billing-groups.js .p41-k29-tests/*.cjs; do node --check "$source"; done
          python -m compileall -q .p41-k29-tests
      - name: Prepare pinned synthetic browser and PDF dependencies
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0 pypdf==5.9.0 Pillow==11.3.0
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'.p41-k28-tests')
          from k28_browser_store import select_browser
          executable=select_browser()
          if not executable:subprocess.check_call([sys.executable,'-m','playwright','install','chromium'])
          result={'systemExecutable':executable,'managedBrowserInstalled':not bool(executable)}
          (Path(os.environ['ARTIFACT_DIR'])/'BROWSER_SELECTION.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result))
          PY
      - name: Prepare readable Chinese PDF and UI fonts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Reproduce defects and verify candidate with real isolated browsers
        run: python .p41-k29-tests/run_acceptance.py --group candidate --output "$ARTIFACT_DIR"
      - name: Retain complete results without rendered QA images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k29-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/p41-k29-${{ matrix.platform }}/
            !artifacts/p41-k29-${{ matrix.platform }}/**/internal-qa/**
            !artifacts/p41-k29-${{ matrix.platform }}/**/*.png
            !artifacts/p41-k29-${{ matrix.platform }}/**/*.pdf
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic screenshots and PDFs for visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k29-internal-qa-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/p41-k29-${{ matrix.platform }}/**/internal-qa/
            artifacts/p41-k29-${{ matrix.platform }}/**/*.png
            artifacts/p41-k29-${{ matrix.platform }}/**/*.pdf
          if-no-files-found: ignore
          retention-days: 3

  unchanged-regressions:
    name: Existing finance recovery auth and quote regressions
    if: github.ref == 'refs/heads/p41-k29-bulk-input-readiness-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      P39_INV_USE_SYSTEM_CHROME: '1'
      ARTIFACT_DIR: artifacts/p41-k29-legacy
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original suites and prepare Chrome and PDF reader
        run: |
          set -euo pipefail
          python .p41-k29-tests/source_guard.py --output "$ARTIFACT_DIR/source"
          command -v google-chrome || command -v google-chrome-stable
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Run original assertions against the exact candidate
        run: python .p41-k29-tests/run_acceptance.py --group legacy --output "$ARTIFACT_DIR"
      - name: Retain every regression outcome without QA images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k29-legacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/p41-k29-legacy/
            !artifacts/p41-k29-legacy/**/internal-qa/**
            !artifacts/p41-k29-legacy/**/*.png
            !artifacts/p41-k29-legacy/**/*.pdf
          if-no-files-found: error
          retention-days: 14
      - name: Retain original synthetic quote PDF and review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k29-internal-qa-legacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/p41-k29-legacy/**/*.png
            artifacts/p41-k29-legacy/**/*.pdf
          if-no-files-found: ignore
          retention-days: 3
