name: P40-15 read-only whole-billing concession (synthetic)
on:
  push:
    branches:
      - p40-15-billing-concession-readonly-main-20261116
    paths:
      - 'index.html'
      - 'assets/js/billing.js'
      - 'assets/js/billing-groups.js'
      - 'assets/js/billing-group-discount-preview.js'
      - '.p40-15-tests/**'
      - '.github/workflows/p40-15-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out isolated P40-15 candidate only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin production main and reject forbidden changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "p40-15-billing-concession-readonly-main-20261116"
          git fetch --no-tags origin main
          BASE=866249b37213f4e15b3baeda0a051a727040670b
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base origin/main HEAD)" = "$BASE"
          git diff --name-only "origin/main...HEAD" > /tmp/p40-15-files
          cat /tmp/p40-15-files
          if grep -Ev '^(.p40-15-tests/|.github/workflows/p40-15-readonly.yml$|index.html$|assets/js/billing.js$|assets/js/billing-groups.js$|assets/js/billing-group-discount-preview.js$)' /tmp/p40-15-files; then
            echo "BLOCK: file outside P40-15 explicit allowlist"; exit 1
          fi
          ! grep -q '^assets/js/erp-store.js$' /tmp/p40-15-files
          ! grep -Eq '^(assets/js/(cloud-sync|commissions|payroll|invoices|banks).js|external-billing-print.html|billing-print.html)$' /tmp/p40-15-files
      - name: JavaScript syntax and isolated synthetic regressions
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/js/*.js; do node --check "$file"; done
          node --check .p40-15-tests/read_only.test.cjs
          node --test .p40-15-tests/read_only.test.cjs
          node --test .p39-inv1-tests/projection.test.js

  browser-ui-isolated:
    name: Chrome desktop/mobile synthetic-only visual acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use system Chrome on localhost only
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          python -m pip install playwright==1.57.0
          python -m http.server 8799 --bind 127.0.0.1 > /tmp/p40-15-8799.log 2>&1 &
      - name: Click through both layouts and compare immutable synthetic state
        shell: bash
        env:
          P40_CHROME_BINARY: /usr/bin/google-chrome
        run: |
          python .p40-15-tests/browser_ui.py
          python .p40-15-tests/integration_ui.py
      - name: Save isolated QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p40-15a-desktop-mobile-synthetic
          path: .p40-15-tests/screenshots/*.png
          if-no-files-found: ignore

  existing-erp-regressions:
    name: Existing P33-P36 payroll/finance and P39 A4/18-line PDF regression
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout candidate in regression sandbox
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python for existing isolated browser/PDF suites
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start localhost-only synthetic servers and system Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          for port in 8774 8784 8795 8796 8797; do
            python -m http.server "$port" --bind 127.0.0.1 > "/tmp/p40-15b-$port.log" 2>&1 &
          done
      - name: Regression P33 employee commission source and safety
        run: python .p39-inv1-tests/chrome_legacy.py .p33-4-tests/regression.py
      - name: Regression P34 payroll / historical finance
        run: python .p39-inv1-tests/chrome_legacy.py .p34-tests/test.py
      - name: Regression P35 targeted historical correction
        run: python .p39-inv1-tests/chrome_legacy.py .p35-tests/test_ui.py
      - name: Regression P36 owner and employee permissions
        run: python .p39-inv1-tests/chrome_legacy.py .p36-tests/test_permissions.py
      - name: Regression P39 A4 customer PDF, 18 lines, private IDs and print layout
        env:
          P39_INV_USE_SYSTEM_CHROME: "1"
        run: python .p39-inv1a-tests/pdf_display.test.py
