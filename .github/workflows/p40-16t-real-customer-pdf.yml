name: P40-16T actual Chrome A4 synthetic customer PDF (NO PRODUCTION)
on:
  push:
    branches: [p40-16t-external-pdf-isolated-20261117]
    paths:
      - '.p40-16t-tests/**'
      - '.github/workflows/p40-16t-real-customer-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-real-chrome-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP if main beta or any production source diverges
        shell: bash
        run: |
          set -euo pipefail
          MAIN=2ab9c9d5944b1360ba3eebf49695713168caca8a
          BETA=62669539053a15174081ba8670b18248195c6f8c
          test "$GITHUB_REF_NAME" = p40-16t-external-pdf-isolated-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/beta)" = "$BETA"
          test "$(git merge-base origin/main HEAD)" = "$MAIN"
          git diff --name-only origin/main...HEAD >/tmp/p40t-diff
          cat /tmp/p40t-diff
          test -s /tmp/p40t-diff
          if grep -Ev '^(\.p40-16t-tests/|\.github/workflows/p40-16t-real-customer-pdf\.yml$)' /tmp/p40t-diff; then echo 'STOP unexpected change'; exit 1; fi
          for f in index.html external-billing-print.html billing-print.html assets/js/external-billing-print.js assets/js/external-billing-invoice.js assets/js/erp-store.js assets/js/cloud-sync.js; do
            test "$(git rev-parse "origin/main:$f")" = "$(git rev-parse "HEAD:$f")"
          done
          test ! -f .env
          echo 'PASS: original production app intact'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install 'playwright==1.56.0' 'pypdf==6.3.0'
          python -m playwright install --with-deps chromium
      - name: Render original customer PDF using synthetic local payload only
        env:
          CI: 'true'
        run: python .p40-16t-tests/test_real_customer_pdf.py
