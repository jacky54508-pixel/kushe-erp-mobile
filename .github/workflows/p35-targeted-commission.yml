name: P35 single-batch historical commission safety
on:
  push:
    branches:
      - p35-oct07-safe-correction-20261103
      - p35-formal-rc-20261103
      - beta
      - main
    paths:
      - 'assets/js/erp-store.js'
      - 'assets/js/p33-3-historical-commission-preview.js'
      - 'assets/js/p35-historical-correction-ui.js'
      - 'assets/css/p35-historical-correction.css'
      - 'index.html'
      - '.p35-tests/**'
      - '.p33-4-tests/**'
      - '.p34-tests/test.py'
      - '.github/workflows/p35-targeted-commission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check all application JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/js/*.js; do node --check "$file"; done
      - name: Install isolated Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Start synthetic test-only HTTP servers
        run: |
          python -m http.server 8774 --bind 127.0.0.1 >/tmp/p35-8774.log 2>&1 &
          python -m http.server 8784 --bind 127.0.0.1 >/tmp/p35-8784.log 2>&1 &
          python -m http.server 8795 --bind 127.0.0.1 >/tmp/p35-8795.log 2>&1 &
      - name: Assert targeted writer rejects unsafe historical records
        run: python .p33-4-tests/regression.py
      - name: Preserve P34 50-percent commission calculations and readonly audit
        run: python .p34-tests/test.py
      - name: Verify user-confirmed backup and targeted correction UI
        run: python .p35-tests/test_ui.py
