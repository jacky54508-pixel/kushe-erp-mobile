name: P40-16BD real RS256 signature/JWKS isolated fake billing gate
on:
  push:
    branches: [p40-16bd-cryptographic-jwt-gateway-isolated-20261119]
    paths:
      - '.p40-16bd-tests/**'
      - '.p40-16bd-review/**'
      - '.github/workflows/p40-16bd-signed-jwt-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-jwt-cryptography-no-live-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP unless formal main/beta pinned and only 4 isolated files added
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16bd-cryptographic-jwt-gateway-isolated-20261119
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40bd-allowed
          cat /tmp/p40bd-allowed
          test "$(wc -l < /tmp/p40bd-allowed)" -eq 4
          if grep -Ev '^(\.p40-16bd-(tests|review)/.+|\.github/workflows/p40-16bd-signed-jwt-ci\.yml)$' /tmp/p40bd-allowed; then
            echo 'STOP: production app or unrelated source change';exit 1
          fi
          for p in index.html billing-print.html billing-bundle-print.html external-billing-print.html assets/js/erp-store.js assets/js/billing-groups.js assets/js/external-billing-print.js assets/js/external-billing-invoice.js assets/js/billing-print.js assets/js/billing-group-discount-preview.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/config.js .github/workflows/pages.yml; do
            test "$(git rev-parse "HEAD:$p")" = "$(git rev-parse "origin/main:$p")" || { echo "STOP changed: $p"; exit 1; }
          done
          test ! -e .env
          test ! -e supabase/migrations
          if grep -R -E -- '-----BEGIN (RSA |EC )?PRIVATE KEY-----|sb_secret_|service_role_key' .p40-16bd-tests/; then
            echo 'STOP: secret or private key in test source'; exit 1
          fi
          echo 'P40BD_FORMAL_MAIN_BETA_UNMODIFIED_AND_NO_SECRETS'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate throwaway RSA-2048 in-memory and run REAL cryptographic negative tests
        run: |
          node --check .p40-16bd-tests/verify_fake_jwt.cjs
          node --check .p40-16bd-tests/test_signed_session.cjs
          node --test .p40-16bd-tests/test_signed_session.cjs
          echo 'P40BD_RSA_SIGN_VERIFY_FAKE_CI_ONLY_NO_REAL_SUPABASE_SESSION_OR_ERP_ACCOUNT'
      - name: Reconfirm original financial/billing/auth/PDF code untouched
        run: |
          git diff --exit-code origin/main -- index.html assets/js \
            billing-print.html billing-bundle-print.html \
            external-billing-print.html .github/workflows/pages.yml
          echo 'P40BD_PRODUCTION_RELEASE_BLOCKED_NO_AUTH_SERVER_NO_PDF_NO_FINANCE_MUTATION'
