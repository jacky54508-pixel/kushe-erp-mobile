name: P37-19Q formal release no-go audit and synthetic two-tab race
on:
  push:
    branches:
      - p37-19q-release-readiness-review-20261106
    paths:
      - 'p37-lab/p37-19q/**'
      - '.github/workflows/p37-19q-release-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-same-origin-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit actual production source hashes and 17 NO-GO release gates
        run: |
          node --check p37-lab/p37-19q/release-readiness.cjs
          node --check p37-lab/p37-19q/release-readiness.test.cjs
          node --test p37-lab/p37-19q/release-readiness.test.cjs
      - name: Regression P37-19H through P37-19P no-post gates
        run: |
          node --test p37-lab/p37-19j-financial-integration-gaps.test.cjs
          node --test p37-lab/p37-19j-multi-document-projection.test.cjs
          node --test p37-lab/p37-19k-atomic-settlement.test.cjs
          node --test p37-lab/p37-19l-store-cloud-cas.test.cjs
          node --test p37-lab/p37-19h/verified-sessions.test.mjs
          node --test p37-lab/p37-19i/release-gate.test.cjs
      - name: Validate exact original Store and sandbox-only derived source
        run: |
          python -m py_compile p37-lab/p37-19q/browser_concurrent_original_store.py
          python p37-lab/p37-19p/lab_overlay.py --verify-only
          node --check assets/js/erp-store.js
          node --check assets/js/cloud-sync.js
          node --check assets/js/dashboard.js
          node --check assets/js/reports.js
      - name: Install pinned Playwright for isolated Chromium
        run: |
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Regress unmodified original Store receipt, retention and cheque
        run: python p37-lab/p37-19o/browser_e2e.py
      - name: Regress approved balance with only the ephemeral lab Store overlay
        run: python p37-lab/p37-19p/browser_e2e.py
      - name: Two same-origin stale browser tabs race actual patched Store settlement
        run: python p37-lab/p37-19q/browser_concurrent_original_store.py
