name: P37-19M isolated Chromium IndexedDB recovery and mock CAS
on:
  push:
    branches:
      - p37-19m-isolated-browser-storage-20261106
    paths:
      - 'p37-lab/p37-19m/**'
      - '.github/workflows/p37-19m-browser-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-storage-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source syntax and isolated fixture check
        run: |
          node --check p37-lab/p37-19m/browser-store.js
          python -m py_compile p37-lab/p37-19m/mock_server.py p37-lab/p37-19m/browser_e2e.py
          node --check assets/js/erp-store.js
          node --check assets/js/cloud-sync.js
      - name: Previous synthetic financial and CAS safety regression
        run: |
          node --test p37-lab/p37-19l-store-cloud-cas.test.cjs
          node --test p37-lab/p37-19k-atomic-settlement.test.cjs
          node --test p37-lab/p37-19j-multi-document-projection.test.cjs
          node --test p37-lab/p37-19j-financial-integration-gaps.test.cjs
          node --test p37-lab/p37-19i/release-gate.test.cjs
          node --test p37-lab/p37-19h/verified-sessions.test.mjs
          node --test p37-lab/p37-19g/dual-client-rpc.test.mjs
          node --test p37-lab/p37-19f/release-gate.test.cjs
      - name: Install pinned browser test library
        run: |
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Isolated browser reload persistence, crash recovery and CAS
        run: python p37-lab/p37-19m/browser_e2e.py
