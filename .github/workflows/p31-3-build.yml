name: P31-3 isolated compact list source verification
on:
  push:
    branches: [p31-3-build-20261030]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 10c77bddbd2845290e4317e093c543238dc1b34c
          path: candidate
          fetch-depth: 1
      - name: Verify exact tested UI patch and all protected source
        run: python3 harness/.p31-3-build/build.py
      - name: Verify every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          find candidate/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Create clean review candidate only
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate commit -m 'P31-3: compact billing and receivable group summaries only' -m 'Three UI/loading files only. Compact summary, visible scoped amounts, primary external-detail action and accessible original-row toggle. No original record, grouping calculation, Store, editor, receipt or PDF changes. Local isolated verification: 367 checks and all 39 JavaScript syntax checks passed. Complete candidate tree verified equal to locally tested source. Synthetic data only; no real ERP login or database access. This workflow creates only a review branch, not main or beta.'
          git -C candidate rev-parse HEAD > evidence/candidate-sha.txt
          git -C candidate push origin HEAD:refs/heads/p31-3-ready-20261030
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p31-3-source-evidence
          path: evidence
          retention-days: 7
