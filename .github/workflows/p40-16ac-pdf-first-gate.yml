name: P40-16AC verified PDF-first byte release LAB (NO PRODUCTION)
on:
  push:
    branches: [p40-16ac-verified-pdf-first-lab-20261117]
    paths:
      - '.p40-16ac-tests/**'
      - '.github/workflows/p40-16ac-pdf-first-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-synthetic-pdf-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP unless main beta and all production app files are unmodified
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16ac-verified-pdf-first-lab-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40ac-diff
          cat /tmp/p40ac-diff
          test -s /tmp/p40ac-diff
          if grep -Ev '^(\.p40-16(t|u|v|w|x|y|z|aa|ab|ac)-tests/|\.github/workflows/p40-16(t-real-customer-pdf|u-dense-pdf|v-layout-feasibility|w-pdf-readability|x-two-column-a4|y-footer-a4|z-chinese-a4|aa-print-preflight|ab-browser-preflight|ac-pdf-first-gate)\.yml$)' /tmp/p40ac-diff; then
            echo 'STOP: any non-test change'; exit 1
          fi
          for f in index.html billing-print.html external-billing-print.html assets/js/external-billing-print.js assets/js/external-billing-invoice.js assets/js/erp-store.js assets/js/cloud-sync.js; do
            test "$(git rev-parse "origin/main:$f")" = "$(git rev-parse "HEAD:$f")"
          done
          test ! -f .env
          echo 'PASS: untouched original production ERP HTML/JS, main and beta'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install ephemeral Chromium PDF tools and Chinese fonts
        run: |
          python -m pip install 'playwright==1.56.0' 'pymupdf==1.26.5'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Fail-closed verified PDF-first gate, negative and tamper tests
        run: |
          python -m py_compile .p40-16ac-tests/test_pdf_first_gate.py
          python .p40-16ac-tests/test_pdf_first_gate.py
      - name: Archive ONLY VERIFIED synthetic PDF and manifest
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p40-16ac-verified-synthetic-pdfs
          path: .p40-16ac-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
