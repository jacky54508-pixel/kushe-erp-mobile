name: Deploy main and beta to GitHub Pages

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout formal site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Beta ERP from beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-source
          fetch-depth: 1
          persist-credentials: false

      - name: Assemble and verify Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f site/index.html
          test -f beta-source/index.html

          hash_formal_root() {
            find site \
              -path 'site/.git' -prune -o \
              -path 'site/.github' -prune -o \
              -path 'site/beta' -prune -o \
              -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | awk '{print $1}'
          }

          formal_hash_before="$(hash_formal_root)"

          rm -rf site/beta
          mkdir -p site/beta
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            beta-source/ site/beta/

          formal_hash_after="$(hash_formal_root)"
          test "$formal_hash_before" = "$formal_hash_after"
          test -f site/index.html
          test -f site/beta/index.html

          rm -rf site/.git site/.github

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Deploy verified Pages artifact by upload ID
        id: deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # verified v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            const fail = message => Object.assign(new Error(message), {safeMessage: message});
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const transient = error => [404, 429, 500, 502, 503, 504].includes(error.status);
            let pendingId = null;
            try {
              if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw fail('Upload did not return a valid artifact ID.');
              let artifact;
              for (let attempt = 0; attempt < 12; attempt++) {
                try {
                  artifact = (await github.request('GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}', {
                    ...context.repo, artifact_id: artifactId, request: {timeout: 10000}
                  })).data;
                  break;
                } catch (error) {
                  if (!transient(error) || attempt === 11) throw error;
                  await sleep(2000);
                }
              }
              if (artifact.id !== artifactId || artifact.name !== process.env.PAGES_ARTIFACT_NAME || artifact.expired ||
                  artifact.workflow_run?.id !== context.runId || artifact.workflow_run?.head_sha !== context.sha) {
                throw fail('Artifact ID, attempt name, workflow run or source commit does not match this release.');
              }
              core.info('Verified uploaded Pages artifact ID ' + artifactId + ' for commit ' + context.sha);
              const idToken = await core.getIDToken();
              core.setSecret(idToken);
              const deployment = (await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                ...context.repo, artifact_id: artifactId, pages_build_version: context.sha,
                oidc_token: idToken, request: {timeout: 30000}
              })).data;
              pendingId = deployment.id || deployment.status_url?.split('/').pop();
              if (!pendingId) throw fail('Pages API did not return a deployment ID.');
              core.info('Created Pages deployment ' + pendingId + ' from the verified upload.');
              const deadline = Date.now() + 600000;
              const terminal = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
                                        'deployment_cancelled', 'deployment_lost']);
              let errors = 0;
              while (Date.now() < deadline) {
                await sleep(5000);
                let state;
                try {
                  state = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                    ...context.repo, deploymentId: pendingId, request: {timeout: 10000}
                  })).data.status;
                } catch (error) {
                  if (!transient(error) || ++errors >= 10) throw error;
                  continue;
                }
                if (state === 'succeed') {
                  pendingId = null;
                  core.setOutput('page_url', deployment.page_url);
                  core.setOutput('status', 'succeed');
                  core.info('GitHub Pages deployment succeeded.');
                  return;
                }
                if (terminal.has(state)) throw fail('GitHub Pages reported ' + state + '.');
                core.info('GitHub Pages status: ' + state);
              }
              throw fail('Timed out waiting for GitHub Pages deployment.');
            } catch (error) {
              if (pendingId) {
                try {
                  await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
                    ...context.repo, deploymentId: pendingId, request: {timeout: 10000}
                  });
                } catch (_) { core.warning('Could not confirm cancellation; check the Pages deployment status.'); }
              }
              core.setFailed(error.safeMessage || 'Pages API operation failed; HTTP status ' + (error.status || 'unavailable') + '. No credentials or request bodies are logged.');
            }
