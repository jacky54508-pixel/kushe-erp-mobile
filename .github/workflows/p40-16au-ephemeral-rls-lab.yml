name: P40-16AU isolated PostgreSQL single-document RLS lab (NO SUPABASE ACCESS)
on:
  push:
    branches: [p40-16au-isolated-single-document-rls-lab-20261118]
    paths:
      - '.p40-16au-tests/**'
      - '.p40-16au-review/**'
      - '.github/workflows/p40-16au-ephemeral-rls-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-document-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: p40au_ephemeral
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p40au_fake_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p40au_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P40AU_EPHEMERAL_PG_URL: postgresql://postgres:p40au_fake_password_ci@127.0.0.1:5432/p40au_ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP if main beta moved or any production file changed
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16au-isolated-single-document-rls-lab-20261118
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40au-diff
          cat /tmp/p40au-diff
          test "$(wc -l < /tmp/p40au-diff)" -eq 4
          if grep -Ev '^(\.p40-16au-(tests|review)/.+|\.github/workflows/p40-16au-ephemeral-rls-lab\.yml)$' /tmp/p40au-diff; then
            echo 'STOP: production source modified'; exit 1
          fi
          for f in index.html billing-print.html billing-bundle-print.html external-billing-print.html assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/billing-groups.js assets/js/billing-print.js assets/js/external-billing-print.js assets/js/config.js .github/workflows/pages.yml; do
            test "$(git rev-parse "HEAD:$f")" = "$(git rev-parse "origin/main:$f")"
          done
          test ! -e .env
          test ! -d supabase/migrations
          echo 'PASS: production main beta and all ERP source unchanged'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install local Postgres client only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          pg_isready -h 127.0.0.1 -U postgres -d p40au_ephemeral
          test "$P40AU_EPHEMERAL_PG_URL" = "postgresql://postgres:p40au_fake_password_ci@127.0.0.1:5432/p40au_ephemeral"
      - name: Create FAKE single-document schema in throwaway database
        run: |
          psql "$P40AU_EPHEMERAL_PG_URL" -X -v ON_ERROR_STOP=1 \
            -f .p40-16au-tests/ephemeral_model.sql > /tmp/p40au-setup.log
          echo 'PASS: disposable fake schema and fake-only fixtures created'
      - name: Execute actual PostgreSQL RLS/ACL security tests
        run: |
          python -m unittest discover -s .p40-16au-tests -p 'test_*.py' -v
          echo 'P40AU DATABASE RLS LAB PASS = SYNTHETIC ONLY, NO LIVE AUTH OR ERP BACKEND'
      - name: Confirm no app deployment or production SQL migration
        run: |
          test ! -e supabase/migrations
          test ! -e .env
          git diff --exit-code origin/main -- index.html billing-print.html assets/js \
            .github/workflows/pages.yml
          echo 'PRODUCTION_GATEWAY_BLOCKED: mock JWT GUC, no authoritative billing ingestion or real data reconciliation'
