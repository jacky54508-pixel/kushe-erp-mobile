name: P40-16S cross-area multi-invoice credit and partial receipt safe lab (NO PRODUCTION)
on:
  push:
    branches: [p40-16s-cross-area-invoice-allowance-lab-20261117]
    paths:
      - '.p40-16s-tests/**'
      - '.github/workflows/p40-16s-cross-area-invoice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-cross-area-source-finance:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: p40_16s_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-s-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p40_16s_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P40S_ADMIN_DSN: postgresql://postgres:synthetic-s-postgres-only@127.0.0.1:5432/p40_16s_ci
      P40S_CLERK_DSN: postgresql://p40s_clerk:synthetic-s-clerk-ci@127.0.0.1:5432/p40_16s_ci
      P40S_PUBLIC_DSN: postgresql://p40s_public:synthetic-s-viewer-ci@127.0.0.1:5432/p40_16s_ci
      P40R_ADMIN_DSN: postgresql://postgres:synthetic-s-postgres-only@127.0.0.1:5432/p40_16r_ci
      P40R_OPERATOR_DSN: postgresql://p40r_operator:p40r-fake-operator-ci@127.0.0.1:5432/p40_16r_ci
      P40R_VIEWER_DSN: postgresql://p40r_viewer:p40r-fake-viewer-ci@127.0.0.1:5432/p40_16r_ci
      P40Q_CI_ADMIN_DSN: postgresql://postgres:synthetic-s-postgres-only@127.0.0.1:5432/p40_16q_ci
      P40Q_CI_CLIENT_DSN: postgresql://p40q_client:synthetic-q-client-only@127.0.0.1:5432/p40_16q_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed verify main beta source integrity and narrow P40-16S diff
        shell: bash
        run: |
          set -euo pipefail
          MAIN=2ab9c9d5944b1360ba3eebf49695713168caca8a
          BETA=62669539053a15174081ba8670b18248195c6f8c
          BASE=a4eb6a4d53344508f173a102700d7525f34db7b0
          test "$GITHUB_REF_NAME" = p40-16s-cross-area-invoice-allowance-lab-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/beta)" = "$BETA"
          test "$(git merge-base origin/main HEAD)" = "$MAIN"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"...HEAD > /tmp/p40s-allowlist
          cat /tmp/p40s-allowlist
          test -s /tmp/p40s-allowlist
          if grep -Ev '^(.p40-16s-tests/|.github/workflows/p40-16s-cross-area-invoice.yml$)' /tmp/p40s-allowlist; then
            echo 'STOP: unexpected app/Supabase/data file change';exit 1
          fi
          for f in index.html assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/app.js assets/js/billing.js assets/js/billing-groups.js assets/js/invoices.js assets/js/commissions.js assets/js/payroll.js assets/js/banks.js assets/js/external-billing-print.js; do
            test "$(git rev-parse origin/main:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          test ! -f .env
          echo 'PASS main beta and production ERP unchanged'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed PostgreSQL 16 test client and verify localhost databases
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'psycopg[binary]==3.2.9'
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          role_names={'P40S_ADMIN_DSN':'postgres','P40S_CLERK_DSN':'p40s_clerk',
          'P40S_PUBLIC_DSN':'p40s_public','P40R_ADMIN_DSN':'postgres',
          'P40R_OPERATOR_DSN':'p40r_operator','P40R_VIEWER_DSN':'p40r_viewer',
          'P40Q_CI_ADMIN_DSN':'postgres','P40Q_CI_CLIENT_DSN':'p40q_client'}
          for name,role in role_names.items():
            x=urlparse(os.environ[name])
            assert x.hostname=='127.0.0.1' and x.username==role
            assert x.path in ('/p40_16s_ci','/p40_16r_ci','/p40_16q_ci')
            assert name.split('_')[0][-1].lower() in x.path or name.startswith('P40Q_')
          print('PASS all DSNs point to disposable loopback databases only')
          PY
      - name: Create disposable prior test databases without production resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import psycopg,os
          with psycopg.connect(os.environ['P40S_ADMIN_DSN'],autocommit=True) as db:
            db.execute('CREATE DATABASE p40_16r_ci')
            db.execute('CREATE DATABASE p40_16q_ci')
          print('PASS disposable R and Q test databases')
          PY
      - name: Real PG two-original Aug Oct invoice source and allowance tests
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16s-tests/test_source_invoice_ledger.py
      - name: Nine read only formal source contracts for invoice and customer PDF privacy
        shell: bash
        run: |
          set -euo pipefail
          node --test .p40-16s-tests/test_existing_source_contract.test.cjs
      - name: Regression from P40-16R including vendor banking and salary linkage
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16r-tests/test_finance_commands.py
      - name: P40-16Q staged migration and offline retention regression
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16q-tests/test_staged_compatibility.py
          node --test .p40-16q-tests/offline_upgrade_rescue.test.cjs
      - name: P40-16O writer inventory and earlier finance no-write regressions
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16o-tests/audit_writers.py --root . --strict
          python .p40-16o-tests/test_writer_inventory.py
          node --test .p40-16a-tests/review.test.cjs .p40-16b-tests/ui.test.cjs .p40-16c-tests/accounting-gate.test.cjs .p40-16d-tests/simulated-ledger.test.cjs .p40-16i-tests/financial_links_readonly.test.cjs .p40-16k-tests/offline_recovery.test.cjs
      - name: Final no production Supabase migration or external PDF mutation guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'p40-16s' index.html
          ! grep -q 'p40-16s' assets/js/cloud-sync.js
          ! grep -q 'p40-16s' assets/js/erp-store.js
          ! grep -q 'public.erp_states' .p40-16s-tests/synthetic_group_invoice_ledger.sql
          ! grep -q 'supabase.co' .p40-16s-tests/synthetic_group_invoice_ledger.sql
          test "$(find .p40-16s-tests -maxdepth 1 -type f | wc -l)" -eq 4
          echo 'PASS only synthetic PostgreSQL and source-only guards; NO production posting'
