name: P40-16M exact ERP Store/Cloud Sync isolated Chromium E2E (NO PRODUCTION)
on:
  push:
    branches: [p40-16m-real-erp-modules-isolated-20261116]
    paths:
      - '.p40-16m-tests/**'
      - '.github/workflows/p40-16m-real-modules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-main-module-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: p40_16j_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-j-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d p40_16j_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      P40J_EPHEMERAL_DSN: postgresql://postgres:synthetic-j-ci-only@127.0.0.1:5432/p40_16j_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate latest main beta and only isolated P40-16M additions
        shell: bash
        run: |
          set -euo pipefail
          MAIN=2ab9c9d5944b1360ba3eebf49695713168caca8a
          BETA=62669539053a15174081ba8670b18248195c6f8c
          BASE=a49855e6a891532fdd008cc2adcc9cc8d6328ff6
          test "$GITHUB_REF_NAME" = p40-16m-real-erp-modules-isolated-20261116
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/beta)" = "$BETA"
          test "$(git merge-base origin/main HEAD)" = "$MAIN"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE"...HEAD > /tmp/p40m-changes
          cat /tmp/p40m-changes
          test -s /tmp/p40m-changes
          if grep -Ev '^(.p40-16m-tests/|.github/workflows/p40-16m-real-modules.yml$)' /tmp/p40m-changes; then
            echo 'BLOCKED: real ERP files outside P40-16M scope';exit 1
          fi
          for f in index.html assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/app.js assets/js/billing.js assets/js/billing-groups.js assets/js/invoices.js assets/js/commissions.js assets/js/payroll.js assets/js/banks.js assets/js/external-billing-print.js; do
            test "$(git rev-parse origin/main:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          echo 'PASS real ERP files remain byte-for-byte unchanged'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Playwright Chromium and disposable PG test packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.57.0' 'psycopg[binary]==3.2.9'
          python -m playwright install --with-deps chromium
      - name: Start local-only fixture and verify no user data is loaded
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8798 --bind 127.0.0.1 > /tmp/p40m-http.log 2>&1 &
          for n in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8798/.p40-16m-tests/real_module_fixture.html >/dev/null; then break; fi
            if [ "$n" -eq 20 ]; then echo 'Local fixture failed';exit 1; fi
            sleep 1
          done
      - name: Exercise EXACT production modules using Chrome native IDB and fake network
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16m-tests/test_real_erp_modules.py
      - name: P40-16L independent native-browser regression
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8797 --bind 127.0.0.1 >/tmp/p40l-http.log 2>&1 &
          python .p40-16l-tests/test_chromium_storage.py
      - name: P40-16J real SQL CAS conflict regression in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python .p40-16j-tests/test_snapshot_ledger_races.py
      - name: Prior P40-16K, A-D, I synthetic no-write regression
        shell: bash
        run: |
          set -euo pipefail
          node --test .p40-16k-tests/offline_recovery.test.cjs .p40-16a-tests/review.test.cjs .p40-16b-tests/ui.test.cjs .p40-16c-tests/accounting-gate.test.cjs .p40-16d-tests/simulated-ledger.test.cjs .p40-16i-tests/financial_links_readonly.test.cjs
      - name: No new live ERP imports, Supabase traffic, or real accounting data
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'p40-16m' index.html
          ! grep -q 'p40-16m' assets/js/erp-store.js
          ! grep -q 'p40-16m' assets/js/cloud-sync.js
          ! grep -q 'jimcybsztnwfzrnvexsp' .p40-16m-tests/real_module_fixture.html
          ! grep -q 'https://.*supabase.co' .p40-16m-tests/real_module_fixture.html
          echo 'PASS no formal ERP, DB or financial write'
