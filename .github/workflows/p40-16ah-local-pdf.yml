name: P40-16AH true browser-local CJK PDF generator (NO PRODUCTION)
on:
  push:
    branches: [p40-16ah-browser-local-pdf-lab-20261118]
    paths:
      - '.p40-16ah-tests/**'
      - '.p40-16ah-review/**'
      - '.github/workflows/p40-16ah-local-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-local-browser-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed on main beta or application changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16ah-browser-local-pdf-lab-20261118
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40ah-files
          cat /tmp/p40ah-files
          test -s /tmp/p40ah-files
          if grep -Ev '^(\.p40-16ah-tests/|\.p40-16ah-review/|\.github/workflows/p40-16ah-local-pdf\.yml$)' /tmp/p40ah-files; then
            echo 'STOP: unauthorized changes to original ERP and PDFs'; exit 1
          fi
          for f in index.html billing-print.html billing-bundle-print.html external-billing-print.html assets/js/billing-print.js assets/js/billing-bundle-print.js assets/js/external-billing-print.js assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js .github/workflows/pages.yml; do
            test "$(git rev-parse "origin/main:$f")" = "$(git rev-parse "HEAD:$f")"
          done
          if git ls-tree -r --name-only HEAD | grep -Ei '^\.p40-16ah-tests/.*\.(ttf|ttc|otf|woff2?)$'; then
            echo 'STOP: font binary unexpectedly committed'; exit 1
          fi
          test ! -f .env
          echo 'PASS formal ERP, PDF and sync code intact; no font committed'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned local PDF libraries without scripts or cloud APIs
        run: |
          npm install --prefix .p40-16ah-tests --no-save --package-lock=false --ignore-scripts --no-audit --no-fund pdf-lib@1.17.1 @pdf-lib/fontkit@1.1.1
          test -s .p40-16ah-tests/node_modules/pdf-lib/dist/pdf-lib.min.js
          test -s .p40-16ah-tests/node_modules/@pdf-lib/fontkit/dist/fontkit.umd.min.js
      - name: Install ephemeral Chinese test font and browser
        run: |
          python -m pip install 'playwright==1.56.0' 'pymupdf==1.26.5'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-bsmi00lp
          test -s /usr/share/fonts/truetype/arphic-bsmi00lp/bsmi00lp.ttf
          cp /usr/share/fonts/truetype/arphic-bsmi00lp/bsmi00lp.ttf .p40-16ah-tests/runtime-font.ttf
      - name: Generate actual client-side PDF bytes and validate independent A4/PDF text
        run: |
          python -m py_compile .p40-16ah-tests/test_browser_pdf.py
          python .p40-16ah-tests/test_browser_pdf.py
      - name: Remove transient font before publishing PDF-only artifacts
        if: always()
        run: |
          rm -f .p40-16ah-tests/runtime-font.ttf
          echo 'Ephemeral Chinese font deleted from test folder; never upload font files.'
      - name: Upload only passing SYNTHETIC PDFs and PNGs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p40-16ah-pure-browser-synthetic-pdfs
          path: .p40-16ah-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
