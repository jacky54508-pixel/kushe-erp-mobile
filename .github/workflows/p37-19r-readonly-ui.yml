name: P37-19R isolated original Dashboard and Reports effective money preview
on:
  push:
    branches:
      - p37-19r-dashboard-report-readonly-review-20261106
    paths:
      - 'p37-lab/p37-19r/**'
      - '.github/workflows/p37-19r-readonly-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-read-only-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: SHA-pin original UI files, guard new reader and fixture syntax
        run: |
          node --check p37-lab/p37-19r/effective-kpi-reader.js
          node --check p37-lab/p37-19r/r-controller.js
          node --check p37-lab/p37-19r/r-augmentation.js
          node --check assets/js/erp-store.js
          node --check assets/js/dashboard.js
          node --check assets/js/reports.js
          python -m py_compile p37-lab/p37-19r/server.py p37-lab/p37-19r/browser_e2e.py
          python -c "import sys; sys.path.insert(0,'p37-lab/p37-19r'); from server import verify_originals; print('Verified unchanged original UI/store sources:', verify_originals())"
      - name: Regress 17 formal NO-GO release checks and synthetic finance
        run: |
          node --test p37-lab/p37-19q/release-readiness.test.cjs
          node --test p37-lab/p37-19j-financial-integration-gaps.test.cjs
          node --test p37-lab/p37-19j-multi-document-projection.test.cjs
          node --test p37-lab/p37-19k-atomic-settlement.test.cjs
          node --test p37-lab/p37-19l-store-cloud-cas.test.cjs
          node --test p37-lab/p37-19h/verified-sessions.test.mjs
          node --test p37-lab/p37-19i/release-gate.test.cjs
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Previous original Store browser acceptance remains safe
        run: python p37-lab/p37-19o/browser_e2e.py
      - name: Previous approved-balance / bank / commission laboratory acceptance
        run: python p37-lab/p37-19p/browser_e2e.py
      - name: Execute ORIGINAL dashboard and reports on same isolated read-only preview
        run: python p37-lab/p37-19r/browser_e2e.py
