name: P40-16BV real Chrome fake ERP two-tab A4 PDF acceptance (NO DEPLOY)
on:
  push:
    branches: [p40-16bv-real-chrome-fake-20261120]
    paths:
      - '.p40-16bv-tests/**'
      - '.github/workflows/p40-16bv-real-chrome-fake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-chrome-two-tab-fake-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned PR 76 parent, exact two add-only files, no production changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16bv-real-chrome-fake-20261120
          git fetch --no-tags origin main beta p40-16bu-no-snapshot-url-handoff-20261120
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git rev-parse origin/p40-16bu-no-snapshot-url-handoff-20261120)" = 7698921604ca37a17645c91ceea62b2eb1993443
          test "$(git merge-base origin/p40-16bu-no-snapshot-url-handoff-20261120 HEAD)" = 7698921604ca37a17645c91ceea62b2eb1993443
          git diff --name-status origin/p40-16bu-no-snapshot-url-handoff-20261120...HEAD >/tmp/p40bv-only
          cat /tmp/p40bv-only
          test "$(wc -l </tmp/p40bv-only)" -eq 2
          if grep -Ev '^A[[:space:]]+(\.p40-16bv-tests/real_chrome_fake\.cjs|\.github/workflows/p40-16bv-real-chrome-fake\.yml)$' /tmp/p40bv-only; then
            echo 'STOP unexpected change';exit 1
          fi
          git diff --exit-code origin/p40-16bu-no-snapshot-url-handoff-20261120 -- assets/js/erp-store.js assets/js/cloud-sync.js assets/js/billing-groups.js assets/js/external-billing-print.js assets/js/auth-gate.js billing-print.html index.html .github/workflows/pages.yml
          node --check .p40-16bv-tests/real_chrome_fake.cjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Retain existing fake VM source-to-projection gate
        shell: bash
        run: |
          set -euo pipefail
          node --test .p40-16bu-tests/test_one_time_handoff.cjs | tee /tmp/p40bu-existing
          grep -q '# pass 14' /tmp/p40bu-existing
          grep -q '# fail 0' /tmp/p40bu-existing
          grep -q '# skipped 0' /tmp/p40bu-existing
      - name: Install Chinese fonts, PDF tools, and ephemeral playwright-core
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq poppler-utils fonts-noto-cjk fontconfig
          sudo fc-cache -f >/dev/null
          fc-match 'Noto Sans CJK TC'
          command -v google-chrome || command -v google-chrome-stable
          command -v pdfinfo
          command -v pdftotext
          mkdir -p /tmp/p40bv
          npm install --prefix /tmp/p40bv --no-audit --no-fund --silent playwright-core@1.56.0
      - name: REAL Chromium desktop 1280 and mobile 390 fake two-tab print
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then export CHROME_BIN="$(command -v google-chrome)";else export CHROME_BIN="$(command -v google-chrome-stable)";fi
          node .p40-16bv-tests/real_chrome_fake.cjs
          test -s p40bv-artifacts/FAKE_desktop_A4.pdf
          test -s p40bv-artifacts/FAKE_mobile390_A4.pdf
          test -s p40bv-artifacts/FAKE_desktop_preview.png
          test -s p40bv-artifacts/FAKE_mobile390_preview.png
          node -e "const r=require('./p40bv-artifacts/RESULT.json');if(r.production_release!=='BLOCKED'||r.cases?.length!==2||!r.cases.every(x=>x.pages===1&&x.has_real_browser_popup)||!r.negative_cases.reject_old_snapshot_url||!r.negative_cases.reject_missing_ticket)process.exit(1)"
          echo 'P40-16BV FAKE TWO-TAB CHROMIUM PASS - REAL COMPANY OR DEVICES STILL UNVERIFIED'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: p40bv-fake-real-Chrome-two-tab-original-A4
          path: p40bv-artifacts/
          if-no-files-found: error
          retention-days: 7
