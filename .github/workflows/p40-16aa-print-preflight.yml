name: P40-16AA print preflight UI and fail-closed gate lab (NO PRODUCTION)
on:
  push:
    branches: [p40-16aa-print-preflight-isolated-20261117]
    paths:
      - '.p40-16aa-tests/**'
      - '.github/workflows/p40-16aa-print-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gate-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP if main beta or production app differs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16aa-print-preflight-isolated-20261117
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40aa-files
          cat /tmp/p40aa-files
          test -s /tmp/p40aa-files
          if grep -Ev '^(\.p40-16(t|u|v|w|x|y|z|aa)-tests/|\.github/workflows/p40-16(t-real-customer-pdf|u-dense-pdf|v-layout-feasibility|w-pdf-readability|x-two-column-a4|y-footer-a4|z-chinese-a4|aa-print-preflight)\.yml$)' /tmp/p40aa-files; then
            echo 'STOP production modification detected'; exit 1
          fi
          for f in index.html billing-print.html external-billing-print.html assets/js/external-billing-print.js assets/js/external-billing-invoice.js assets/js/erp-store.js assets/js/cloud-sync.js; do
            test "$(git rev-parse "origin/main:$f")" = "$(git rev-parse "HEAD:$f")"
          done
          test ! -f .env
          echo 'PASS: main beta and production source intact'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install temporary Chromium PDF validator and Chinese fonts
        run: |
          python -m pip install 'playwright==1.56.0' 'pymupdf==1.26.5'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Compile and execute synthetic browser-side print UI interception proof
        run: |
          python -m py_compile .p40-16aa-tests/test_print_preflight_ui.py
          python .p40-16aa-tests/test_print_preflight_ui.py
      - name: Upload only synthetic prints and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p40-16aa-preflight-ui-prototype
          path: .p40-16aa-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
