name: P41 K30 allowance posting candidate

on:
  push:
    branches: [p41-k30-allowance-posting-20261128]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p41-k30-allowance-posting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-guard:
    name: Disposable PostgreSQL allowance and legacy-client guard
    if: github.ref == 'refs/heads/p41-k30-allowance-posting-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: k30_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: SYN-K30-DISPOSABLE-ONLY
        ports: ['15430:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d k30_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONUTF8: '1'
      K30_POSTGRES_URL: postgresql://postgres:SYN-K30-DISPOSABLE-ONLY@127.0.0.1:15430/k30_synthetic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned disposable database driver
        run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Verify actual trigger RLS rollback and concurrent CAS
        run: python .p41-k30-tests/postgres_guard.py --output artifacts/p41-k30-postgres
      - name: Verify commission agreements and finalization protection
        run: python .p41-k30-tests/k30_policy_postgres_guard.py --output artifacts/p41-k30-postgres/policy
      - name: Retain exact PostgreSQL results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k30-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p41-k30-postgres/
          if-no-files-found: error
          retention-days: 14

  candidate-acceptance:
    name: Synthetic finance sync receivables and PDF on ${{ matrix.platform }}
    if: github.ref == 'refs/heads/p41-k30-allowance-posting-20261128'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      ARTIFACT_DIR: artifacts/p41-k30-${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify reviewed scope and syntax
        run: |
          set -euo pipefail
          python .p41-k30-tests/source_guard.py --output "$ARTIFACT_DIR/source"
          for source in assets/js/erp-store.js assets/js/cloud-sync.js assets/js/commission-agreement-ui.js assets/js/commissions.js assets/js/daily-draft-review.js assets/js/payroll.js assets/js/billing.js assets/js/billing-allowance-ui.js assets/js/billing-groups.js assets/js/dashboard.js assets/js/reports.js assets/js/projects.js assets/js/invoices.js assets/js/receivable-cheques.js assets/js/external-billing-invoice-ui.js .p41-k30-tests/*.cjs; do node --check "$source"; done
          python -m compileall -q .p41-k30-tests
      - name: Prepare pinned synthetic browser and PDF dependencies
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0 pypdf==5.9.0 Pillow==11.3.0
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'.p41-k28-tests')
          from k28_browser_store import select_browser
          executable=select_browser()
          if not executable:subprocess.check_call([sys.executable,'-m','playwright','install','chromium'])
          result={'systemExecutable':executable,'managedBrowserInstalled':not bool(executable)}
          (Path(os.environ['ARTIFACT_DIR'])/'BROWSER_SELECTION.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result))
          PY
      - name: Prepare readable Chinese PDF and UI fonts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Reproduce defects and verify candidate with real isolated browsers
        run: python .p41-k30-tests/run_acceptance.py --group candidate --output "$ARTIFACT_DIR"
      - name: Retain complete results without rendered QA images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k30-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/p41-k30-${{ matrix.platform }}/
            !artifacts/p41-k30-${{ matrix.platform }}/**/internal-qa/**
            !artifacts/p41-k30-${{ matrix.platform }}/**/*.png
            !artifacts/p41-k30-${{ matrix.platform }}/**/*.pdf
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic screenshots and PDFs for visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k30-internal-qa-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/p41-k30-${{ matrix.platform }}/**/internal-qa/
            artifacts/p41-k30-${{ matrix.platform }}/**/*.png
            artifacts/p41-k30-${{ matrix.platform }}/**/*.pdf
          if-no-files-found: ignore
          retention-days: 3

  unchanged-regressions:
    name: Existing finance recovery auth and quote regressions
    if: github.ref == 'refs/heads/p41-k30-allowance-posting-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      P39_INV_USE_SYSTEM_CHROME: '1'
      ARTIFACT_DIR: artifacts/p41-k30-legacy
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original suites and prepare Chrome and PDF reader
        run: |
          set -euo pipefail
          python .p41-k30-tests/source_guard.py --output "$ARTIFACT_DIR/source"
          command -v google-chrome || command -v google-chrome-stable
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Run original assertions against the exact candidate
        run: python .p41-k30-tests/run_acceptance.py --group legacy --output "$ARTIFACT_DIR"
      - name: Retain every regression outcome without QA images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k30-legacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/p41-k30-legacy/
            !artifacts/p41-k30-legacy/**/internal-qa/**
            !artifacts/p41-k30-legacy/**/*.png
            !artifacts/p41-k30-legacy/**/*.pdf
          if-no-files-found: error
          retention-days: 14
      - name: Retain original synthetic quote PDF and review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p41-k30-internal-qa-legacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/p41-k30-legacy/**/*.png
            artifacts/p41-k30-legacy/**/*.pdf
          if-no-files-found: ignore
          retention-days: 3
