name: P33-1 commission rule gate
on:
  push:
    branches: [p33-1-commission-base-20261102]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check assets/js/erp-store.js
          node --check assets/js/commissions.js
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Start isolated server
        run: python -m http.server 8766 --bind 127.0.0.1 >/tmp/p33-1-http.log 2>&1 &
      - name: Commission business-rule regression
        run: python .p33-1-tests/test.py
