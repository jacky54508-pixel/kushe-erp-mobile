name: P37-19C formal-shaped reader review gate
on:
  push:
    branches:
      - p37-19c-formal-reader-review-20261105
    paths:
      - 'assets/js/erp-store.js'
      - 'assets/js/p37-billing-formal-readonly-projection.js'
      - 'index.html'
      - 'p37-lab/p37-19c-formal-readonly.test.cjs'
      - '.github/workflows/p37-19c-reader-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JavaScript syntax verification
        run: |
          node --check assets/js/erp-store.js
          node --check assets/js/p37-billing-effective-ledger.js
          node --check assets/js/p37-billing-formal-readonly-projection.js
          node --check p37-lab/p37-19c-formal-readonly.test.cjs
      - name: P37-19A synthetic transaction regression
        run: node --test p37-lab/p37-19-isolated-transaction.test.cjs
      - name: P37-19B synthetic consumer regression
        run: node --test p37-lab/p37-19b-consumer-projection.test.cjs
      - name: P37-19C formal-shaped pure reader regression
        run: node --test p37-lab/p37-19c-formal-readonly.test.cjs
