name: P32-3 real Auth service in an empty isolated laboratory
on:
  push:
    branches: [p32-3-auth-service-isolation-20261102]
permissions:
  contents: read
jobs:
  auth-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact test source and no application changes
        shell: bash
        run: |
          set -euo pipefail
          echo '2ec7ad86e01cb24b5fec78cbef10747c88384fbe314c50e9f97d3200356522dc  .p32-3-isolation/tests/auth-service.py' | sha256sum -c -
          echo '9fd428faa78e6d73a5fbf7d2aa919c36f4304ab8b9b4ae5f5b179b142695f221  .p32-3-isolation/tests/launch.py' | sha256sum -c -
          git diff --exit-code 84fc3a5867595b93fabcee87633a416019c0f572 HEAD -- assets index.html '*print*' enterprise tools
          python -m py_compile .p32-3-isolation/tests/auth-service.py .p32-3-isolation/tests/launch.py
      - name: Install pinned public laboratory dependencies
        run: |
          python -m pip install playwright==1.57.0 PyJWT==2.10.1
          python -m playwright install --with-deps chromium
      - name: Real Auth plus fresh empty database; no company services
        run: python .p32-3-isolation/tests/launch.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p32-3-real-auth-isolated-evidence
          path: .p32-3-isolation/evidence/
          retention-days: 7
