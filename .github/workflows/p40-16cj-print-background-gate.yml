name: P40-16CJ Native browser PDF background colors (FAKE, NO DEPLOY)
on:
  push:
    branches: [p40-16cj-print-background-color-isolated-20261121]
    paths:
      - 'assets/css/p40-16cd-mint-quotation-billing.css'
      - '.p40-16cj-tests/**'
      - '.p40-16cd-tests/**'
      - '.p40-16ce-tests/**'
      - '.p40-16cb-tests/**'
      - '.p40-16cj-review/**'
      - '.github/workflows/p40-16cj-print-background-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-print-color-fake-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on protected main and exact print-CSS only application change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16cj-print-background-color-isolated-20261121
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 7803b2186160a86ce3c6e972ba2f441006f557e5
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = 7803b2186160a86ce3c6e972ba2f441006f557e5
          git diff --name-status origin/main...HEAD | tee /tmp/p40cj-diff
          node <<'NODE'
          const fs=require('node:fs'), assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const required=[
            'M\tassets/css/p40-16cd-mint-quotation-billing.css',
            'A\t.p40-16cj-tests/native_print_background.cjs',
            'A\t.p40-16cd-tests/real_mint_quote_and_billing.cjs',
            'A\t.p40-16ce-tests/real_dense_pagination.cjs',
            'A\t.p40-16cb-tests/test_one_time_handoff.cjs',
            'A\t.p40-16cj-review/README.md',
            'A\t.p40-16cj-review/decision.json',
            'A\t.github/workflows/p40-16cj-print-background-gate.yml'
          ].sort();
          assert.deepEqual(fs.readFileSync('/tmp/p40cj-diff','utf8').trim().split('\n').sort(),required,'STOP: unexpected application file change');
          const orig=execFileSync('git',['show','origin/main:assets/css/p40-16cd-mint-quotation-billing.css'],{encoding:'utf8'}).trimEnd();
          const current=fs.readFileSync('assets/css/p40-16cd-mint-quotation-billing.css','utf8');
          assert.ok(current.startsWith(orig+'\n'),'STOP: approved mint design overwritten');
          const added=current.slice(orig.length);
          assert.match(added,/P40-16CJ/);
          assert.match(added,/@media print/);
          assert.match(added,/-webkit-print-color-adjust:\s*exact\s*!important/);
          assert.match(added,/print-color-adjust:\s*exact\s*!important/);
          assert.doesNotMatch(added,/@import|url\(|script|localStorage|indexedDB|fetch\(/i);
          const d=require('./.p40-16cj-review/decision.json');
          assert.equal(d.production_release,'BLOCKED');
          assert.equal(d.formal_merge_authorized_for_new_patch,false);
          assert.equal(d.finance_data_or_amount_changed,false);
          assert.equal(d.real_backup_committed,false);
          NODE
          git diff --exit-code origin/main -- billing-print.html assets/js enterprise/index.html index.html .github/workflows/pages.yml
          test ! -e 'KusheERP_safe_backup_20261121_000502.json'
          echo 'PASS print-only CSS no data or app modifications'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Original one-time print/privacy tests (14)
        shell: bash
        run: |
          set -euo pipefail
          node --check .p40-16cj-tests/native_print_background.cjs
          node --check .p40-16cd-tests/real_mint_quote_and_billing.cjs
          node --check .p40-16ce-tests/real_dense_pagination.cjs
          node --test .p40-16cb-tests/test_one_time_handoff.cjs | tee /tmp/p40cj-safe
          grep -Eq '^# pass 14$' /tmp/p40cj-safe
          grep -Eq '^# fail 0$' /tmp/p40cj-safe
      - name: Setup real Chrome, Chinese fonts and PDF analysis
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq poppler-utils fonts-noto-cjk fontconfig
          sudo fc-cache -f >/dev/null
          mkdir -p /tmp/p40bv
          npm install --prefix /tmp/p40bv --no-audit --no-fund --silent playwright-core@1.56.0
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV";else echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV";fi
          command -v pdftoppm
          command -v pdfinfo
          command -v pdftotext
      - name: Real Chrome native Save PDF background OFF and ON, and old economy negative control
        shell: bash
        run: |
          set -euo pipefail
          node .p40-16cj-tests/native_print_background.cjs
          test -s p40cj-artifacts/RESULT.json
          node -e "const d=require('./p40cj-artifacts/RESULT.json');if(d.production_release!=='BLOCKED'||d.cases?.length!==3||!d.cases.every(c=>c.printBackgroundFalseA4&&c.printBackgroundTrueA4&&c.oldBackgroundLossReproduced&&c.printColorAdjustExact))process.exit(1)"
      - name: Prior 8 mint A4 quote/billing/retention scenarios unchanged
        shell: bash
        run: |
          set -euo pipefail
          node .p40-16cd-tests/real_mint_quote_and_billing.cjs
          node -e "const d=require('./p40cd-artifacts/RESULT.json');if(d.production_release!=='BLOCKED'||d.cases?.length!==8||!d.cases.every(c=>c.pages===1&&c.hasLogo&&c.hasSeal))process.exit(1)"
      - name: Prior 6 dense A4 multi-house and long quotation scenarios unchanged
        shell: bash
        run: |
          set -euo pipefail
          node .p40-16ce-tests/real_dense_pagination.cjs
          node -e "const d=require('./p40ce-artifacts/RESULT.json');if(d.production_release!=='BLOCKED'||d.cases?.length!==6||!d.cases.every(x=>x.pages===1&&x.blankPages===0&&x.renderedTotalsUnchanged))process.exit(1)"
          echo 'P40-16CJ PASS fake-only; owner release approval still required'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p40cj-native-save-pdf-background-off-on-fake-evidence
          path: |
            p40cj-artifacts/
            p40cd-artifacts/RESULT.json
            p40ce-artifacts/RESULT.json
          if-no-files-found: warn
          retention-days: 7
