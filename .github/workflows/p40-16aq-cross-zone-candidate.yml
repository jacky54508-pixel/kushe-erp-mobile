name: P40-16AQ cross-zone minimal style candidate - PDF bytes lab ONLY
on:
  push:
    branches: [p40-16aq-cross-zone-print-candidate-20261118]
    paths:
      - 'billing-print.html'
      - '.p40-16aq-tests/**'
      - '.p40-16aq-review/**'
      - '.github/workflows/p40-16aq-cross-zone-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-pdf-source-and-scope-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: STOP if formal main beta moved or ANY unrelated ERP source altered
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = p40-16aq-cross-zone-print-candidate-20261118
          git fetch --no-tags origin main beta
          test "$(git rev-parse origin/main)" = 2ab9c9d5944b1360ba3eebf49695713168caca8a
          test "$(git rev-parse origin/beta)" = 62669539053a15174081ba8670b18248195c6f8c
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only origin/main...HEAD > /tmp/p40aq-changed
          cat /tmp/p40aq-changed
          test -s /tmp/p40aq-changed
          if grep -Ev '^(billing-print\.html|\.p40-16aq-(tests|review)/.+|\.github/workflows/p40-16aq-cross-zone-candidate\.yml)$' /tmp/p40aq-changed; then
            echo 'STOP: unrelated change (data, finance, auth, sync, other PDFs)'; exit 1
          fi
          test "$(git diff --name-only origin/main...HEAD -- assets/js index.html billing-bundle-print.html external-billing-print.html .github/workflows/pages.yml | wc -l)" -eq 0
          for f in index.html billing-bundle-print.html external-billing-print.html assets/js/billing.js assets/js/billing-print.js assets/js/billing-bundle-print.js assets/js/external-billing-print.js assets/js/external-billing-invoice.js assets/js/billing-groups.js assets/js/erp-store.js assets/js/cloud-sync.js assets/js/auth-gate.js assets/js/billing-discount-preview.js assets/js/billing-group-discount-preview.js .github/workflows/pages.yml; do
            test "$(git rev-parse "HEAD:$f")" = "$(git rev-parse "origin/main:$f")"
          done
          test ! -e .env
          test ! -e billing-print-main-baseline-ci.html
          echo 'PASS: original finance/sync/other print routes and pinned main beta untouched'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated Chromium and independent PDF byte inspector
        run: |
          python -m pip install 'playwright==1.56.0' 'pymupdf==1.26.5'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-bsmi00lp
      - name: Real original public route, compared to pinned main PDF bytes
        run: |
          python -m py_compile .p40-16aq-tests/test_cross_zone_candidate_pdf.py
          python .p40-16aq-tests/test_cross_zone_candidate_pdf.py
          echo 'ACTUAL PDF BYTES tested IN CI ONLY; browser native print is still ungated'
      - name: Remove temporary comparison page if test fails
        if: always()
        run: |
          rm -f billing-print-main-baseline-ci.html
          echo 'No actual accounts, seals, bank, invoices or authentic corporate images used'
      - name: Archive ONLY passing synthetic one-page PDFs and manifest
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p40-16aq-synthetic-cross-zone-candidate-proof
          path: .p40-16aq-review/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
