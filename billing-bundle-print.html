<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>酷舍合併請款單</title>
  <style>
    @page{size:A4 portrait;margin:9mm 14mm 12mm}
    *{box-sizing:border-box}
    html,body{margin:0;background:#edf1f4;color:#11213f;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
    @media screen{html,body{width:100%;max-width:100%;min-width:0;overflow-x:hidden}}
    .toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;width:100%;padding:10px;background:#172033;box-shadow:0 2px 10px rgba(17,33,63,.12)}
    .toolbar button{border:0;border-radius:6px;padding:9px 20px;background:#0d8a80;color:#fff;font-weight:700;cursor:pointer}.toolbar .close{background:#566273}
    .paper{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:9mm 14mm 12mm;box-shadow:0 10px 32px rgba(20,39,65,.15)}
    .head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8mm;align-items:center;padding:0 1mm 4mm;border-bottom:.8mm solid #078d82}
    .company-block{display:flex;align-items:center;gap:4.5mm;min-width:0}.company-logo-frame{display:block;width:18mm;height:14mm;overflow:hidden;flex:none}.company-logo{display:none;width:18mm;height:18mm;object-fit:contain}
    .company{min-width:0}.company h1{margin:0;color:#078d82;font-size:20pt;font-weight:900;letter-spacing:1.2pt;line-height:1.05;white-space:nowrap}.company .en{margin-top:1.2mm;color:#33435e;font-size:9pt;white-space:nowrap}.company .sub{display:flex;flex-wrap:wrap;gap:.8mm 2mm;margin-top:1.4mm;color:#53647e;font-size:7.5pt;line-height:1.25}
    .doc-title{text-align:right}.doc-title h2{margin:0;color:#101b48;font-size:21pt;font-weight:900;letter-spacing:4pt}.doc-title p{margin:1.5mm 0 0;color:#078d82;font-size:8.5pt;font-weight:800;white-space:nowrap}
    .info{display:grid;grid-template-columns:1fr 1fr;gap:2mm 3mm;margin:4mm 0;padding:3mm;border:.25mm solid #c7d7e2;border-radius:2.5mm;background:#f4f8f9}
    .info>div{display:flex;align-items:flex-start;min-width:0;min-height:10mm;padding:2mm 2.6mm;border:.2mm solid #d1dce6;border-radius:1.6mm;background:#fff;font-size:9pt;font-weight:700;line-height:1.45;overflow-wrap:anywhere}.label{flex:none;width:20mm;margin-right:2.5mm;color:#52667e;font-size:7.5pt;font-weight:900;letter-spacing:.2pt}
    .project-section{margin-top:5mm;border:.25mm solid #c7d4df;border-radius:2.2mm;overflow:visible;break-inside:avoid;page-break-inside:avoid}.project-heading{display:flex;justify-content:space-between;gap:4mm;align-items:flex-end;padding:2.5mm 3.2mm;background:linear-gradient(90deg,#092d57,#0b4a63 65%,#078d82);color:#fff;break-after:avoid;page-break-after:avoid}.project-heading h2{margin:0;font-size:12pt;line-height:1.25}.project-heading p{margin:1mm 0 0;font-size:7.6pt;line-height:1.35}.project-heading span{font-size:8pt;font-weight:800;white-space:nowrap}
    table{width:100%;border-collapse:collapse;table-layout:fixed}.detail thead{display:table-header-group}.detail tr{break-inside:avoid;page-break-inside:avoid}.detail th,.detail td{padding:1.8mm 1.6mm;border:.2mm solid #c7d4df;font-size:8.3pt;line-height:1.35;vertical-align:middle}.detail th{background:#eef4f7;color:#082e58;text-align:center;font-weight:850}.detail td{background:#fff}.detail td.item{font-weight:750;overflow-wrap:anywhere}.detail .center{text-align:center}.detail .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    .project-footer{display:grid;grid-template-columns:minmax(0,1fr) minmax(66mm,42%);gap:4mm;padding:3mm;background:#f8fafb;break-inside:avoid;page-break-inside:avoid}.project-note{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#52667e;font-size:8pt;line-height:1.5}.project-note b{color:#173d69}.project-summary{margin:0}.project-summary>div{display:grid;grid-template-columns:1fr auto;gap:4mm;padding:1.2mm 0;border-bottom:.2mm solid #d8e1e8;font-size:8.3pt}.project-summary>div:last-child{border-bottom:0}.project-summary dd{margin:0;font-weight:850;font-variant-numeric:tabular-nums}.project-summary .emphasis{color:#087d74;font-weight:900}
    .grand-summary{width:min(100%,105mm);margin:7mm 0 0 auto;border:.35mm solid #93c9c2;border-radius:2.5mm;overflow:hidden;break-inside:avoid;page-break-inside:avoid}.grand-summary h2{margin:0;padding:2.5mm 3.5mm;background:#092d57;color:#fff;font-size:11pt}.grand-summary>div{display:grid;grid-template-columns:1fr auto;align-items:center;min-height:8.5mm;padding:1.8mm 3.5mm;border-bottom:.2mm solid #d8e1e8;font-size:9pt}.grand-summary>div:last-child{border-bottom:0}.grand-summary strong{font-size:10pt;font-variant-numeric:tabular-nums}.grand-summary .total,.grand-summary .receivable{background:#e8f7f4;color:#075f59;font-weight:900}.grand-summary .total strong,.grand-summary .receivable strong{font-size:12pt}
    .sign{display:grid;grid-template-columns:1fr 1fr;gap:16mm;margin-top:9mm;align-items:end;break-inside:avoid;page-break-inside:avoid}.client-sign{width:82%;margin:0 auto;padding-top:11mm;border-top:.25mm solid #33435e;text-align:center;color:#53647e;font-size:9pt}.company-seals{text-align:center;color:#53647e;font-size:9pt}.seal-wrap{height:31mm;display:flex;align-items:center;justify-content:center}.seal{max-width:54mm;max-height:30mm;object-fit:contain}.empty{padding:8mm;text-align:center;color:#69778a}
    @media screen{.paper{position:relative;left:var(--preview-center-left,50%);translate:-50% 0;margin:16px 0}}
    @media screen and (max-width:850px){.paper{zoom:min(1,calc((100vw - 24px)/793.7008px))}}
    @media print{html,body{background:#fff}.toolbar{display:none!important}.paper{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1}.project-section,.project-heading,.project-footer,.grand-summary,.sign{break-inside:avoid;page-break-inside:avoid}}
  </style>
</head>
<body>
  <div class="toolbar"><button type="button" onclick="printDocument()">匯出 PDF／列印</button><button type="button" class="close" onclick="closePrintView()">關閉</button></div>
  <main class="paper" id="paper"></main>
  <script>
    const esc=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const num=(value)=>Number(value)||0;
    const money=(value)=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(num(value));
    const quantity=(value)=>value===null||value===undefined||value===''?'—':new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(num(value));
    const invoiceLabel=(value)=>value==='no_invoice'?'免開發票':value==='invoiced'?'已開發票':value==='invoice_pending'?'待開發票':String(value||'—');
    function closePrintView(){const current=location.href;try{window.close()}catch(error){}setTimeout(()=>{if(window.closed)return;if(history.length>1){try{history.back()}catch(error){}setTimeout(()=>{if(location.href===current)location.replace(new URL('index.html',location.href).href)},400)}else location.replace(new URL('index.html',location.href).href)},100)}
    function removeSealBackground(image){const canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;const context=canvas.getContext('2d');context.drawImage(image,0,0);const pixels=context.getImageData(0,0,canvas.width,canvas.height);for(let index=0;index<pixels.data.length;index+=4){if(pixels.data[index]>235&&pixels.data[index+1]>235&&pixels.data[index+2]>235){pixels.data[index]=255;pixels.data[index+1]=255;pixels.data[index+2]=255}}context.putImageData(pixels,0,0);image.src=canvas.toDataURL('image/png')}
    function groupedLines(lines){const groups=new Map();(Array.isArray(lines)?lines:[]).forEach((line)=>{const key=JSON.stringify([line.house||'',line.item||'',line.unit||'',line.price??null,line.sourcePricingType||'']);let group=groups.get(key);if(!group){group={...line,qty:0,amount:0};groups.set(key,group)}group.qty+=num(line.qty);group.amount+=num(line.amount)});return [...groups.values()]}
    let data={};try{data=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(1))))))}catch(error){document.getElementById('paper').innerHTML='<p class="empty">無法讀取合併請款資料</p>'}
    const company=data.company||{},billings=Array.isArray(data.billings)?data.billings:[],totals=data.totals||{},companyInfo=[company.taxId&&`統編 ${company.taxId}`,company.address,company.phone,company.line&&`LINE：${company.line}`].filter(Boolean);
    const dateLabel=data.dateStart&&data.dateEnd&&data.dateStart!==data.dateEnd?`${data.dateStart} ～ ${data.dateEnd}`:data.dateStart||data.dateEnd||'—';
    function billingSection(row){const lines=groupedLines(row.lines),hasHouse=lines.some((line)=>String(line.house||'').trim()),columns=hasHouse?6:5;const rows=lines.map((line)=>`<tr>${hasHouse?`<td class="center">${esc(line.house||'—')}</td>`:''}<td class="item">${esc(line.item||'—')}</td><td class="center">${esc(line.unit||'—')}</td><td class="num">${quantity(line.qty)}</td><td class="num">${line.price===null||line.price===undefined?'—':money(line.price)}</td><td class="num">${money(line.amount)}</td></tr>`).join('');return `<section class="project-section"><header class="project-heading"><div><h2>【${esc(row.projectName||'未命名案場')}】</h2><p>來源請款單：${esc(row.number||'—')}　請款日期：${esc(row.date||'—')}</p></div><span>${esc(row.taxMode||'—')}｜${esc(invoiceLabel(row.invoiceStatus))}</span></header><table class="detail"><colgroup>${hasHouse?'<col style="width:10%">':''}<col style="width:${hasHouse?'36':'46'}%"><col style="width:9%"><col style="width:12%"><col style="width:15%"><col style="width:18%"></colgroup><thead><tr>${hasHouse?'<th>戶別</th>':''}<th>施工項目</th><th>單位</th><th>數量</th><th>單價</th><th>金額</th></tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${columns}">無明細資料</td></tr>`}</tbody></table><footer class="project-footer"><p class="project-note">${row.publicNote?`<b>備註：</b><br>${esc(row.publicNote)}`:'本區金額依來源請款單正式數值列示。'}</p><dl class="project-summary"><div><dt>施工／未稅金額</dt><dd>${money(row.salesAmount)}</dd></div><div><dt>稅額</dt><dd>${money(row.taxAmount)}</dd></div><div class="emphasis"><dt>請款總額</dt><dd>${money(row.totalAmount)}</dd></div><div><dt>保留款</dt><dd>${money(row.retentionAmount)}</dd></div><div class="emphasis"><dt>本期應收</dt><dd>${money(row.receivableAmount)}</dd></div></dl></footer></section>`}
    const paper=document.getElementById('paper');if(data.schema==='kushe-combined-billing-v1'){paper.innerHTML=`<header class="head"><div class="company-block"><span class="company-logo-frame"><img class="company-logo" id="formalCompanyLogo" alt="酷舍企業" onerror="this.hidden=true"></span><div class="company"><h1>${esc(company.name||'酷舍企業有限公司')}</h1><div class="en">${esc(company.englishName||'Cool Sir Limited Company')}</div><div class="sub">${companyInfo.map((value)=>`<span>${esc(value)}</span>`).join('')}</div></div></div><div class="doc-title"><h2>請款單</h2><p>多案場合併請款明細</p></div></header><section class="info"><div><span class="label">客戶</span>${esc(data.customer||'—')}</div><div><span class="label">請款日期</span>${esc(dateLabel)}</div><div><span class="label">案場</span>${(data.projects||[]).length} 個案場</div><div><span class="label">來源請款</span>${billings.length} 張</div><div><span class="label">來源單號</span>${billings.map((row)=>esc(row.number||'—')).join('、')}</div><div><span class="label">稅務／發票</span>${esc(data.taxMode||'—')}｜${esc(data.invoiceDisplay||data.invoiceStatus||'—')}</div></section>${billings.map(billingSection).join('')}<section class="grand-summary"><h2>合併請款總計</h2><div><span>施工／未稅合計</span><strong>${money(totals.salesAmount)}</strong></div><div><span>稅額合計</span><strong>${money(totals.taxAmount)}</strong></div><div class="total"><span>請款總額</span><strong>${money(totals.totalAmount)}</strong></div><div><span>保留款合計</span><strong>${money(totals.retentionAmount)}</strong></div><div class="receivable"><span>本期應收合計</span><strong>${money(totals.receivableAmount)}</strong></div></section><section class="sign"><div class="client-sign">客戶簽章</div><div class="company-seals"><div>公司大小章</div><div class="seal-wrap"><img class="seal" id="formalCompanySeal" alt="公司大小章" onerror="this.hidden=true"></div></div></section>`;document.title=data.fileName||'酷舍_合併請款單.pdf'}
    function centerPaperInViewport(){const zoom=Number.parseFloat(getComputedStyle(paper).zoom)||1,viewportWidth=document.documentElement.clientWidth;paper.style.setProperty('--preview-center-left',`${viewportWidth/(2*zoom)}px`)}
    if(window.matchMedia('screen').matches){centerPaperInViewport();window.addEventListener('resize',()=>requestAnimationFrame(centerPaperInViewport),{passive:true})}
    async function loadAssets(){const enterpriseUrl=/\/beta(?:\/|$)/.test(location.pathname)?'../enterprise/index.html':'./enterprise/index.html';try{const source=await fetch(enterpriseUrl).then((response)=>response.text());for(const [name,id] of [['companyLogoAsset','formalCompanyLogo'],['companySealAsset','formalCompanySeal']]){const start=source.indexOf(`const ${name}=`);if(start<0)continue;let end=source.indexOf(';\n',start);if(end<0)end=source.indexOf(';\r',start);const parts=[...source.slice(start,end).matchAll(/'([^']*)'/g)].map((match)=>match[1]);if(parts.length){const image=document.getElementById(id);if(!image)continue;if(id==='formalCompanySeal')image.onload=()=>{image.onload=null;removeSealBackground(image)};image.src=parts.join('');if(id==='formalCompanyLogo')image.style.display='block'}}}catch(error){}}
    const autoPrint=new URLSearchParams(location.search).get('print')==='1';function printDocument(){window.print()}loadAssets().finally(()=>{window.__billingBundlePrintReady=true;if(autoPrint)setTimeout(()=>window.print(),250)});
  </script>
</body>
</html>
