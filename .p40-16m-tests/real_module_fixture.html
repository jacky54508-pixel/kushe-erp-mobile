<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>P40-16M isolated exact ERP modules</title></head>
<body>
<h1>P40-16M｜正式模組原始碼隔離測試</h1>
<div id="appShell" inert></div>
<div id="cloudSyncState"></div><div id="cloudSyncMessage"></div><div id="cloudSyncAutoState"></div>
<script>
// No config.js, no production identity, no real Supabase URL.
// The test runner denies any outgoing request outside localhost and p40m.invalid.
window.KUSHE_PHASE1_CONFIG=Object.freeze({
 supabaseUrl:'https://p40m.invalid',supabasePublishableKey:'P40M_SYNTHETIC_PUBLISHABLE_CI_ONLY'
});
let syntheticUser='SYNTHETIC-PRINCIPAL-ONLY';
window.P40M_SESSION={
 setPrincipal(x){syntheticUser=String(x)},
 getPrincipal(){return syntheticUser}
};
window.KusheAuthGate=Object.freeze({
 user:()=>({id:syntheticUser,email:'synthetic@unit.invalid'}),
 session:()=>({access_token:'SYNTHETIC_JWT_NOT_REAL'}),
 requireAuth:async()=>Boolean(syntheticUser),
 requireMfa:async()=>Boolean(syntheticUser),
 mfaStatus:()=>({aal:'aal2'})
});
window.KuSheLegacyData=Object.freeze({getState:()=>({}),refresh:async()=>{}});
window.confirm=()=>false;
</script>
<!-- Exact production main files by URL, never transformed or copied into this fixture. -->
<script src="/assets/js/erp-store.js"></script>
<script src="/assets/js/cloud-sync.js"></script>
<script>
window.P40M=Object.freeze({
 async load(){return window.KuSheERPStore.load()},
 async saveFakeCustomer(name){return window.KuSheERPStore.saveCustomer({name})},
 async local(){return window.KuSheERPStore.readCommittedSnapshot()},
 async readiness(){return window.KuSheERPStore.remoteApplyReadiness()},
 async inspect(){return window.KusheCloudSync.inspect()},
 async upload(){return window.KusheCloudSync.uploadLocal()},
 getState(){return window.KuSheERPStore.getState()},
 getDiag(){return window.KuSheERPStore.storeTransactionDiagnostic?.()},
 setTrust(){
   const userId=window.P40M_SESSION.getPrincipal();
   localStorage.setItem('kushe_erp_device_trust_v1',JSON.stringify({
     schema:'kushe-device-trust-v1',version:1,mode:'trusted',
     userId,updatedAt:new Date().toISOString()
   }));
 },
 corruptMirror(){localStorage.setItem('KuSheERP25_EMERGENCY','{"corrupted":true}')},
 corruptJournal(){
  return new Promise((resolve,reject)=>{
   const open=indexedDB.open('KuSheERP25_Core34_DB',1);
   open.onsuccess=()=>{
    const db=open.result,t=db.transaction('erp','readwrite');
    t.objectStore('erp').put({schema:'invalid',operationId:'SYNTH-BROKEN',phase:'PRIMARY_WRITTEN'},
     'store:transaction:journal:v1');
    t.oncomplete=()=>{db.close();resolve(true)};
    t.onabort=()=>reject(t.error);
   };open.onerror=()=>reject(open.error);
  });
 },
 async rawState(){
  return new Promise((resolve,reject)=>{
   const q=indexedDB.open('KuSheERP25_Core34_DB',1);
   q.onsuccess=()=>{
    const db=q.result,t=db.transaction('erp','readonly'),s=t.objectStore('erp');
    const a=s.get('main'),b=s.get('store:transaction:journal:v1');let state,journal;
    a.onsuccess=()=>{state=a.result};b.onsuccess=()=>{journal=b.result};
    t.oncomplete=()=>{db.close();resolve({state:state??null,journal:journal??null})};
    t.onabort=()=>reject(t.error);
   };q.onerror=()=>reject(q.error);
  });
 }
});
</script>
</body></html>
