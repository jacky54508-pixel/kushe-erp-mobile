<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>酷舍案場抽成結算單</title>
<style>
@page{size:A4 portrait;margin:0}*{box-sizing:border-box}
html,body{margin:0;background:#edf1f4;color:#17243b;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:10px;background:#172033}
.toolbar button{border:0;border-radius:6px;padding:9px 20px;background:#0b887e;color:#fff;font-weight:800;cursor:pointer}.toolbar .secondary{background:#31536f}.toolbar .close{background:#596677}
.stage{width:100%;display:flex;justify-content:center;padding:16px 12px 24px}.paper{width:min(210mm,calc(100vw - 24px));min-height:297mm;padding:10mm 13mm 9mm;background:#fff;box-shadow:0 10px 32px rgba(20,39,65,.15)}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10mm;align-items:start;padding-bottom:4.5mm;border-bottom:1mm solid #078d82}
.company{min-width:0}.company h1{margin:0;color:#078d82;font-size:22pt;font-weight:900;letter-spacing:1.7pt;line-height:1.05;white-space:nowrap}.company .en{margin-top:2mm;color:#33435e;font-size:10pt}.company .sub{margin-top:1.8mm;color:#53647e;font-size:8pt}
.doc-title{text-align:right}.doc-title h2{margin:0;color:#101b48;font-size:20pt;font-weight:900;letter-spacing:2.5pt;white-space:nowrap}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm 4mm;margin:4mm 0 3mm;padding:2.5mm;background:#f1f8f8;border:.25mm solid #b8d5df;border-radius:2.5mm}
.info div{min-height:9mm;padding:2mm 3mm;background:#fff;border:.25mm solid #cad9e6;border-radius:1.8mm;font-size:9pt}.label{display:block;margin-bottom:1mm;color:#52647c;font-size:8pt;font-weight:800}
.section{margin-top:3mm;border:.25mm solid #b8ccdf;border-radius:2.2mm;overflow:hidden}.section-title{padding:2mm 3mm;background:#0b4264;color:#fff;font-size:9.5pt;font-weight:900}
table{width:100%;border-collapse:collapse;table-layout:fixed}thead{display:table-header-group}tr{break-inside:avoid}th,td{border:.2mm solid #c5d4e2;padding:2mm 1.6mm;font-size:8.5pt;line-height:1.3}th{background:#eef6f7;color:#123b5a}.num{text-align:right;white-space:nowrap}.center{text-align:center}.empty{text-align:center;color:#738094;padding:6mm}
.summary{margin-top:4mm;padding:4mm 5mm;border:.25mm solid #9bcfc8;border-radius:2.2mm;background:#e9f8f5;display:flex;align-items:center;justify-content:space-between}.summary span{color:#52647c;font-size:10pt;font-weight:800}.summary strong{color:#087d74;font-size:18pt}
.note{margin-top:4mm;padding:3mm 4mm;border:.25mm solid #d8e1eb;border-radius:2mm;font-size:9pt}.signature{margin-top:12mm;font-size:10pt;font-weight:700}.signature-line{display:inline-block;width:55mm;margin-left:3mm;border-bottom:.25mm solid #34445b}
@media print{html,body{background:#fff}.toolbar{display:none!important}.stage{display:block;padding:0}.paper{width:210mm;min-height:297mm;margin:0;box-shadow:none}}
@media screen and (max-width:850px){.toolbar{flex-wrap:wrap}.paper{min-height:0;padding:18px 12px}.head{gap:3mm}.company h1{font-size:13pt}.company .en{font-size:7pt}.company .sub{font-size:6pt}.doc-title h2{font-size:13pt;letter-spacing:1pt}.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="toolbar"><button id="exportPdf">匯出 PDF</button><button class="secondary" id="printDoc">列印</button><button class="close" id="closeDoc">關閉</button></div>
<div class="stage"><main class="paper" id="paper"></main></div>
<script>
const esc=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const num=(value)=>{const n=Number(value);return Number.isFinite(n)?n:0};const money=(value)=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(num(value));const display=(value)=>String(value??'').trim()||'—';
let data={};try{data=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(1))))))}catch(error){document.getElementById('paper').innerHTML='<p class="empty">結算單資料無法讀取</p>'}
const rows=Array.isArray(data.allocations)?data.allocations:[];
const body=rows.map((row)=>`<tr><td class="center">${esc(display(row.date))}</td><td>${esc(display(row.house))}</td><td class="num">${money(row.untaxedAmount)}</td><td class="num"><b>${money(row.amount)}</b></td></tr>`).join('');
document.title=data.fileName||'酷舍_案場抽成結算單.pdf';
document.getElementById('paper').innerHTML=`<header class="head"><div class="company"><h1>${esc(data.companyName||'酷舍企業有限公司')}</h1><div class="en">Cool Sir Limited Company</div><div class="sub">統編 82980636｜台中市豐原區瑞興路 62 號｜LINE：eing0519</div></div><div class="doc-title"><h2>${esc(data.title||'案場抽成結算單')}</h2></div></header><section class="info"><div><span class="label">員工姓名</span>${esc(display(data.employeeName))}</div><div><span class="label">案場</span>${esc(display(data.projectName))}</div><div><span class="label">結算日期</span>${esc(display(data.settlementDate))}</div><div><span class="label">付款銀行</span>${esc(display(data.bankName))}</div><div><span class="label">付款方式</span>${esc(display(data.paymentMethod))}</div><div><span class="label">產生日期</span>${esc(display(data.generatedDate))}</div></section><section class="section"><div class="section-title">結算明細</div><table><colgroup><col style="width:22%"><col style="width:26%"><col style="width:26%"><col style="width:26%"></colgroup><thead><tr><th>施工／業績日期</th><th>戶別</th><th>未稅業績</th><th>抽成金額</th></tr></thead><tbody>${body||'<tr><td class="empty" colspan="4">沒有可顯示的結算明細</td></tr>'}</tbody></table></section><section class="summary"><span>本次結算總額</span><strong>${money(data.total)}</strong></section>${data.note?`<section class="note"><b>備註：</b>${esc(data.note)}</section>`:''}<section class="signature">員工簽名：<span class="signature-line"></span></section>`;
const printNow=()=>window.print();document.getElementById('exportPdf').onclick=printNow;document.getElementById('printDoc').onclick=printNow;document.getElementById('closeDoc').onclick=()=>{try{window.close()}catch(error){}setTimeout(()=>{if(!window.closed)location.replace(new URL('index.html#commissions',location.href).href)},100)};
window.__commissionSettlementPrintData=data;window.__commissionSettlementPrintReady=true;if(new URLSearchParams(location.search).get('print')==='1')setTimeout(printNow,250);
</script>
</body>
</html>
