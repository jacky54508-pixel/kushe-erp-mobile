<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P40-16B isolated fictional concession allocation UI</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{font:15px/1.5 system-ui,"Noto Sans TC",sans-serif;background:#edf3f8;color:#1d3c51;padding:24px;max-width:1050px;margin:auto}
h1{font-size:20px}.p4016-card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 18px #18334c12}
.p4016-header{display:flex;justify-content:space-between;align-items:center;gap:15px}.p4016-header h2{font-size:22px;margin:0}
.p4016-disclaimer,.p4016-locked{padding:12px;border-radius:8px;background:#fff6e5;color:#75470b}.p4016-total{font-weight:700;padding:12px 0}
.p4016-meta,.p4016-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{font-size:13px;font-weight:650;display:flex;flex-direction:column;gap:5px}
input,textarea{font:inherit;width:100%;min-width:0;min-height:40px;border:1px solid #9ab2c4;border-radius:7px;padding:8px;color:#17394f}
textarea{resize:vertical;min-height:60px}.p4016-hint{color:#5b7181;font-size:13px}
.p4016-source{border:1px solid #d4e2ee;border-radius:10px;margin:15px 0;padding:14px}
legend{font-weight:700}.p4016-source p{font-size:13px;color:#587083}
button{font:inherit;border-radius:8px;padding:10px 14px;cursor:pointer;border:1px solid #adc2d6;background:#fff}
.p4016-primary{background:#105db2;color:white;border:0}.p4016-result{margin-top:18px;padding:10px;border-top:1px solid #d5dfe5}
.p4016-warnings{background:#fff8ec;padding:16px 16px 16px 34px;border-radius:8px}
.p4016-error{color:#a12820;font-weight:700}
@media(max-width:650px){body{padding:8px}.p4016-card{padding:13px}.p4016-meta,.p4016-grid{grid-template-columns:minmax(0,1fr)}.p4016-header h2{font-size:18px}}
</style></head><body>
<h1>P40-16B｜隔離審核測試（全虛構、不連接正式 ERP）</h1>
<main id="reviewHost"></main>
<script src="/assets/js/p40-16a-concession-review.js"></script>
<script src="/assets/js/p40-16b-concession-allocation-ui.js"></script>
<script>
'use strict';
const amounts=(untaxed,tax)=>({untaxed,tax,grossTotal:untaxed+tax,retention:0,receivable:untaxed+tax});
const model={
  scope:'merged',documentId:'SYNTHETIC-MERGED',documentRevision:1,documentStatus:'active',
  sourceIds:['SYNTH-A','SYNTH-B'],
  originalTotals:amounts(602000,30100),approvedGross:600000,
  expectedSnapshot:'synthetic-source-v1',observedSnapshot:'synthetic-source-v1',
  existingAdjustments:[],issues:[],termsChanged:false,settlementChanged:false,
  sources:[
    {billingId:'SYNTH-A',receivableId:'SYNTH-AR-A',amounts:amounts(524000,26200),
      settlement:{received:0,retentionReceived:0,pendingCheque:0},
      invoice:{status:'invoice_pending',number:''}},
    {billingId:'SYNTH-B',receivableId:'SYNTH-AR-B',amounts:amounts(78000,3900),
      settlement:{received:0,retentionReceived:0,pendingCheque:0},
      invoice:{status:'invoiced',number:'FAKE-TEST-INVOICE'}}
  ]
};
window.__p4016sandbox={model,before:JSON.stringify(model),writes:0};
const outcome=window.KusheP4016AllocationUi.open({
 host:document.getElementById('reviewHost'),
 model,review:window.KusheP4016ConcessionReview
});
window.__p4016sandbox.outcome=outcome;
</script></body></html>
