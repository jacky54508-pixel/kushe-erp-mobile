<style>

#loginView{min-height:100vh;display:grid;place-items:center;background:

 .mobile-menu-toggle{display:none}@media(max-width:700px){#appView{display:block}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:64px;display:flex;overflow:auto;padding:6px;z-index:15}.side-brand{display:none}.nav-btn{min-width:72px;margin:0}.main{padding-bottom:70px}.topbar{padding:0 12px}.content{padding:12px}.cards,.grid-2,.grid-3,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.metric .value{font-size:22px}.mobile-menu-toggle{display:flex;align-items:center;justify-content:center;position:fixed;right:14px;bottom:78px;z-index:20;border:0;border-radius:999px;background:#0b2e69;color:#fff;padding:12px 16px;font-size:15px;font-weight:800;box-shadow:0 8px 20px rgba(7,29,66,.32)}.sidebar.mobile-open{top:0;bottom:0;height:100vh;display:block;padding:20px 14px;overflow:auto}.sidebar.mobile-open .side-brand{display:flex}.sidebar.mobile-open #nav{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:16px}.sidebar.mobile-open .nav-btn{min-width:0;margin:0;text-align:left;padding:13px 12px;background:rgba(255,255,255,.08)}.sidebar.mobile-open .nav-btn span{display:inline}.sidebar.mobile-open~.mobile-menu-toggle{bottom:16px;background:#d64747}}

.owner-two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.owner-table{width:100%;border-collapse:collapse}.owner-table th,.owner-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.owner-table th{background:#f8faff;color:#526078;font-size:13px}.owner-table td.num{text-align:right;font-variant-numeric:tabular-nums}.owner-table tr[data-go]{cursor:pointer}.owner-table tr[data-go]:hover td{background:#eef6ff}.profit-pos{color:#0b7b73;font-weight:900}.profit-neg{color:#c0392b;font-weight:900}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#0b7b73,#0b2e69)}

/* 手機／iPhone 專用的可點選下拉：不依賴 Safari 原生 datalist。 */

function receivableTaxValues(taxMode,inputAmount){
 const rate=num(state.settings.defaultTax)||5,input=Math.max(0,num(inputAmount));
 if(taxMode==="含稅"){
  const untaxed=Math.round(input/(1+rate/100)),tax=input-untaxed;
  return {untaxed,tax,total:input};
 }
 const untaxed=input,tax=Math.round(untaxed*rate/100);
 return {untaxed,tax,total:untaxed+tax};
}
function syncReceivablePayment(ar){
 const txs=state.bankTransactions||[];
 const oldTx=txs.find(x=>x.sourceType==="receivable"&&x.sourceId===ar.id);
 if(oldTx){
  const oldBank=(state.banks||[]).find(x=>x.id===oldTx.bankId);
  if(oldBank){oldBank.income=Math.max(0,num(oldBank.income)-num(oldTx.amount));recalcBankBalance(oldBank)}
  state.bankTransactions=txs.filter(x=>x.id!==oldTx.id);
 }
 ar.paymentTransactionId="";
 if(num(ar.received)<=0)return;
 const bank=(state.banks||[]).find(x=>x.id===ar.bankId);
 if(!bank)throw new Error("請選擇收款銀行帳戶");
 const amount=Math.max(0,num(ar.received));
 bank.income=num(bank.income)+amount;recalcBankBalance(bank);
 const tx={id:uid(),date:ar.receiptDate||ar.date||today(),bankId:bank.id,type:"收入",category:"應收帳款收款",amount,sourceType:"receivable",sourceId:ar.id,customer:ar.customer,project:ar.project,sourceNo:ar.sourceNo,note:`${relLabel("customers",ar.customer)||"客戶"} ${ar.sourceNo||""} 收款`,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
 state.bankTransactions.unshift(tx);ar.paymentTransactionId=tx.id;
}

function recalcBankBalance(bank){
 if(!bank)return;
 bank.expense=Math.max(0,num(bank.expense));
 bank.balance=num(bank.openingBalance)+num(bank.income)-num(bank.expense);
 bank.updatedAt=new Date().toISOString();
}
function syncPayrollPayment(payroll,previous=null){
 const txs=state.bankTransactions||[];
 const oldTx=txs.find(x=>x.sourceType==="payroll"&&x.sourceId===payroll.id);
 if(oldTx){
  const oldBank=(state.banks||[]).find(x=>x.id===oldTx.bankId);
  if(oldBank){oldBank.expense=Math.max(0,num(oldBank.expense)-num(oldTx.amount));recalcBankBalance(oldBank)}
  state.bankTransactions=txs.filter(x=>x.id!==oldTx.id);
 }
 if(payroll.status!=="已付款"){
  payroll.paymentTransactionId="";payroll.paidAt="";
  return;
 }
 const bank=(state.banks||[]).find(x=>x.id===payroll.bankId);
 if(!bank)throw new Error("找不到薪資付款銀行帳戶");
 const amount=Math.max(0,num(payroll.total));
 bank.expense=num(bank.expense)+amount;recalcBankBalance(bank);
 const tx={id:uid(),date:payroll.payDate||today(),bankId:bank.id,type:"支出",category:"員工薪資",amount,sourceType:"payroll",sourceId:payroll.id,employee:payroll.employee,month:payroll.month,note:`${relLabel("employees",payroll.employee)} ${payroll.month} 薪資付款`,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
 state.bankTransactions.unshift(tx);payroll.paymentTransactionId=tx.id;payroll.paidAt=new Date().toISOString();
}

function rebuildPayrollFor(month,employee){
 if(!month||!employee)return;
 const atts=(state.attendance||[]).filter(x=>String(x.date||"").slice(0,7)===month&&x.employee===employee);
 const comms=(state.commissions||[]).filter(x=>String(x.date||"").slice(0,7)===month&&x.employee===employee&&x.status==="已列入薪資");
 let p=(state.payroll||[]).find(x=>x.month===month&&x.employee===employee&&x.status!=="已付款");
 if(!p){p={id:uid(),month,employee,days:0,baseSalary:0,commission:0,fuel:0,meal:0,other:0,overtime:0,bonus:0,allowance:0,advance:0,laborInsurance:0,incomeTax:0,deduction:0,total:0,payDate:"",bankId:"",paymentTransactionId:"",paidAt:"",status:"未付款",note:"由請款單、抽成與點工自動彙整",createdAt:new Date().toISOString()};state.payroll.unshift(p)}
 p.days=atts.reduce((a,x)=>a+num(x.days),0);p.hours=atts.reduce((a,x)=>a+num(x.hours),0);
 p.baseSalary=atts.reduce((a,x)=>a+num(x.amount),0);
 p.fuel=atts.reduce((a,x)=>a+num(x.fuel),0);
 p.commission=comms.reduce((a,x)=>a+num(x.commission),0);
 p.total=num(p.baseSalary)+num(p.commission)+num(p.fuel)+num(p.meal)+num(p.other)+num(p.overtime)+num(p.bonus)+num(p.allowance)-num(p.advance)-num(p.laborInsurance)-num(p.incomeTax)-num(p.deduction);
 p.updatedAt=new Date().toISOString();
 if(!atts.length&&!comms.length&&!num(p.fuel)&&!num(p.meal)&&!num(p.other)&&!num(p.overtime)&&!num(p.bonus)&&!num(p.allowance)&&!num(p.advance)&&!num(p.laborInsurance)&&!num(p.incomeTax)&&!num(p.deduction)&&p.status!=="已付款")state.payroll=(state.payroll||[]).filter(x=>x.id!==p.id);
}
function rebuildPayrollForMany(pairs){
 const seen=new Set();(pairs||[]).forEach(([month,employee])=>{const k=payrollKey(month,employee);if(!seen.has(k)){seen.add(k);rebuildPayrollFor(month,employee)}})

function prefill(module){
 const d={date:today(),status:""};
 if(module==="quotations"){d.number="Q"+Date.now().toString().slice(-6);d.taxMode="未稅";d.status="草稿"}
 if(module==="billings"){d.number="B"+Date.now().toString().slice(-6);d.status="未請款"}
 if(module==="receivables")d.status="未收";
 if(module==="payables"){d.status="未付";d.feeParty="付款人"}
 if(module==="payroll"){d.month=new Date().toISOString().slice(0,7);d.status="未付款"}
 if(module==="attendance")d.status="已列入薪資";
 if(module==="commissions")d.status="未列入薪資";
 if(module==="calendar")d.status="待辦";

function attachAutoCalc(module){
 const f=document.getElementById("dataForm");
 const set=(name,val)=>{const el=f.elements[name];if(el)el.value=Math.round(val||0)};
 const calc=()=>{
  if(["quotations","billings","invoices"].includes(module)){const amount=num(f.elements.amount?.value);const taxMode=f.elements.taxMode?.value;const tax=taxMode==="含稅"?Math.round(amount-(amount/1.05)):Math.round(amount*(num(state.settings.defaultTax)/100));if(f.elements.tax)set("tax",tax);if(f.elements.total)set("total",amount+tax-num(f.elements.retention?.value))}
  if(module==="banks")set("balance",num(f.elements.openingBalance?.value)+num(f.elements.income?.value)-num(f.elements.expense?.value));
  if(module==="payroll")set("total",num(f.elements.baseSalary?.value)+num(f.elements.commission?.value)+num(f.elements.fuel?.value)+num(f.elements.meal?.value)+num(f.elements.other?.value)+num(f.elements.overtime?.value)+num(f.elements.bonus?.value)+num(f.elements.allowance?.value)-num(f.elements.advance?.value)-num(f.elements.laborInsurance?.value)-num(f.elements.incomeTax?.value)-num(f.elements.deduction?.value));
  if(module==="attendance")set("amount",num(f.elements.hours?.value)>0?num(f.elements.hours?.value)*num(f.elements.dailyRate?.value):num(f.elements.days?.value)*num(f.elements.dailyRate?.value));
  if(module==="commissions")set("commission",num(f.elements.untaxedAmount?.value)*num(f.elements.rate?.value)/100);
  if(module==="materialUsages"){const mat=(state.materials||[]).find(x=>x.id===f.elements.material?.value);if(mat){if(!f.elements.vendor.value)f.elements.vendor.value=mat.vendor||"";if(!num(f.elements.unitPrice.value))f.elements.unitPrice.value=num(mat.unitPrice)}set("amount",num(f.elements.quantity?.value)*num(f.elements.unitPrice?.value));}
 };
 f.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",calc));calc();
}
function normalizedMasterName(value){return String(value||"").trim().replace(/\s+/g," ").toLocaleUpperCase("zh-TW")}
function createMasterRecord(module,name,context={}){
 const now=new Date().toISOString(),base={id:uid(),name,createdAt:now,updatedAt:now};
 if(module==="customers")return {...base,taxId:"",contact:"",phone:"",address:"",note:"由下拉欄位自動建立"};
 if(module==="vendors")return {...base,taxId:"",contact:"",phone:"",address:"",note:"由下拉欄位自動建立"};
 if(module==="projects")return {...base,customer:context.customer||"",customerName:relLabel("customers",context.customer)||"",address:"",startDate:today(),status:"進行中",contractAmount:0,note:"由下拉欄位自動建立"};
 if(module==="employees")return {...base,phone:"",role:"",dailyRate:0,commissionRate:0,startDate:today(),status:"在職",note:"由下拉欄位自動建立"};
 if(module==="materials")return {...base,model:"",unit:"",vendor:context.vendor||"",unitPrice:0,stock:0,safeStock:0,note:"由下拉欄位自動建立"};
 if(module==="banks")return {...base,bank:"",account:"",openingBalance:0,income:0,expense:0,balance:0,note:"由下拉欄位自動建立"};
 return base;
}
function resolveManualRelations(fd,module,obj){
 const fields=(schemas[module]?.fields||[]).filter(f=>String(f[2]).startsWith("relation:"));
 fields.forEach(([key,,type])=>{const rel=type.split(":")[1],typed=String(fd.get(`${key}Name`)||"").trim();if(!typed){obj[key]="";return}const norm=normalizedMasterName(typed);let record=(state[rel]||[]).find(x=>normalizedMasterName(x.name||x.number)===norm);if(!record){record=createMasterRecord(rel,typed,obj);state[rel]=state[rel]||[];state[rel].unshift(record)}obj[key]=record.id});
}
async function saveForm(e,module,id){
 e.preventDefault();const fd=new FormData(e.target),obj=id?(state[module].find(x=>x.id===id)||{}):{id:uid(),createdAt:new Date().toISOString()};
 const oldMonth=String(obj.date||obj.month||"").slice(0,7),oldEmployee=obj.employee;
  for(const [k,v] of fd.entries())obj[k]=schemas[module].fields.find(f=>f[0]===k)?.[2]==="number"?num(v):v;
  resolveManualRelations(fd,module,obj);

 if(!id)state[module].unshift(obj);

   state.receivables.unshift({id:uid(),date:obj.date,customer:obj.customer,project:obj.project,sourceNo:obj.number,invoiceNo:obj.invoiceNo||"",taxMode:obj.taxMode||"未稅",untaxedAmount:num(obj.amount),tax:num(obj.tax),amount:num(obj.total),received:0,bankId:"",receiptDate:"",dueDate:"",status:"未收",note:"由請款單自動建立",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});

function deleteRow(module,id){

 state[module]=(state[module]||[]).filter(x=>!deleteIds.has(x.id));

 if(module==="attendance"&&old)rebuildPayrollFor(String(old.date||"").slice(0,7),old.employee);

 if(module==="payroll"&&old&&old.status==="已付款"){const ghost={...old,status:"未付款"};syncPayrollPayment(ghost,old)}

}

 else if(type==="receivable"){title="未收應收明細";heads=["日期","來源單號","應收金額","已收金額","未收餘額"];rows=ars.map(x=>[x.date||x.createdAt||"—",x.sourceNo||x.source||"—",money(num(x.amount||x.total)),money(num(x.paidAmount||x.paid)),money(Math.max(0,num(x.amount||x.total)-num(x.paidAmount||x.paid)))])}
 else if(type==="material"){title="材料成本明細";heads=["日期","材料","廠商","數量","單價","金額"];rows=materials.map(x=>[x.date||"—",x.materialName||x.material||"—",relLabel("vendors",x.vendor)||x.vendorName||x.vendor||"—",`${num(x.qty||x.quantity)} ${x.unit||""}`,money(num(x.price||x.unitPrice)),money(displayAmount(x))])}
 else if(type==="labor"){title="人工成本明細";heads=["日期","員工","點工方式","日薪／時薪","金額","備註"];rows=logs.filter(x=>dailyLogWorkAmount(x)>0).map(x=>[x.date||"—",relLabel("employees",x.employee)||x.employeeName||"—",x.workMode==="daily"?"日薪":x.workMode==="hourly"?"時薪":"—",money(num(x.workRate)),money(dailyLogWorkAmount(x)),x.note||"—"])}
 else if(type==="commission"){title="員工抽成明細";heads=["日期","員工","業績","抽成比例","抽成金額","備註"];rows=logs.filter(x=>num(x.commission)>0).map(x=>[x.date||"—",relLabel("employees",x.employee)||x.employeeName||"—",money(num(x.performance)),`${num(x.rate)}%`,money(num(x.commission)),x.note||"—"])}
 else if(type==="billed"){title="累計已請款明細";heads=["日期","單號","品項／說明","請款金額"];rows=bills.map(x=>[x.date||"—",x.no||x.number||"—",(x.lines||[]).map(i=>i.item||i.name).filter(Boolean).join("、")||x.note||"—",money(displayAmount(x))])}
 else {title="案場損益組成";heads=["項目","金額","計算說明"];rows=[["累計已請款",money(nums.billed),"本案場所有請款單"],["未收應收",money(nums.ar),"尚未收款金額"],["材料成本",money(nums.materialCost),"材料用量／應付串聯"],["人工成本",money(nums.laborCost),"點工／出勤"],["員工抽成",money(nums.commissionCost),"每日業績抽成"],["預估毛利",money(nums.profit),"累計請款－材料－人工－抽成"]]}
 document.getElementById("modal").innerHTML=`<div class="modal-card" style="width:min(1100px,96vw)"><div class="modal-head" style="background:linear-gradient(120deg,#082f63,#087f77);color:#fff"><div><h3 style="margin:0">${esc(p.name)}｜${esc(title)}</h3><small>點擊「返回案場中心」可查看其他資料卡</small></div><button class="btn" id="closeModal">✕</button></div><div class="modal-body"><div class="table-wrap"><table class="data-table"><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,index)=>`<td class="${index===row.length-1?"num":""}">${esc(String(cell))}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${heads.length}">此案場目前沒有這類資料。</td></tr>`}</tbody></table></div></div><div class="modal-foot"><button class="btn" id="backProjectCenter">返回案場中心</button><button class="btn primary" id="closeProjectDetail">關閉</button></div></div>`;document.getElementById("closeModal").onclick=closeModal;document.getElementById("closeProjectDetail").onclick=closeModal;document.getElementById("backProjectCenter").onclick=()=>showProjectCenter(projectId);
}
const __showProjectCenterV8=showProjectCenter;
showProjectCenter=function(projectId){__showProjectCenterV8(projectId);const types=["performance","billing","receivable","material","labor","commission","billed","profit"];[...document.querySelectorAll("#modal .cards > *")].forEach((card,index)=>{const type=types[index];if(!type)return;card.dataset.projectCardType=type;card.style.cssText+=(";cursor:pointer;transition:transform .15s ease,box-shadow .15s ease");card.onclick=()=>showProjectCardDetail(projectId,type);card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();showProjectCardDetail(projectId,type)}}})};
</script>
