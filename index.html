<style>

#loginView{min-height:100vh;display:grid;place-items:center;background:

 .mobile-menu-toggle{display:none}@media(max-width:700px){#appView{display:block}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:64px;display:flex;overflow:auto;padding:6px;z-index:15}.side-brand{display:none}.nav-btn{min-width:72px;margin:0}.main{padding-bottom:70px}.topbar{padding:0 12px}.content{padding:12px}.cards,.grid-2,.grid-3,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.metric .value{font-size:22px}.mobile-menu-toggle{display:flex;align-items:center;justify-content:center;position:fixed;right:14px;bottom:78px;z-index:20;border:0;border-radius:999px;background:#0b2e69;color:#fff;padding:12px 16px;font-size:15px;font-weight:800;box-shadow:0 8px 20px rgba(7,29,66,.32)}.sidebar.mobile-open{top:0;bottom:0;height:100vh;display:block;padding:20px 14px;overflow:auto}.sidebar.mobile-open .side-brand{display:flex}.sidebar.mobile-open #nav{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:16px}.sidebar.mobile-open .nav-btn{min-width:0;margin:0;text-align:left;padding:13px 12px;background:rgba(255,255,255,.08)}.sidebar.mobile-open .nav-btn span{display:inline}.sidebar.mobile-open~.mobile-menu-toggle{bottom:16px;background:#d64747}}

.owner-two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.owner-table{width:100%;border-collapse:collapse}.owner-table th,.owner-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.owner-table th{background:#f8faff;color:#526078;font-size:13px}.owner-table td.num{text-align:right;font-variant-numeric:tabular-nums}.owner-table tr[data-go]{cursor:pointer}.owner-table tr[data-go]:hover td{background:#eef6ff}.profit-pos{color:#0b7b73;font-weight:900}.profit-neg{color:#c0392b;font-weight:900}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#0b7b73,#0b2e69)}

/* 手機／iPhone 專用的可點選下拉：不依賴 Safari 原生 datalist。 */

 return `<table class="data-table"><thead><tr>${fields.slice(0,7).map(f=>`<th>${f[1]}</th>`).join("")}<th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr>${fields.slice(0,7).map(f=>`<td class="${f[2]==="number"?"num":""}">${displayValue(module,f,r[f[0]])}</td>`).join("")}<td><div class="row-actions"><button data-edit="${r.id}">編輯</button><button data-delete="${r.id}">刪除</button>${["quotations","billings"].includes(module)?`<button data-print="${r.id}">單據</button>`:""}${module==="projects"?`<button data-project-materials="${r.id}">材料明細</button>`:""}</div></td></tr>`).join("")}</tbody></table>`;

 if(type.startsWith("relation:")){const rel=type.split(":")[1],opts=state[rel]||[],current=relLabel(rel,value),listId=`${module}_${key}_list`;return `<div class="field"><label>${label}</label><input name="${key}Name" list="${listId}" value="${esc(current)}" placeholder="可輸入新資料或選擇既有資料" ${req}><datalist id="${listId}">${opts.map(o=>`<option value="${esc(o.name||o.number||"")}">`).join("")}</datalist><input type="hidden" name="${key}" value="${esc(value||"")}"></div>`}
 if(type.startsWith("relation:")){const rel=type.split(":")[1],opts=state[rel]||[];return `<div class="field"><label>${label}</label><select name="${key}" ${req}><option value="">請選擇</option>${opts.map(o=>`<option value="${o.id}" ${o.id===value?"selected":""}>${esc(o.name||o.number)}</option>`).join("")}</select></div>`}
 return `<div class="field"><label>${label}</label><input name="${key}" type="${type}" value="${esc(value)}" ${req}></div>`;
}

function receivableTaxValues(taxMode,inputAmount){
 const rate=num(state.settings.defaultTax)||5,input=Math.max(0,num(inputAmount));
 if(taxMode==="含稅"){
  const untaxed=Math.round(input/(1+rate/100)),tax=input-untaxed;
  return {untaxed,tax,total:input};
 }
 const untaxed=input,tax=Math.round(untaxed*rate/100);
 return {untaxed,tax,total:untaxed+tax};
}
function syncReceivablePayment(ar){
 const txs=state.bankTransactions||[];
 const oldTx=txs.find(x=>x.sourceType==="receivable"&&x.sourceId===ar.id);
 if(oldTx){
  const oldBank=(state.banks||[]).find(x=>x.id===oldTx.bankId);
  if(oldBank){oldBank.income=Math.max(0,num(oldBank.income)-num(oldTx.amount));recalcBankBalance(oldBank)}
  state.bankTransactions=txs.filter(x=>x.id!==oldTx.id);
 }
 ar.paymentTransactionId="";
 if(num(ar.received)<=0)return;
 const bank=(state.banks||[]).find(x=>x.id===ar.bankId);
 if(!bank)throw new Error("請選擇收款銀行帳戶");
 const amount=Math.max(0,num(ar.received));
 bank.income=num(bank.income)+amount;recalcBankBalance(bank);
 const tx={id:uid(),date:ar.receiptDate||ar.date||today(),bankId:bank.id,type:"收入",category:"應收帳款收款",amount,sourceType:"receivable",sourceId:ar.id,customer:ar.customer,project:ar.project,sourceNo:ar.sourceNo,note:`${relLabel("customers",ar.customer)||"客戶"} ${ar.sourceNo||""} 收款`,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
 state.bankTransactions.unshift(tx);ar.paymentTransactionId=tx.id;
}

 const row=id?(state.receivables.find(x=>x.id===id)||{}):prefill("receivables");
 const taxMode=row.taxMode||"未稅";
 const inputAmount=taxMode==="含稅"?num(row.amount):num(row.untaxedAmount||row.amount);
 const modal=document.getElementById("modal");
 modal.innerHTML=`<div class="modal-card" style="width:min(1120px,96vw)"><div class="modal-head"><h3>${id?"編輯":"新增"}應收帳款</h3><button class="btn" id="closeModal">✕</button></div>

function rebuildMaterialPayables(){
 const old=(state.payables||[]).filter(x=>x.sourceType==="material-merged");const paidByVendor=new Map(old.map(x=>[x.vendor,{paid:num(x.paid),fee:num(x.fee),feeParty:x.feeParty||"付款人"}]));state.payables=(state.payables||[]).filter(x=>x.sourceType!=="material-merged");const groups=new Map();(state.materialUsages||[]).forEach(u=>{if(!u.vendor)return;const g=groups.get(u.vendor)||{amount:0,dates:[],projects:new Set(),usageIds:[]};g.amount+=num(u.amount);g.dates.push(u.date||today());g.projects.add(u.project);g.usageIds.push(u.id);groups.set(u.vendor,g)});for(const [vendor,g] of groups){const prev=paidByVendor.get(vendor)||{};const paid=Math.min(num(prev.paid),g.amount);state.payables.unshift({id:uid(),date:g.dates.sort().slice(-1)[0]||today(),vendor,project:"",sourceNo:"材料用量合併",sourceType:"material-merged",usageIds:g.usageIds,amount:g.amount,paid,fee:num(prev.fee),feeParty:prev.feeParty||"付款人",status:paid>=g.amount?"已付":paid>0?"部分付款":"未付",note:`相同廠商自動合併，共 ${g.usageIds.length} 筆材料紀錄、${g.projects.size} 個案場`,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()})}
}

}
function syncPayrollPayment(payroll,previous=null){

 if(oldTx){
  const oldBank=(state.banks||[]).find(x=>x.id===oldTx.bankId);
  if(oldBank){oldBank.expense=Math.max(0,num(oldBank.expense)-num(oldTx.amount));recalcBankBalance(oldBank)}
  state.bankTransactions=txs.filter(x=>x.id!==oldTx.id);
 }
 if(payroll.status!=="已付款"){
  payroll.paymentTransactionId="";payroll.paidAt="";
  return;
 }
 const bank=(state.banks||[]).find(x=>x.id===payroll.bankId);
 if(!bank)throw new Error("找不到薪資付款銀行帳戶");

function resolveManualRelations(fd,module,obj){
 const fields=(schemas[module]?.fields||[]).filter(f=>String(f[2]).startsWith("relation:"));
 fields.forEach(([key,,type])=>{const rel=type.split(":")[1],typed=String(fd.get(`${key}Name`)||"").trim();if(!typed){obj[key]="";return}const norm=normalizedMasterName(typed);let record=(state[rel]||[]).find(x=>normalizedMasterName(x.name||x.number)===norm);if(!record){record=createMasterRecord(rel,typed,obj);state[rel]=state[rel]||[];state[rel].unshift(record)}obj[key]=record.id});
}
async function saveForm(e,module,id){
 e.preventDefault();const fd=new FormData(e.target),obj=id?(state[module].find(x=>x.id===id)||{}):{id:uid(),createdAt:new Date().toISOString()};
 const oldMonth=String(obj.date||obj.month||"").slice(0,7),oldEmployee=obj.employee;

 }

function deleteRow(module,id){

 const old=(state[module]||[]).find(x=>x.id===id),deleteIds=new Set([id]);

 state[module]=(state[module]||[]).filter(x=>!deleteIds.has(x.id));
 if(module==="materialUsages")rebuildMaterialPayables();
 if(module==="attendance"&&old)rebuildPayrollFor(String(old.date||"").slice(0,7),old.employee);
 if(module==="commissions"&&old)rebuildPayrollFor(String(old.date||"").slice(0,7),old.employee);
 if(module==="payroll"&&old&&old.status==="已付款"){const ghost={...old,status:"未付款"};syncPayrollPayment(ghost,old)}
  if(module==="receivables"&&old){const ghost={...old,received:0};syncReceivablePayment(ghost)}

  saveState(`刪除${schemas[module].title}`);render();
}

function migratePayableTax(){const rate=num(state.settings?.defaultTax)||5;(state.payables||[]).forEach(x=>{if(x.taxMode===undefined)x.taxMode="含稅";if(x.invoiceNo===undefined)x.invoiceNo="";if(x.untaxedAmount===undefined||x.tax===undefined){const amount=num(x.amount);if(x.taxMode==="含稅"){x.untaxedAmount=Math.round(amount/(1+rate/100));x.tax=amount-num(x.untaxedAmount)}else{x.untaxedAmount=amount;x.tax=Math.round(amount*rate/100);x.amount=x.untaxedAmount+x.tax}if(x.bankId===undefined)x.bankId="";if(x.payDate===undefined)x.payDate="";if(x.paymentTransactionId===undefined)x.paymentTransactionId=""}})}
function hasBusinessData(data){return ['customers','vendors','projects','quotations','billings','invoices','receivables','payables','banks','bankTransactions','ownerDraws','employees','attendance','dailyLogs','commissions','payroll','materials','materialUsages'].some(k=>(data?.[k]||[]).length>0)}
async function applyCloudData(data,notice=''){const localCloud={...(state.settings||{})};state=data;migrate();state.settings={...(state.settings||{}),cloudUrl:localCloud.cloudUrl||state.settings.cloudUrl||'',cloudPublishableKey:localCloud.cloudPublishableKey||''};await dbSet(STATE_KEY,state);localStorage.setItem('KuSheERP25_EMERGENCY',JSON.stringify(state));if(notice)toast(notice)}
async function cloudPullLatest(silent=true){if(!cloudReady())return false;try{const remote=await cloudDownload();if(!remote?.data)return false;const localTime=String(state.meta?.updatedAt||''),remoteTime=String(remote.updated_at||remote.data?.meta?.updatedAt||'');if(remoteTime>localTime){await applyCloudData(remote.data,silent?'':'已下載最新雲端資料');return true}return false}catch(err){if(!silent)alert('同步失敗：'+err.message);return false}}
async function cloudFirstSync(){try{const remote=await cloudDownload();if(!remote?.data){await cloudUpload();return}if(!hasBusinessData(state)){await applyCloudData(remote.data,'已下載雲端既有資料');render();return}const localTime=String(state.meta?.updatedAt||''),remoteTime=String(remote.updated_at||remote.data?.meta?.updatedAt||'');if(remoteTime>localTime){await applyCloudData(remote.data,'已下載較新的雲端資料');render()}else await cloudUpload()}catch(err){alert('同步失敗：'+err.message)}}
async function init(){
  await loadState();
  await cloudPullLatest(true);
  migratePayableTax();
  repairOrphanedDailyBillingLinks();
  rebuildAllPayroll();
  rebuildMaterialPayables();
 await saveState("啟動時重新同步點工與抽成薪資");
 document.getElementById("loginBtn").onclick=login;document.getElementById("logoutBtn").onclick=logout;document.getElementById("quickBackup").onclick=exportBackup;document.getElementById("mobileMenuToggle").onclick=()=>{const side=document.querySelector(".sidebar");side.classList.toggle("mobile-open");document.getElementById("mobileMenuToggle").textContent=side.classList.contains("mobile-open")?"✕ 關閉":"☰ 選單"};
 document.getElementById("loginPass").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
 const emergency=localStorage.getItem("KuSheERP25_EMERGENCY");if(!state&&emergency)state=JSON.parse(emergency);
}
function login(){const u=document.getElementById("loginUser").value.trim(),p=document.getElementById("loginPass").value;if(u===String(state.settings.username)&&p===String(state.settings.password)){document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");render()}else alert("帳號或密碼錯誤")}
function logout(){document.getElementById("appView").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden")}
window.addEventListener("beforeunload",()=>{try{localStorage.setItem("KuSheERP25_EMERGENCY",JSON.stringify(state))}catch(e){}});
init().catch(err=>{console.error(err);alert("系統初始化失敗："+err.message)});
</script>
</body>
