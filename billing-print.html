<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>酷舍對外文件</title>
  <style>
    @page{size:A4 portrait;margin:10mm 12mm}
    *{box-sizing:border-box}
    html,body{margin:0;background:#edf1f4;color:#172033;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
    .toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:10px;background:#172033}
    .toolbar button{border:0;border-radius:6px;padding:9px 20px;background:#176d68;color:#fff;font-weight:700;cursor:pointer}
    .toolbar .close{background:#566273}
    .paper{width:186mm;min-height:277mm;margin:16px auto;background:#fff;padding:7mm 8mm 8mm;box-shadow:0 10px 32px rgba(20,39,65,.15)}
    .head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8mm;align-items:start;padding-bottom:4mm;border-bottom:.8mm solid #176d68}
    .company{text-align:left}.company h1{margin:0;color:#176d68;font-size:21pt;letter-spacing:2pt;line-height:1.15}
    .company .en{margin-top:1mm;color:#536174;font-size:8.5pt}
    .company .sub{display:flex;flex-wrap:wrap;gap:1mm 0;margin-top:1.5mm;color:#69778a;font-size:7.5pt}.company .sub span+span::before{content:"｜";margin:0 1.2mm}
    .doc-title{text-align:right}.doc-title h2{margin:0;font-size:19pt;letter-spacing:5pt;white-space:nowrap}
    .info{display:grid;grid-template-columns:1fr 1fr;gap:0 7mm;margin:4mm 0 3mm}
    .info div{padding:2mm 0 1.5mm;border-bottom:.25mm solid #c9d1db;font-size:9.5pt}.label{display:inline-block;min-width:19mm;color:#69778a}
    .section{margin-top:3.5mm;border:.25mm solid #8c9bac;overflow:visible;break-inside:auto}
    .section-title{padding:2mm 3mm;color:#fff;font-size:10pt;font-weight:700;background:#25445f}
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    .detail thead{display:table-header-group}.detail tr{break-inside:avoid;page-break-inside:avoid}
    .detail th,.detail td{border:.2mm solid #8795a5;padding:1.8mm 1.5mm;font-size:8.7pt;line-height:1.3;vertical-align:top}
    .detail th{background:#f0f3f6;text-align:center;font-weight:700}.detail td.item{text-align:left;font-weight:700;word-break:break-word}.detail td.center{text-align:center}.detail .num{text-align:right;white-space:nowrap}
    .detail tfoot{break-inside:avoid}.detail tfoot td{padding:1.6mm;font-weight:700;background:#fafbfc}.detail tfoot .total td{border-top:.55mm solid #176d68;color:#176d68;font-size:10.5pt}.detail tfoot .receivable td{background:#eaf5f3;color:#114f4c;font-size:10.5pt}
    .actual-note{display:block;margin-top:.7mm;color:#176d68;font-size:7.5pt;font-weight:700}
    .note{margin-top:3.5mm;padding:2.5mm 3mm;border:.25mm solid #c9d1db;white-space:pre-wrap;overflow-wrap:anywhere;font-size:8.5pt;line-height:1.5;break-inside:avoid}
    .sign{display:grid;grid-template-columns:1fr 1fr;gap:18mm;margin-top:7mm;align-items:end;break-inside:avoid}
    .client-sign{padding-top:9mm;border-top:.25mm solid #657386;text-align:center;color:#69778a;font-size:8.5pt}.company-seals{text-align:center;color:#69778a;font-size:8.5pt}.seal-wrap{height:25mm;display:flex;align-items:center;justify-content:center}.seal{max-width:50mm;max-height:24mm;object-fit:contain;mix-blend-mode:multiply}
    .empty{padding:7mm;text-align:center;color:#69778a}
    @media print{html,body{background:#fff}.toolbar{display:none!important}.paper{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}.section{break-inside:auto}.note,.sign,.detail tfoot{break-inside:avoid}}
    @media screen and (max-width:850px){.paper{margin:0;transform-origin:top left;transform:scale(calc(100vw / 703));}.toolbar{width:100vw}}
  </style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">匯出 PDF／列印</button><button class="close" onclick="window.close()">關閉</button></div>
  <main class="paper" id="paper"></main>
  <script>
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const n=v=>Number(v)||0;
    const m=v=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n(v));
    const q=v=>v===null||v===undefined||v===''?'—':new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(n(v));
    let d={};
    try{d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(1))))))}catch(e){document.getElementById('paper').innerHTML='<p class="empty">無法讀取文件資料</p>'}
    const lines=Array.isArray(d.lines)?d.lines:[],c=d.company||{},isQuote=d.documentType==='quotation',isActual=isQuote&&d.pricingMode==='actual',hasTax=isQuote||d.invoiceStatus!=='no_invoice',retention=n(d.retentionAmount),companyInfo=[c.taxId&&'統編 '+c.taxId,c.address,c.phone,c.line&&'LINE：'+c.line].filter(Boolean);
    const lineRows=lines.map(x=>`<tr><td class="center">${esc(x.house||'—')}</td><td class="item">${esc(x.item||'—')}${isQuote&&x.pricingType==='actual'?'<span class="actual-note">實做實算</span>':''}</td><td class="center">${esc(x.unit||'—')}</td><td class="num">${q(x.qty)}</td><td class="num">${x.price===null||x.price===undefined?'—':m(x.price)}</td><td class="num">${m(x.amount)}</td></tr>`).join('');
    const totals=isActual?`<tr class="receivable"><td colspan="5">計價方式</td><td class="num">實做實算</td></tr>`:hasTax?`<tr><td colspan="5">未稅金額</td><td class="num">${m(d.salesAmount)}</td></tr><tr><td colspan="5">稅額</td><td class="num">${m(d.taxAmount)}</td></tr><tr class="total"><td colspan="5">${isQuote?'總金額':'請款金額'}</td><td class="num">${m(d.totalAmount)}</td></tr>`:`<tr class="total"><td colspan="5">請款金額</td><td class="num">${m(d.totalAmount)}</td></tr>`;
    const retentionRows=!isQuote&&retention>0?`<tr><td colspan="5">保留款</td><td class="num">-${m(retention)}</td></tr><tr class="receivable"><td colspan="5">本期實領／應收</td><td class="num">${m(d.receivableAmount)}</td></tr>`:'';
    document.title=d.fileName||d.title||'酷舍對外文件';
    document.getElementById('paper').innerHTML=`<header class="head"><div class="company"><h1>${esc(c.name||'酷舍企業有限公司')}</h1><div class="en">${esc(c.englishName||'Cool Sir Limited Company')}</div><div class="sub">${companyInfo.map(value=>`<span>${esc(value)}</span>`).join('')}</div></div><div class="doc-title"><h2>${esc(d.title||'請款單')}</h2></div></header><section class="info"><div><span class="label">日期</span>${esc(d.date||'—')}</div><div><span class="label">客戶</span>${esc(d.customer||'—')}</div><div><span class="label">案場／工程名稱</span>${esc(d.project||'—')}</div><div><span class="label">計價方式</span>${isActual?'實做實算':esc(d.taxMode||'—')}</div></section><section class="section"><div class="section-title">${isQuote?'報價明細':'請款明細'}</div><table class="detail"><colgroup><col style="width:12%"><col style="width:38%"><col style="width:9%"><col style="width:11%"><col style="width:14%"><col style="width:16%"></colgroup><thead><tr><th>戶別</th><th>${isQuote?'項目':'施工項目'}</th><th>單位</th><th>數量</th><th>單價</th><th>${isQuote?'小計':'本次請款'}</th></tr></thead><tbody>${lineRows||'<tr><td class="empty" colspan="6">無明細資料</td></tr>'}</tbody><tfoot>${totals}${retentionRows}</tfoot></table></section>${d.publicNote?`<section class="note"><b>備註：</b><br>${esc(d.publicNote)}</section>`:''}<section class="sign"><div class="client-sign">客戶簽章</div><div class="company-seals"><div>公司大小章</div><div class="seal-wrap"><img class="seal" id="formalCompanySeal" alt="公司大小章" onerror="this.hidden=true"></div></div></section>`;
    async function loadAssets(){try{const source=await fetch('../enterprise/index.html').then(r=>r.text()),name='companySealAsset',id='formalCompanySeal',start=source.indexOf('const '+name+'=');if(start<0)return;let end=source.indexOf(';\n',start);if(end<0)end=source.indexOf(';\r',start);const parts=[...source.slice(start,end).matchAll(/'([^']*)'/g)].map(x=>x[1]);if(parts.length)document.getElementById(id).src=parts.join('')}catch(e){}}
    loadAssets().finally(()=>{if(new URLSearchParams(location.search).get('print')==='1')setTimeout(()=>window.print(),250)});
  </script>
</body>
</html>
