<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酷舍請款單</title><style>
@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;background:#e8edf2;color:#142238;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.toolbar{position:sticky;top:0;z-index:5;padding:10px;text-align:center;background:#102a43}.toolbar button{margin:0 5px;padding:8px 20px;border:0;border-radius:5px;font-weight:700;cursor:pointer}.paper{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:12mm 14mm 10mm;position:relative}.doc-head{display:flex;align-items:center;border-bottom:3px solid #173f5f;padding-bottom:7mm}.brand{display:flex;align-items:center;gap:4mm;flex:1}.logo{width:18mm;height:18mm}.company h1{font-size:20pt;letter-spacing:2px;margin:0;color:#173f5f}.company p{font-size:9pt;line-height:1.7;margin:1mm 0 0}.doc-title{text-align:right}.doc-title h2{font-size:24pt;letter-spacing:8px;margin:0}.doc-title b{font-size:10pt;color:#4d6478}.meta{display:grid;grid-template-columns:1fr 1fr;margin:6mm 0 4mm;border:1px solid #7f94a5}.meta div{padding:2.4mm 3mm;border-bottom:1px solid #ccd5dc}.meta div:nth-child(odd){border-right:1px solid #ccd5dc}.meta b{display:inline-block;min-width:24mm;color:#173f5f}.items{width:100%;border-collapse:collapse;font-size:9pt}.items th{background:#173f5f;color:#fff;padding:2.3mm 2mm}.items td{border:1px solid #9cabb7;padding:2.2mm 2mm;vertical-align:top}.num{text-align:right;white-space:nowrap}.summary{width:76mm;margin:5mm 0 0 auto;border-collapse:collapse;font-size:10pt}.summary td{padding:1.7mm 2mm;border-bottom:1px solid #b9c5ce}.summary tr:last-child{font-size:13pt;font-weight:800;color:#173f5f}.notes{margin-top:5mm;border:1px solid #b9c5ce;padding:3mm;font-size:9pt;min-height:14mm}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin-top:9mm}.signature{border-top:1px solid #789;padding-top:3mm;text-align:center;min-height:32mm;font-size:9pt}.seal-space{height:23mm;color:#90a0ad;display:flex;align-items:center;justify-content:center}.foot{position:absolute;left:14mm;right:14mm;bottom:8mm;text-align:center;font-size:8pt;color:#62778a}@media print{body{background:#fff}.toolbar{display:none}.paper{margin:0;box-shadow:none}}@media screen and (max-width:850px){.paper{transform-origin:top left;margin:0;transform:scale(calc(100vw / 794));}.toolbar{width:100vw}}
</style></head><body><div class="toolbar"><button onclick="window.print()">匯出 PDF／列印</button><button onclick="window.close()">關閉</button></div><main class="paper" id="paper"></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number(v)||0,m=v=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n(v));let data={};try{data=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(1))))))}catch(e){document.body.textContent='無法讀取請款資料'}const b=data.billing||{},c=data.company||{},lines=b.lines||[];document.title=data.fileName||'酷舍請款單.pdf';const invoice=b.invoiceStatus==='no_invoice'?'免開發票':b.invoiceNo?'已開發票':'待開發票',gross=n(b.grossTotal),ret=n(b.retention),receivable=n(b.total);document.getElementById('paper').innerHTML=`<header class="doc-head"><div class="brand"><img id="formalCompanyLogo" class="logo" alt="酷舍企業"><div class="company"><h1>${esc(c.name)}</h1><p>統一編號：${esc(c.taxId||'—')}　電話：${esc(c.phone||'—')}<br>${esc(c.address||'')}</p></div></div><div class="doc-title"><h2>請款單</h2><b>${esc(b.number||'')}</b></div></header><section class="meta"><div><b>客戶</b>${esc(b.customerName||'—')}</div><div><b>案場</b>${esc(b.projectName||'—')}</div><div><b>請款日期</b>${esc(b.date||'—')}</div><div><b>請款期間</b>${esc(b.periodStart||b.billingMonth||'—')} ～ ${esc(b.periodEnd||b.billingMonth||'—')}</div><div><b>發票狀態</b>${invoice}</div><div><b>稅務方式</b>${esc(b.taxMode||'—')}</div></section><table class="items"><thead><tr><th>施工日期</th><th>施工項目</th><th>單位</th><th>數量</th><th>單價</th><th>小計</th><th>備註</th></tr></thead><tbody>${lines.map(x=>`<tr><td>${esc(x.date||'—')}</td><td>${esc(x.item||'—')}</td><td>${esc(x.unit||'—')}</td><td class="num">${esc(x.qty||0)}</td><td class="num">${m(x.price)}</td><td class="num">${m(n(x.qty)*n(x.price))}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</tbody></table><table class="summary"><tr><td>未稅金額</td><td class="num">${m(b.amount)}</td></tr><tr><td>稅額</td><td class="num">${m(b.tax)}</td></tr><tr><td>請款總額</td><td class="num">${m(gross)}</td></tr><tr><td>保留款${n(b.retentionRate)?` (${esc(b.retentionRate)}%)`:''}</td><td class="num">－ ${m(ret)}</td></tr><tr><td>本期應收</td><td class="num">${m(receivable)}</td></tr></table><section class="notes"><b>備註：</b>${esc(b.note||'')}</section><section class="signatures"><div class="signature">客戶簽章<div class="seal-space"></div></div><div class="signature">公司大小章<div class="seal-space"><img id="formalCompanySeal" alt="公司大小章" style="max-width:52mm;max-height:23mm"></div></div></section><div class="foot">${esc(c.name)}　${esc(c.phone||'')}　${esc(c.address||'')}</div>`;
async function loadFormalAssets(){try{const source=await fetch('../enterprise/index.html').then(r=>r.text());for(const [name,id] of [['companyLogoAsset','formalCompanyLogo'],['companySealAsset','formalCompanySeal']]){const start=source.indexOf('const '+name+'=');if(start<0)continue;let end=source.indexOf(';\n',start);if(end<0)end=source.indexOf(';\r',start);const expr=source.slice(start,end),parts=[...expr.matchAll(/'([^']*)'/g)].map(x=>x[1]);if(parts.length)document.getElementById(id).src=parts.join('')}}catch(e){document.getElementById('formalCompanyLogo').alt=c.name||'酷舍企業'}}loadFormalAssets().finally(()=>{if(new URLSearchParams(location.search).get('print')==='1')setTimeout(()=>window.print(),250)});
</script></body></html>
