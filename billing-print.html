<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>酷舍對外文件</title>
  <style>
    @page{size:A4 portrait;margin:0}
    *{box-sizing:border-box}
    html,body{margin:0;background:#edf1f4;color:#11213f;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
    .toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:10px;background:#172033}
    .toolbar button{border:0;border-radius:6px;padding:9px 20px;background:#0d8a80;color:#fff;font-weight:700;cursor:pointer}.toolbar .close{background:#566273}
    .paper{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:8mm 17mm 9mm;box-shadow:0 10px 32px rgba(20,39,65,.15)}
    .head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10mm;align-items:start;padding-bottom:4.5mm;border-bottom:1mm solid #078d82}
    .company-block{display:flex;align-items:center;gap:5mm;min-width:0}.company-logo-frame{display:block;width:18mm;height:14mm;overflow:hidden;flex:none}.company-logo{display:none;width:18mm;height:18mm;object-fit:contain}
    .company{min-width:0;text-align:left}.company h1{margin:0;color:#078d82;font-size:22pt;font-weight:900;letter-spacing:1.7pt;line-height:1.05;white-space:nowrap}.company .en{margin-top:2mm;color:#33435e;font-size:10pt;line-height:1.15;white-space:nowrap}.company .sub{display:flex;flex-wrap:nowrap;margin-top:1.8mm;color:#53647e;font-size:8pt;line-height:1.2;white-space:nowrap}.company .sub span+span::before{content:"｜";margin:0 1.1mm}
    .doc-title{text-align:right;padding-top:1mm}.doc-title h2{margin:0;color:#101b48;font-size:23pt;font-weight:900;letter-spacing:5pt;line-height:1;white-space:nowrap}
    .info{display:grid;grid-template-columns:1fr 1fr;gap:3mm 4mm;margin:6mm 0 5mm;padding:4mm;background:#f0f8f8;border:.25mm solid #b5d4e7;border-radius:3.5mm}
    .info div{display:flex;align-items:center;min-height:15mm;padding:3mm 4mm;background:#fff;border:.25mm solid #c7d8e9;border-radius:2.5mm;font-size:11pt;font-weight:700}.label{display:inline-flex;align-items:center;justify-content:center;min-width:auto;margin-right:3mm;padding:2mm 2.5mm;border-radius:1.5mm;background:#092d57;color:#fff;font-size:8.5pt;font-weight:800}
    .section{margin-top:4mm;border:.25mm solid #b5cce2;border-radius:3mm;overflow:hidden;break-inside:auto}.section-title{padding:3mm 4mm;color:#fff;font-size:11pt;font-weight:900;background:linear-gradient(90deg,#092d57 0%,#0b4a63 55%,#078d82 100%)}
    table{width:100%;border-collapse:collapse;table-layout:fixed}.matrix thead{display:table-header-group}.matrix tr,.detail tr{break-inside:avoid;page-break-inside:avoid}
    .matrix th,.matrix td,.detail th,.detail td{border:.25mm solid #b4c9df;padding:2.4mm 2mm;font-size:9pt;line-height:1.25}.matrix th,.detail th{background:#edf7f7;color:#082e58;text-align:center;font-weight:700}.matrix td{text-align:center}.matrix .grand td{font-weight:800;background:#f7f9fb}
    .detail thead{display:table-header-group}.detail td.item{text-align:left;background:#fff0de;font-weight:700;word-break:break-word}.detail td.center{text-align:center}.detail .num{text-align:right;white-space:nowrap}.detail .line-total td{background:#f7f9fb;font-weight:700}.detail .line-total td:first-child{text-align:center}.actual-note{display:block;margin-top:.6mm;color:#078d82;font-size:7.5pt;font-weight:700}
    .summary{width:47%;margin:4mm 0 0 auto;border:.25mm solid #b5cce2;border-radius:3mm;overflow:hidden;break-inside:avoid}.summary-row{display:grid;grid-template-columns:1fr auto;align-items:center;min-height:11mm;padding:2.6mm 3.5mm;border-bottom:.25mm solid #d6e0ea;font-size:10.5pt}.summary-row:last-child{border-bottom:0}.summary-row strong{font-size:12pt}.summary-row.total{background:#e8faf4;color:#07867c;font-weight:900}.summary-row.total strong{font-size:13pt}.summary-row.receivable{background:#e8faf4;color:#075f59;font-weight:900}
    .actual-summary{display:inline-flex;align-items:center;margin:3mm 0 0 2mm;padding:1.5mm 3mm;border-radius:2mm;background:#e8faf4;color:#07867c;font-size:10pt;font-weight:900;letter-spacing:.5pt;text-align:left}.note{margin-top:4mm;padding:3mm 4mm;border:.25mm solid #c9d8e8;border-radius:2mm;white-space:pre-wrap;overflow-wrap:anywhere;font-size:9pt;line-height:1.5;break-inside:avoid}
    .sign{display:grid;grid-template-columns:1fr 1fr;gap:16mm;margin-top:9mm;align-items:end;break-inside:avoid}.client-sign{padding-top:11mm;border-top:.25mm solid #33435e;text-align:center;color:#53647e;font-size:9pt}.company-seals{text-align:center;color:#53647e;font-size:9pt}.seal-wrap{height:31mm;display:flex;align-items:center;justify-content:center}.seal{max-width:54mm;max-height:30mm;object-fit:contain;mix-blend-mode:normal}.empty{padding:7mm;text-align:center;color:#69778a}
    .paper.billing-document .summary-row{min-height:9mm;padding-top:1.8mm;padding-bottom:1.8mm}.paper.billing-document .sign{margin-top:3.5mm}.paper.billing-document .client-sign{padding-top:8mm}.paper.billing-document .seal-wrap{height:25mm}.paper.billing-document .seal{max-height:24mm}
    .paper.quotation-document .quotation-content{width:100%;transform-origin:top left}.paper.quotation-document .info{gap:2.5mm 3mm;margin:4mm 0 3.5mm;padding:3mm}.paper.quotation-document .info div{min-height:12mm;padding:2.2mm 3mm}.paper.quotation-document .section{margin-top:3mm}.paper.quotation-document .section-title{padding:2.3mm 3.5mm}.paper.quotation-document .detail th,.paper.quotation-document .detail td{padding:1.8mm 1.7mm}.paper.quotation-document .summary{margin-top:3mm}.paper.quotation-document .summary-row{min-height:9.5mm;padding:2mm 3mm}.paper.quotation-document .actual-summary{margin-top:2.5mm}.paper.quotation-document .note{margin-top:3mm;padding:2.5mm 3.5mm;line-height:1.4}.paper.quotation-document .sign{gap:14mm;margin-top:5mm}.paper.quotation-document .client-sign{padding-top:8mm}.paper.quotation-document .seal-wrap{height:26mm}.paper.quotation-document .seal{max-height:25mm}
    @media print{html,body{background:#fff}.toolbar{display:none!important}.paper{width:210mm;min-height:0;margin:0;padding:8mm 17mm 9mm;box-shadow:none}.section{break-inside:auto}.summary,.note,.sign{break-inside:avoid}}
    @media screen and (max-width:850px){.paper{margin:0;transform-origin:top left;transform:scale(calc(100vw / 794));}.toolbar{width:100vw}}
  </style>
</head>
<body>
  <div class="toolbar"><button onclick="printDocument()">匯出 PDF／列印</button><button class="close" onclick="closePrintView()">關閉</button></div>
  <main class="paper" id="paper"></main>
  <script>
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const n=v=>Number(v)||0;
    const m=v=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n(v));
    const q=v=>v===null||v===undefined||v===''?'—':new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(n(v));
    function closePrintView(){const current=location.href;try{window.close()}catch(e){}setTimeout(()=>{if(window.closed)return;if(history.length>1){try{history.back()}catch(e){}setTimeout(()=>{if(location.href===current)location.replace(new URL('index.html',location.href).href)},400)}else location.replace(new URL('index.html',location.href).href)},100)}
    function removeSealBackground(image){const canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;const context=canvas.getContext('2d');context.drawImage(image,0,0);const pixels=context.getImageData(0,0,canvas.width,canvas.height);for(let index=0;index<pixels.data.length;index+=4){if(pixels.data[index]>235&&pixels.data[index+1]>235&&pixels.data[index+2]>235){pixels.data[index]=255;pixels.data[index+1]=255;pixels.data[index+2]=255}}context.putImageData(pixels,0,0);image.src=canvas.toDataURL('image/png')}
    let d={};try{d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(1))))))}catch(e){document.getElementById('paper').innerHTML='<p class="empty">無法讀取文件資料</p>'}
    const lines=Array.isArray(d.lines)?d.lines:[],allLinesActual=lines.length>0&&lines.every(line=>line.pricingType==='actual'),c=d.company||{},isQuote=d.documentType==='quotation',isActual=isQuote&&(d.pricingMode==='actual'||d.pricingMode==='mixed'&&allLinesActual),hasTax=isQuote||d.invoiceStatus!=='no_invoice',retention=n(d.retentionAmount),companyInfo=[c.taxId&&'統編 '+c.taxId,c.address,c.phone,c.line&&'LINE：'+c.line].filter(Boolean),houses=[...new Set(lines.map(x=>x.house).filter(Boolean))],items=[...new Set(lines.map(x=>x.item).filter(Boolean))],sum=(rows,key)=>rows.reduce((total,row)=>total+n(row[key]),0);
    const matrix=!isQuote&&houses.length?`<section class="section"><div class="section-title">戶別施工統計</div><table class="matrix"><thead><tr><th>戶別</th>${items.map(item=>`<th>${esc(item)}</th>`).join('')}<th>統計</th></tr></thead><tbody>${houses.map(house=>{const rows=lines.filter(row=>row.house===house);return`<tr><td>${esc(house)}</td>${items.map(item=>`<td>${q(sum(rows.filter(row=>row.item===item),'qty'))}</td>`).join('')}<td>${q(sum(rows,'qty'))}</td></tr>`}).join('')}<tr class="grand"><td>合計</td>${items.map(item=>`<td>${q(sum(lines.filter(row=>row.item===item),'qty'))}</td>`).join('')}<td>${q(sum(lines,'qty'))}</td></tr></tbody></table></section>`:'';
    const quoteRows=lines.map(x=>isActual?`<tr><td class="item">${esc(x.item||'—')}${x.isBackupPrice===true?'<span class="actual-note">備用單價</span>':''}</td><td class="center">${esc(x.unit||'—')}</td><td class="num">${q(x.qty)}</td><td class="num">${x.price===null||x.price===undefined?'—':m(x.price)}</td></tr>`:`<tr><td class="item">${esc(x.item||'—')}${x.pricingType==='actual'?'<span class="actual-note">實做實算</span>':''}</td><td class="center">${esc(x.unit||'—')}</td><td class="num">${q(x.qty)}</td><td class="num">${x.price===null||x.price===undefined?'—':m(x.price)}</td><td class="num">${m(x.amount)}</td></tr>`).join('');
    // PDF display grouping only: keep the published line amounts and pricing behavior intact.
    const billingGroups=new Map();
    if(!isQuote)lines.forEach(line=>{const key=JSON.stringify([line.item,line.unit,line.price,line.sourcePricingType||'']);let group=billingGroups.get(key);if(!group){group={...line,qty:0,amount:0};billingGroups.set(key,group)}group.qty+=n(line.qty);group.amount+=n(line.amount)});
    const billingRows=[...billingGroups.values()].map(x=>`<tr><td class="item">${esc(x.item||'—')}</td><td class="center">${esc(x.unit||'—')}</td><td class="num">${q(x.qty)}</td><td class="num">${x.price===null||x.price===undefined?'—':m(x.price)}</td><td class="num">${m(x.amount)}</td></tr>`).join('');
    const billingDetailTotal=!isQuote&&hasTax&&d.taxMode==='含稅'?d.totalAmount:d.salesAmount;
    const detail=isQuote?(isActual?`<section class="section"><div class="section-title">施工明細</div><table class="detail"><colgroup><col style="width:44%"><col style="width:18%"><col style="width:18%"><col style="width:20%"></colgroup><thead><tr><th>品名</th><th>單位</th><th>數量</th><th>單價</th></tr></thead><tbody>${quoteRows||'<tr><td class="empty" colspan="4">無明細資料</td></tr>'}</tbody></table></section>`:`<section class="section"><div class="section-title">施工明細</div><table class="detail"><colgroup><col style="width:38%"><col style="width:15.5%"><col style="width:15.5%"><col style="width:15.5%"><col style="width:15.5%"></colgroup><thead><tr><th>品名</th><th>單位</th><th>數量</th><th>單價${hasTax?'(未稅)':''}</th><th>金額${hasTax?'(未稅)':''}</th></tr></thead><tbody>${quoteRows||'<tr><td class="empty" colspan="5">無明細資料</td></tr>'}<tr class="line-total"><td colspan="4">明細合計</td><td class="num">${m(d.salesAmount)}</td></tr></tbody></table></section>`):`<section class="section"><div class="section-title">施工項目彙總</div><table class="detail"><colgroup><col style="width:40%"><col style="width:10%"><col style="width:14%"><col style="width:17%"><col style="width:19%"></colgroup><thead><tr><th>施工項目</th><th>單位</th><th>總數量</th><th>單價</th><th>小計</th></tr></thead><tbody>${billingRows||'<tr><td class="empty" colspan="5">無明細資料</td></tr>'}<tr class="line-total"><td colspan="4">明細合計</td><td class="num">${m(billingDetailTotal)}</td></tr></tbody></table></section>`;
    const summary=isActual?`<div class="actual-summary">實做實算</div>`:hasTax?`<section class="summary"><div class="summary-row"><span>未稅金額</span><strong>${m(d.salesAmount)}</strong></div><div class="summary-row"><span>${isQuote?'稅金（5%）':'營業稅'}</span><strong>${m(d.taxAmount)}</strong></div><div class="summary-row total"><span>${isQuote?'含稅總價':'請款金額'}</span><strong>${m(d.totalAmount)}</strong></div>${!isQuote&&retention>0?`<div class="summary-row"><span>保留款</span><strong>-${m(retention)}</strong></div><div class="summary-row receivable"><span>本期實領／應收</span><strong>${m(d.receivableAmount)}</strong></div>`:''}</section>`:`<section class="summary"><div class="summary-row total"><span>請款金額</span><strong>${m(d.totalAmount)}</strong></div>${retention>0?`<div class="summary-row"><span>保留款</span><strong>-${m(retention)}</strong></div><div class="summary-row receivable"><span>本期實領／應收</span><strong>${m(d.receivableAmount)}</strong></div>`:''}</section>`;
    document.title=d.fileName||d.title||'酷舍對外文件';const paper=document.getElementById('paper');paper.classList.toggle('billing-document',!isQuote);paper.classList.toggle('quotation-document',isQuote);paper.innerHTML=`<header class="head"><div class="company-block"><span class="company-logo-frame"><img class="company-logo" id="formalCompanyLogo" alt="酷舍企業" onerror="this.hidden=true"></span><div class="company"><h1>${esc(c.name||'酷舍企業有限公司')}</h1><div class="en">${esc(c.englishName||'Cool Sir Limited Company')}</div><div class="sub">${companyInfo.map(value=>`<span>${esc(value)}</span>`).join('')}</div></div></div><div class="doc-title"><h2>${esc(d.title||'請款單')}</h2></div></header><section class="info"><div><span class="label">客戶</span>${esc(d.customer||'—')}</div><div><span class="label">案場</span>${esc(d.project||'—')}</div><div><span class="label">日期</span>${esc(d.date||'—')}</div>${isActual?`<div><span class="label">稅別</span>${esc(d.taxMode==='含稅'?'含稅':'未稅')}</div>`:`<div><span class="label">稅額方式</span>${esc(d.taxMode||'—')}</div>`}</section>${matrix}${detail}${summary}${d.publicNote?`<section class="note"><b>備註：</b><br>${esc(d.publicNote)}</section>`:''}<section class="sign"><div class="client-sign">客戶簽章</div><div class="company-seals"><div>公司大小章</div><div class="seal-wrap"><img class="seal" id="formalCompanySeal" alt="公司大小章" onerror="this.hidden=true"></div></div></section>`;if(isQuote)paper.innerHTML=`<div class="quotation-content" id="quotationContent">${paper.innerHTML}</div>`;
    async function loadAssets(){const enterpriseUrl=/\/beta(?:\/|$)/.test(window.location.pathname)?'../enterprise/index.html':'./enterprise/index.html';try{const source=await fetch(enterpriseUrl).then(r=>r.text());for(const [name,id] of [['companyLogoAsset','formalCompanyLogo'],['companySealAsset','formalCompanySeal']]){const start=source.indexOf('const '+name+'=');if(start<0)continue;let end=source.indexOf(';\n',start);if(end<0)end=source.indexOf(';\r',start);const parts=[...source.slice(start,end).matchAll(/'([^']*)'/g)].map(x=>x[1]);if(parts.length){const image=document.getElementById(id);if(id==='formalCompanySeal')image.onload=()=>{image.onload=null;removeSealBackground(image)};image.src=parts.join('');if(id==='formalCompanyLogo')image.style.display='block'}}}catch(e){}}
    const nextFrame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
    const assetTimeout=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));
    async function waitForStableImage(image){if(!image||!image.src)return;for(let attempt=0;attempt<4;attempt+=1){const source=image.currentSrc||image.src;if(!image.complete)await Promise.race([new Promise(resolve=>{image.addEventListener('load',resolve,{once:true});image.addEventListener('error',resolve,{once:true})}),assetTimeout(2000)]);try{if(image.decode)await Promise.race([image.decode(),assetTimeout(2000)])}catch(e){}await nextFrame();if(image.complete&&(image.currentSrc||image.src)===source)return}}
    function millimetersToPixels(mm){const ruler=document.createElement('div');ruler.style.cssText=`position:absolute;visibility:hidden;pointer-events:none;height:${mm}mm`;document.body.appendChild(ruler);const pixels=ruler.getBoundingClientRect().height;ruler.remove();return pixels}
    async function fitQuotationToA4(){const content=document.getElementById('quotationContent');if(!content)return 1;const targetHeight=millimetersToPixels(277.5);content.style.zoom='1';content.style.width='100%';await nextFrame();await nextFrame();const naturalHeight=content.getBoundingClientRect().height;let scale=naturalHeight>targetHeight?Math.min(1,targetHeight/naturalHeight*.995):1;for(let attempt=0;attempt<4;attempt+=1){content.style.zoom=String(scale);content.style.width=`${100/scale}%`;await nextFrame();await nextFrame();const height=content.getBoundingClientRect().height;if(height<=targetHeight+.5)break;scale=Math.max(.7,scale*(targetHeight/height)*.995)}paper.dataset.quotationScale=scale.toFixed(4);window.__quotationPrintScale=scale;return scale}
    async function prepareQuotationPrint(){await loadAssets();try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}await Promise.all([...document.querySelectorAll('#quotationContent img')].map(waitForStableImage));await nextFrame();await nextFrame();return fitQuotationToA4()}
    const autoPrint=new URLSearchParams(location.search).get('print')==='1';let quotationPrintReady=Promise.resolve(1);function printDocument(){if(isQuote)quotationPrintReady.then(()=>window.print());else window.print()}
    if(isQuote){quotationPrintReady=prepareQuotationPrint().catch(()=>fitQuotationToA4());quotationPrintReady.then(()=>{window.__billingPrintReady=true;if(autoPrint)requestAnimationFrame(()=>window.print())})}else loadAssets().finally(()=>{window.__billingPrintReady=true;if(autoPrint)setTimeout(()=>window.print(),250)});
  </script>
</body>
</html>
